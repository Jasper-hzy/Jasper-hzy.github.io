>↗</span></a><a class="article" href="/notes/ee4541ede89330a8/"><div class="meta"><span class="number">06</span><span>Android / 系统原理</span></div><h3>WindowManagerService 窗口管理流程</h3><p></p><span class="arrow" aria-hidden="true">↗</span></a><a class="article" href="/notes/9e5b0f3f4ca04e76/"><div class="meta"><span class="number">07</span><span>Android / 系统原理</span></div><h3>Input 输入系统流程</h3><p></p><span class="arrow" aria-hidden="true">↗</span></a><a class="article" href="/notes/df4027642366e720/"><div class="meta"><span class="number">08</span><span>Android / 系统原理</span></div><h3>Activity 启动与显示流程</h3><p></p><span class="arrow" aria-hidden="true">↗</span></a></div><button class="more" id="more">继续阅读 ↓</button></section></div></main><footer><span>持续记录，保持好奇。</span><span>保持热爱，奔赴山海。</span></footer><script type="application/json" id="archive-data">[{"title":"系统启动流程","url":"/notes/1c136c4416d06071/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" 系统启动流程 Android 启动链路可以先抓住一条主线：Linux 内核启动 init ， init 拉起 Android 用户空间的基础进程，Zygote fork 出 system_server 和普通 App 进程， system_server 启动 Framework 系统服务，最后启动 Launcher 让系统进入可交互状态。 [Android 系统启动流程总览] 从内核进入 Android 用户空间 Bootloader 和 Kernel Bootloader 负责初始化基础硬件、校验并加载系统镜像，然后把控制权交给 Linux Kernel。Kernel 启动后初始化进程调度、内存管理、文件系统、网络、设备驱动，以及 Android 依赖的 Binder、input、display 等驱动能力。 Kernel 准备好用户空间后，会启动第一个用户空间进程： 所以 init 是 Android 用户空间的起点。 init：Android 用户空间起点 init 会解析 init.rc 、 init.zygote .rc 和厂商相关 rc 文件，拉起 Android 用户空间的基础 native 进程。 典型进程包括： 这里要区分两类服务： 类型 谁启动 例子 --- --- --- native service 多由 init 直接启动 servicemanager 、 surfaceflinger 、 audioserver 、 netd Framework service 多由 system_server 启动 AMS/ATMS、PMS、WMS、PowerManagerService servicemanager 是 Binder 服务目录，负责保存系统全局服务名到 Binder 引用的映射； surfaceflinger 是独立 native 进程，负责图层合成。它们不是 system_server 内部的 Java 服务。 Zygote：建立 Java 进程运行基础 init 启动 Zygote 后，Zygote 进入 Java 世界的初始化流程： Zygote 内部已经初始化 ART Runtime，并预加载 Framework 常用类和系统资源。后续 Java 进程通过 fork Zygote 创建，可以复用这些预加载结果，减少启动耗时和内存占用。 Zygote 会 fork 两类重要进程： 子进程 fork 时机 入口 职责 --- --- --- --- system_server Zygote 启动早期主动 fork SystemServer.main() 启动和承载 Framework 系统服务 普通 App 进程 AMS 请求启动应用时 fork ActivityThread.main() 运行 App 组件 fork 后不会“连带复制”之前已经 fork 出去的进程。 system_server 和普通 App 都是 Zygote 的子进程，但它们彼此是独立进程。 系统服务的启动、管理与发现 系统服务的承载进程、进程内生命周期管理器和跨进程服务目录承担不同职责。 system_server：Framework 服务进程 system_server 是 Zygote fork 出来的 Java/ART 进程，入口是： 它承载大量 Java Framework 系统服务，例如： system_server 维护的是系统全局状态和系统策略，例如进程状态、Activity/Task、安装包信息、窗口层级、焦点窗口、权限、电源和网络状态。App 不能直接访问这些对象，只能通过 Binder 调用对应系统服务。 典型访问链路是： SystemServiceManager：system_server 内部服务管理器 SystemServiceManager 不是进程，也不是 Binder 服务。它是 system_server 进程内由 SystemServer.run() 创建的 Java 对象，用来管理继承 SystemService 的服务生命周期。 mSystemServiceManager.startService(...) 的含义是启动并管理一个 Framework Service：创建服务对象、调用 onStart() 、后续按启动阶段调用 onBootPhase() 。 服务是否注册 Binder，要看具体服务自己的 onStart() ： 所以： ServiceManager 和 Binder 服务发现 servicemanager 是 native 进程，是 Binder 世界里的系统服务目录。普通进程通过 Binder driver 的特殊入口找到它，概念上可以理解为： 系统服务注册时： App 查系统服务时： 普通 App 自定义 Binder 服务通常不注册到全局 servicemanager ，而是通过 Service.onBind() 和 bindService() 交给 AMS 管理发现、权限和生命周期。两者底层都经过 Binder driver，区别在服务发现机制：系统服务靠 servicemanager 的名字表，App 服务靠 AMS 的组件绑定模型。 Launcher 启动与链路总结 Launcher：系统可交互入口 核心 Framework 服务启动完成后，AMS/ATMS 会启动桌面 Launcher。Launcher 本质也是一个 App，只是它响应 HOME Intent。 启动链路可以简化为： 所以“看到桌面”说明多条主链路已经跑通：PMS 能解析包和组件，AMS/ATMS 能启动 Activity，Zygote 能 fork App 进程，WMS 能接入窗口，SurfaceFlinger 能完成图层合成。 关键结论 1. init 是 PID 1，是 Android 用户空间起点。 2. init 拉起 Zygote 和一批 native 服务，例如 servicemanager 、 surfaceflinger 、 netd 。 3. Zygote 初始化 ART 和预加载资源，随后 fork system_server 和普通 App 进程。 4. system_server 运行 AMS、PMS、WMS 等 Java Framework 系统服务，维护系统全局状态。 5. SystemServiceManager 是 system_server 内部的服务生命周期管理器。 6. servicemanager 是 Binder 服务目录，负责系统服务名到 Binder 引用的发现。 7. Launcher 是系统启动后的 HOME Activity，是 Android 进入可交互状态的标志。 ","description":"","practiceLabel":""},{"title":"ART：JIT / AOT / Profile / GC","url":"/notes/51a85ec64df5a668/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" ART：JIT / AOT / Profile / GC ART 的执行模型 ART 运行与优化闭环 ART 决定 DEX 代码如何执行，也负责 Java 堆的对象分配与回收。它对启动速度的影响主要来自两条链路：代码是否需要解释或现场编译，以及启动阶段的对象分配是否触发 GC。 [ART 运行与优化闭环] 这套机制的核心不是在 JIT 和 AOT 之间二选一，而是让不同执行方式协同工作： 机制 作用 对启动的影响 --- --- --- Interpreter 直接解释 DEX 字节码 无编译等待，但执行速度较慢 JIT 运行时编译当前进程的热点方法 当前运行变快，但会消耗 CPU 和时间 AOT 运行前把选中的 DEX 方法编译为机器码 启动时可直接执行，但会增加编译耗时和磁盘占用 Profile 记录值得优化的类和方法 帮助 ART 只编译高价值代码 GC 回收 Java 堆中不再使用的对象 启动阶段分配过多时可能增加暂停和 CPU 开销 JIT 解决“当前这次运行尽快变快”，Profile 驱动的 AOT 解决“后续启动一开始就快”。热点代码与 dex2oat 并不冲突，热点 Profile 正是后台 AOT 选择编译目标的重要输入。 一次方法调用如何选择执行方式 主图中间部分展示了方法执行入口的选择：存在可用 AOT 代码时直接执行机器码；不存在时先进入解释器，达到热点阈值后再由 JIT 编译。 JIT 生成的机器码通常保存在当前进程的 JIT Code Cache 中，进程结束后不会直接成为下次启动可复用的 AOT 产物；但 ART 会把热点类和方法写入 Runtime Profile，供后续 dexopt 使用。 Profile 的来源、类型与生成 Profile 如何改善首次启动和后续启动 [Profile 对首次启动和后续启动的影响] Runtime Profile Runtime Profile 来自真实运行。目标方法第一次没有 AOT 代码时，可能先解释执行并在变热后被 JIT 编译；热点信息持久化后，设备可以在合适时机进行后台 dexopt，使后续启动使用 AOT 代码。 Baseline Profile Baseline Profile 随应用发布，提前描述启动和高频路径。系统拿到 Profile 后，可以在用户运行这些代码之前就对目标方法进行 AOT 编译，减少首次启动中的解释执行和 JIT 预热。 Cloud Profile Cloud Profile 通常来自应用商店聚合的真实用户热点数据。它与 Baseline Profile 的目标相同，都是提前告诉 ART 哪些代码值得编译；区别是 Baseline Profile 由开发者随版本维护，Cloud Profile 依赖商店分发和历史用户数据。 Profile 本身不保存机器码，它保存的是类和方法的选择信息。真正生成机器码的是 ART 编译链路中的 dex2oat 。 Baseline Profile 与 Startup Profile Profile 主要使用者 优化对象 主要收益 --- --- --- --- Baseline Profile ART / dexopt 哪些类和方法进行 AOT 编译 减少解释执行和 JIT 预热 Startup Profile R8 / D8 启动代码在 DEX 中的排列 提高代码局部性，减少启动阶段的缺页和随机读取 Baseline Profile 决定“哪些代码提前编译”，Startup Profile 决定“启动代码在 DEX 中如何排列”。两者并不冲突，可以同时使用。 热点清单如何变成二进制 Profile 开发者维护的是“哪些类和方法值得优化”，设备消费的是与具体 DEX 匹配的二进制 Profile，不是提前生成的机器码。 标准 Baseline Profile 工具链可以自动化采集与生成；自定义 Dynamic Feature（DF，动态功能模块）方案需要在采集和构建阶段接入脚本或插件。业务代码不需要逐个方法手动上报热点。可读清单可以跨版本复用，但不能直接把旧版本二进制 Profile 塞进新 APK：它必须匹配最终 DEX。 H / S / P 标记的含义 第一行是类规则，后两行是方法规则；方法名前的字母描述执行特征。 标记 含义 用途与边界 --- --- --- H：Hot 方法被标记为热点 speed-profile 选择 AOT 方法的重要依据 S：Startup 方法在启动阶段执行 提供启动路径信息；是否选入 AOT 还受 ART 版本、内存模式等策略影响 P：Post startup 方法在启动之后执行 提供启动后使用信息；仅有 P 不代表一定生成 AOT 机器码 三者是可组合的标记，不是三档优化级别。 HSP 表示一个方法同时具备这些特征；S 也不等于构建期的 Startup Profile 文件。 例如 AOSP main 的 ShouldCompileBasedOnProfile() 先检查 H，非低内存模式下还会考虑 S，因此不能把规则简化成“只有 H 才编译”。后续仍有其他编译资格判断。[源码：CompilerDriver] baseline.prof 内部保存什么 以应用 Profile 的 015 格式为例，它是 ART 自定义二进制格式，不是文本清单、JSON 或 OAT。不同版本格式可能不同。 实际格式使用索引、位图等紧凑表示，部分分区可以压缩；不是反复保存每个方法的完整签名。DEX 标识和 checksum 用于匹配代码，Profile 本身没有方法实现。[源码：ProfileCompilationInfo] 安装与运行阶段如何消费编译产物 DF 的 Profile 如何在安装期生效 关键是让系统为实际安装的 split DEX 找到有效 Profile。只覆盖 base APK 的热点清单，不能保证 DF 内的代码也得到优化。 不同分发路径由谁读取 载体 读取方与时机 首次启动边界 --- --- --- 安装时提供的 .dm （DEX metadata） 安装 / dexopt 链路使用其中的 Profile 安装策略允许时可在首次运行前编译 assets/dexopt/baseline.prof （按工具链需要配合 .profm ） AndroidX ProfileInstaller 在 App 运行后安装本地 Profile；商店也可提取转换后在安装时分发 仅靠 App 内 ProfileInstaller 写入，不等于这次首次启动已经完成 AOT assets/art-profile/baseline.prof 支持 embedded profile 的系统 ART 链路从 APK 提取 能否安装期使用取决于系统版本、Profile 来源选择和编译策略 embedded profile 的完整链路 这里的“注入”是签名前加入打包资源，不是运行时 Hook。系统已有可用 Profile 或外部 .dm 等来源时，不一定选择 APK 内嵌版本；放进 assets 也不等于强制执行 speed-profile 。 版本边界：AOSP 后续将 embedded profile 的入口限制为 enableEmbeddedProfile \u0026\u0026 SdkLevel.isAtLeastV() ，即配置允许且 Android 15 / API 35 及以上。不能因为 Android 14 的 ART 中已有相关代码，就认为它已启用；具体设备仍应核对实际系统实现。[AOSP：限制 embedded profile 到 V+] 按需下载的 DF 在首次安装主包时尚不存在，其编译发生在模块安装等后续时机。 工程验证要连起来看：最终 split 中是否包含正确 Profile、Profile 是否匹配 DEX、安装 dexopt 实际采用什么来源和 compiler filter、目标方法是否有可用编译代码，以及首次启动耗时是否改善。仅检查 .art 是否存在不足以证明方案生效。 .odex / .vdex / .art 如何加速运行 产物 主要内容 加速的环节 --- --- --- .odex 通常是 ELF/OAT 格式，包含已编译方法的机器码及相关元数据 对可用的已编译方法，直接执行机器码，减少解释执行与 JIT 预热 .vdex DEX 校验相关元数据；部分版本或配置还包含 DEX 依赖等条件仍有效时复用校验工作，减少重复处理 .art 可选 App Image，保存部分字符串、类等 ART 内部对象表示 加载、映射并接入运行时后，减少部分对象准备工作 三者是互补产物，不是 .odex → .vdex → .art 的顺序转换，也不与 H/S/P 一一对应。扩展名、内容和是否生成会随 Android 版本及配置变化。[AOSP：ART 产物说明] .art 不是整个 App 的运行快照，不保存任意登录状态或 Activity 状态，也不是安装时执行业务 onCreate() 后存档。 .odex 文件存在同样不代表所有目标方法已编译，仍需确认实际编译策略与内容。 JIT 的机器码则通常在当前进程的内存 Code Cache 中；落盘的热点 Profile 是后续 AOT 的输入，不是把 JIT Code Cache 原样保存成 .odex 。普通应用分发 Profile，由设备生成与其指令集和 ART 环境匹配的产物，不宜直接跨设备下发 .odex/.art/.vdex 。 为什么不对所有 DEX 做全量 AOT 全量 AOT 会让安装和系统升级时编译更久、占用更多磁盘，并为大量低频代码付出没有收益的编译成本。Profile-guided AOT 只提前编译启动和热点代码，运行中新热点交给 JIT，低频冷代码继续由解释器执行。 因此常见的 speed-profile 策略，是在启动速度、运行性能、安装时间和磁盘空间之间做折中。 启动优化目标与作用边界 代码编译只是启动链路的一部分，收益判断需要同时排除初始化、I/O 与首帧绘制等因素。 核心结论：提前提供 Profile，让设备提前编译关键代码 启动优化方案是：开发阶段采集启动和高频路径，构建时生成与最终 DEX 匹配的二进制 Profile 并随包发布，让支持它的安装链路在首次运行前完成针对性 AOT 编译，减少解释执行和 JIT 预热。 assets 中保存的是二进制热点信息，不是机器码；机器码由设备侧 dex2oat 生成。放进 assets 也不等于安装时必然自动编译： - assets/art-profile/baseline.prof ：内嵌 Profile 方案，需要系统支持并启用，且安装编译策略允许；AOSP 的相关入口限制为 Android 15 / API 35 及以上。 - assets/dexopt/baseline.prof ：常规 Baseline Profile 路径，商店可配合安装期分发；仅靠 App 内的 ProfileInstaller ，则是在 App 运行后写入 Profile，供后续 dexopt 使用，不能据此保证这次首次启动已获 AOT 优化。 收益是减少运行时编译与解释开销，代价是提前编译的 CPU、时间和产物空间；它不能替代主线程 I/O、初始化任务和首帧渲染优化。分发与版本边界参见“DF 的 Profile 如何在安装期生效”一节。 GC 与编译链路的边界 ART 内部链路 主要环节 --- --- 代码执行 DEX 加载与校验、Interpreter、JIT、Profile、AOT / dex2oat Java 堆管理 对象分配、GC Roots、标记、回收或整理、暂停与并发阶段 GC 不参与方法选择 Interpreter、JIT 还是 AOT。它影响启动速度，是因为 Application 、 Activity 、依赖注入、反射和 View 创建可能在短时间内产生大量对象： 主图右下角展示了这条链路：大量对象分配使 Java 堆快速增长，达到条件后触发 GC；GC 的并发工作会竞争 CPU，必要的线程暂停则可能直接影响首帧。 所以启动优化需要分别观察：启动路径的代码有没有得到正确编译，以及启动阶段是否存在不必要的对象分配和 GC。 与 App 启动速度的关系 完整的 App 启动还包括 Zygote fork 与进程 attach、 Application / Provider / Activity 初始化、文件与网络 I/O，以及首帧 measure / layout / draw / 上屏。 ART 主要影响类加载、代码执行和 Java 堆管理，不等于完整的 App 启动链路。即使关键方法已经 AOT，主线程 I/O、复杂初始化或首帧渲染仍然可能拖慢启动。 Application、Provider、配置存储、启动任务和 SO 准备等进程内关键路径，也需要独立测量，避免将其他环节的收益归因于 ART。 源码入口与参考资料 源码阅读主线 [ART 源码阅读主线] Android 14 及以后，设备侧 dexopt 主要由 ART Service 协调；Android 13 及以前主要由 Package Manager 相关流程协调。具体源码分析时需要先确定 Android 版本。 参考资料 - [AOSP：Configure ART] - [AOSP：ART Service configuration] - [Android Developers：Baseline Profiles overview] - [Android Developers：手动生成 Profile 与 H/S/P 规则] - [Android Developers：App startup best practices] ","description":"","practiceLabel":""},{"title":"SystemServer 启动服务流程","url":"/notes/579943f755f56d07/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" SystemServer 启动服务流程 SystemServer 是 system_server 进程里的 Java 入口类，负责把 Android Framework 的系统服务按依赖顺序启动起来。它本身不是具体业务能力的实现，真正的系统逻辑分散在 AMS、PMS、WMS、Power、Display、Input 等服务里。 启动入口与服务管理器 整体主线 这条主线解决的是： system_server 进程启动后，Framework 服务体系如何从无到有地建立起来。 不同 Android 版本会增删服务或调整局部位置。这里重点理解 bootstrap、core、other、ready 四个阶段，不把服务列表当作需要背诵的严格逐行顺序。 SystemContext 和 SystemServiceManager SystemContext 是 system_server 内部服务使用的系统级 Context，后续服务访问资源、包信息、配置、ContentResolver 等能力时会依赖它。 SystemServiceManager 是服务生命周期管理器，负责启动继承 SystemService 的服务，并在系统启动阶段变化时通知它们。 它和 servicemanager 不是一个东西： 名称 位置 职责 --- --- --- SystemServiceManager system_server 进程内 Java 对象 管理 Framework Service 生命周期 servicemanager init 启动的 native 进程 保存 Binder 服务名到 Binder 引用的映射 ServiceManager Java 工具类 通过 Binder 调用 native servicemanager 按依赖顺序启动三类服务 startBootstrapServices：启动系统底座 startBootstrapServices() 启动后续服务依赖的基础能力，典型包括： 这一阶段可以理解为：先把后续服务普遍依赖的进程、包、用户、电源和显示等底座建立起来。具体服务之间仍会按照源码依赖穿插初始化。 比如： - PMS 提供已安装包、Manifest、组件和权限基础信息。 - AMS/ATMS 提供进程、Activity、Task、Service、Broadcast 的调度能力。 - Power 和 Display 提供启动期间的电源与显示基础状态。 如果这些底座没起来，后续服务就无法安全地查包、查权限、启动组件或接入显示。 startCoreServices：启动核心运行态服务 startCoreServices() 启动少量系统运行态核心服务。它们很重要，但通常不是最底层的启动依赖。 常见服务包括： 这一阶段可以理解为：系统基础调度能力已建立，开始补齐运行态统计、状态感知和核心组件管理能力。 startOtherServices：启动功能型服务 startOtherServices() 是最大的一段，会启动大量面向系统功能的服务。典型包括： 这些服务数量多、依赖广，所以通常放在 bootstrap/core 之后启动。 这里知道 WMS 需要与 ATMS/AMS、Display 和 Input 建立协作关系即可，不需要在总览文档里背它们相互注入的每一行调用。 其他服务的依赖例如： - Notification 需要包、权限、用户状态。 - Connectivity 依赖底层网络服务和系统网络状态。 - Location 依赖权限、AppOps、用户和后台限制。 阶段通知与应用运行准备 boot phase：服务启动后的阶段通知 服务 onStart() 执行完，不代表它已经可以做所有事情。Android 还会用 boot phase 通知服务当前系统启动到了哪个阶段。 常见阶段包括： boot phase 的意义是把“创建服务对象”和“依赖 ready 后继续初始化”拆开，避免服务在依赖还没准备好时做过早操作。 boot phase 不是等 startOtherServices() 全部结束后一次性发送。 SystemServer 会在启动过程中按依赖穿插推进，例如 PMS 前等待默认 Display，核心服务完成后再进入 ActivityManager Ready 和允许第三方 App 启动等阶段。 AMS.systemReady：从服务初始化进入应用运行 当 PMS、WMS、Input、Display 等核心链路准备完成后， SystemServer 会显式调用： 这一步不是创建 AMS，而是告诉 AMS：核心系统服务已经准备完成，可以进入启动系统应用和普通应用的阶段。 因此只需区分：服务对象创建、服务 ready、允许应用启动是三个不同阶段。 设计取舍 Framework 服务之间依赖复杂，不能无序启动。 SystemServer 通过分阶段启动解决三个问题： 1. 依赖顺序：先建立进程和 Activity 调度底座，再补齐电源、显示、包、窗口和输入，最后启动依赖它们的功能服务。 2. 生命周期统一：继承 SystemService 的服务由 SystemServiceManager 统一启动和分发 boot phase。 3. 对外可用时机：服务创建、Binder 注册、系统 ready、三方 App 可启动是不同阶段，不能混成一步。 一句话概括： ","description":"","practiceLabel":""},{"title":"PackageManagerService 包扫描与安装流程","url":"/notes/08d2a56a2a759fce/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" PackageManagerService 包扫描与安装流程 PackageManagerService ，简称 PMS，是 Android 的包与组件索引中心。它让系统知道设备上有哪些应用、每个应用声明了哪些组件、组件能响应什么 Intent，以及包对应的 uid、签名、权限和安装状态。 一句话概括： PMS 的职责范围 PMS 主要维护静态包信息和组件信息。系统里很多运行时动作都要先问 PMS： - Launcher 要显示桌面图标，需要查询哪些 Activity 声明了 CATEGORY_LAUNCHER 。 - AMS/ATMS 要启动 Activity，需要 PMS 返回目标 ActivityInfo 。 - 权限系统要判断调用方能力，需要 PMS 提供包、uid、签名和权限声明。 - 安装、更新、卸载应用时，需要 PMS 更新包状态和持久化记录。 所以 PMS 不是只管理 APK 文件，而是管理“包在系统里的结构化信息”。 开机如何建立包与组件视图 开机扫描：系统有哪些包 PMS 启动时会扫描系统分区和数据分区里的包。常见目录包括： 可以先按两大类理解： 来源 典型路径 含义 --- --- --- 系统分区 /system 、 /product 、 /vendor 、 /system_ext 等 系统预装应用、特权应用、厂商应用 数据分区 /data/app 用户安装应用、系统应用更新包 安装 APK 时，APK 本体通常进入 /data/app ； /data/data/\u003cpackage 或 /data/user/0/\u003cpackage 是应用运行数据目录，不是 PMS 扫描 APK 的主要位置。 包状态：不只是扫描 APK 开机扫描不是简单遍历 APK。PMS 还会读取历史包状态，并和磁盘扫描结果合并。常见状态文件包括： 可以这样区分： 包状态里会包含： - appId / uid。 - 签名信息。 - 权限授予状态。 - enabled / disabled 状态。 - 安装用户和多用户状态。 - 版本、安装路径、系统 App 更新状态。 因此 PMS 启动时做的是： Manifest 解析：系统有哪些组件 PMS 解析 APK 里的 AndroidManifest.xml 后，会建立一组组件和权限索引。 核心信息包括： 例如一个 Activity 声明： PMS 解析后就知道：这个 Activity 可以作为桌面入口，被 Launcher 查询并展示。 如果某个 Activity 声明 CATEGORY_HOME ，PMS 就会把它纳入 HOME Activity 候选，供 AMS/ATMS 启动 Launcher 时解析。 安装流程如何更新包状态 安装不是单纯复制 APK。典型链路可以概括为： 安装完成后，新包进入 PMS 的内存索引和持久化状态。下次开机时，PMS 通过扫描 /data/app 并读取 packages.xml 恢复这个应用。 系统 App 更新也会走 PMS 状态管理：系统分区里的原始 APK 仍在，只读不可删；更新包可以放在 /data/app ，PMS 根据版本、签名和状态决定当前使用哪个版本。 PMS、Installer 与 installd 安装流程里的 Installer 不是应用商店，也不是 App 侧提交安装会话使用的 PackageInstaller 。它是 system_server 中访问 native installd 服务的 Java 封装。 几者的职责可以这样区分： 对象 职责 --- --- PackageInstaller 创建和提交安装会话，把安装请求交给系统 PMS 解析 APK、校验签名和版本，管理 uid、权限、组件及包状态 Installer system_server 中调用 installd 的 Java 接口封装 installd native daemon，执行应用目录、缓存、dexopt、profile 等底层操作 例如安装过程中需要准备应用数据时，概念链路是： 因此 PMS 负责“这个包在系统里是什么状态”， installd 负责“把相应的文件和数据操作真正落到磁盘”。 应用启动中的协作与结论 PMS 如何支撑 Launcher 和 App 启动 系统启动 Launcher 时： Launcher 展示桌面图标时： 用户点击图标启动普通 App 时： PMS 在这里负责提供静态信息： - 目标 Activity 是否存在。 - 它属于哪个 package。 - 它的 processName 、 uid 、 targetSdk 是什么。 - exported 、权限和签名状态是否满足。 AMS/ATMS 则负责运行时调度：进程、任务栈、生命周期和前后台状态。 关键结论 1. PMS 是系统的包与组件索引中心。 2. 开机时，PMS 扫描系统分区和 /data/app ，并结合 packages.xml 恢复包状态。 3. 安装时，APK 本体进入 /data/app ； /data/data 或 /data/user/0 是应用数据目录。 4. PMS 解析 Manifest 后建立组件、IntentFilter、权限、签名、uid 等索引。 5. Launcher 的 HOME 入口和桌面图标列表都依赖 PMS 的 Intent 解析结果。 6. PMS 负责“有什么”，AMS/ATMS 负责“怎么运行”。 ","description":"","practiceLabel":""},{"title":"ATMS 与 AMS","url":"/notes/84363bcc3e1a6595/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" ATMS 与 AMS ATMS 和 AMS 都运行在 system_server 中，但管理对象不同： 一次 Activity 冷启动以 ATMS 为主线。ATMS 会先判断目标进程是否已经完成 attach，并向 system_server 提供了可用的 ApplicationThread Binder；如果还不能通知 App 主线程创建 Activity，就请求 AMS 确保目标进程可用。AMS 再根据真实进程状态决定复用正在启动的进程，还是请求 Zygote fork 新进程。 职责边界：任务管理与进程管理 为什么同时有 ATMS 和 AMS 早期 Android 的 Activity、Task 和进程调度大量集中在 ActivityManagerService 中。随着窗口和多显示等能力变复杂，Activity 与 Task 相关逻辑逐步拆到 ActivityTaskManagerService 。 因此旧版本资料经常把 Activity 启动统称为 AMS 流程；在较新的 Android 中，需要区分： ATMS 的主要作用 ATMS 全称是 ActivityTaskManagerService ，主要管理 Activity 和 Task。 1. Activity 启动 ATMS 接收 App 发起的 startActivity 请求，然后处理： - Intent 对应哪个目标 Activity。 - 调用方是否允许启动目标组件。 - 目标 Activity 是否已经存在。 - 当前顶部 Activity 是否需要 pause。 - 新 Activity 应该何时创建和 resume。 ATMS 不直接解析 APK，而是使用 PMS 提供的 ActivityInfo 、 ApplicationInfo 等静态包信息。 2. Task 管理 ATMS 根据以下信息决定 Activity 放入哪个 Task： - launchMode 。 - Intent flags，例如 NEW_TASK 、 CLEAR_TOP 。 - taskAffinity 。 - 当前已有 Task 和 Activity 状态。 常见管理对象包括： 3. Activity 生命周期调度 ATMS 维护的不是 App 中真实的 Activity 对象，而是 ActivityRecord 。它根据系统全局状态决定： 真正的生命周期方法仍然在 App 主线程中执行。ATMS 通过 Binder 事务通知 App 进程完成相应操作。 AMS 的主要作用 AMS 全称是 ActivityManagerService 。它的核心职责是管理应用进程和 Android 组件的运行状态。 1. 应用进程管理 AMS 负责： - 判断目标进程是否已经存在。 - 目标进程不存在时请求 Zygote fork。 - 保存 pid、uid、进程名和组件状态。 - 维护进程优先级和 OOM 调整值。 - 处理进程死亡以及组件后续恢复。 主要记录对象是： 进程启动链路可以简化为： 2. App 进程 attach Zygote fork 后，子分支已经是目标 App 进程。App 主线程进入： App 会把 ApplicationThread Binder 对象交给 AMS。之后 system_server 可以通过这个 Binder 通道通知 App： - 创建 Application。 - 调度 Activity 生命周期。 - 创建 Service。 - 分发 Receiver。 - 处理配置和内存状态变化。 ActivityThread 不是 Java Thread ，而是 App 主线程的组件和事务管理对象。 3. Service、Broadcast、Provider 除了进程管理，AMS 还负责这些组件的运行态调度： PMS 保存这些组件在 Manifest 中的静态声明；AMS 负责它们运行时如何启动、连接和结束。 4. 进程优先级 AMS 会根据进程当前承载的组件和用户可感知程度计算进程状态，例如： 随后调整 oom_adj 等状态，内存不足时由 LMKD 和内核优先回收重要性较低的进程。Activity 退出后进程不一定立即结束，保留缓存进程可以加快下次启动。 一次启动中的跨进程协作 ApplicationThread：system_server 如何反向调用 App system_server 和普通 App 都由 Zygote fork，但 fork 后是彼此独立的进程。App 可以通过 IActivityManager 、 IActivityTaskManager 等 Binder Proxy 调用系统服务；系统服务要反向调度 App，则需要 App 主动提供一个 Binder 回调接口。 App 进程启动后会创建： ApplicationThread 继承 IApplicationThread.Stub 。它不是 Java 线程，而是 App 进程中的 Binder Stub： 跨进程后，两端看到的对象不同： ATMS/AMS 后续可以通过这个 Proxy 通知 App： Binder 事务到达 App 时可能先由 Binder 线程接收， ApplicationThread 会把 Activity 事务投递到主线程 Looper，所以 Activity.onCreate() 、 onResume() 等生命周期仍然在 App 主线程执行。 两条调用方向可以对照理解： 这也是系统服务实现跨进程回调的通用方式：App 注册一个 Binder Callback Stub，系统服务保存对应的远程 Binder 引用，事件发生后再通过它回调 App。例如广播分发使用 IIntentReceiver ， bindService 的连接结果使用 IServiceConnection 。 ATMS 和 AMS 怎么协作 Activity 冷启动的关键交接关系是： 这里是两阶段判断，不是 ATMS 取代 AMS 管理进程： ATMS 之所以需要先看一次，是因为 Activity 对象要在目标 App 的主线程中创建。目标进程完成 attach 后，ATMS 才能通过 ApplicationThread Binder 把 LaunchActivityItem 等事务发送给 App。ATMS 关心的是“现在能不能通知 App 创建 Activity”，不是完整的进程生命周期。 如果进程已经 attach，ATMS 可以直接下发 Activity 事务： 因此可以记成： Application 与 Activity 的创建顺序 冷启动时不是 fork 后立刻创建 Activity，而是： 这一顺序能解释两个常见问题： 1. Application 每个进程只创建一次，Activity 可以创建多次。 2. 通过 ContentProvider 自动初始化的三方库可能早于 Application.onCreate() 执行。 性能分析需要继续拆分进程初始化、组件创建和首帧显示的耗时，避免仅用总启动耗时判断瓶颈。 不同启动状态下的链路差异 进程是否存在由 AMS 管理；Activity 和 Task 是否存在由 ATMS 管理，所以判断冷、温、热启动时需要同时看两边状态。 ","description":"","practiceLabel":""},{"title":"WindowManagerService 窗口管理流程","url":"/notes/ee4541ede89330a8/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" WindowManagerService 窗口管理流程 WindowManagerService ，简称 WMS，是 system_server 里的窗口管理服务。它决定屏幕上有哪些窗口、谁在上层、谁有焦点、输入事件发给谁，并通过 SurfaceControl 控制对应图层。它不负责执行业务 View 的 draw() ，也不负责最终像素合成。 一句话定位： 先区分 Activity、Window 与 Layer WMS 关注的核心信息 WMS 不持有 App 的真实 View，它维护的是每个窗口的系统侧记录。 对象 作用 --- --- WindowToken 窗口归属令牌，标识窗口属于哪个 Activity 或系统实体 WindowState 一个具体窗口在 WMS 里的运行时记录 DisplayContent 一块 Display 上的窗口树 RootWindowContainer 所有 Display 和窗口容器的根 SurfaceControl 控制 SurfaceFlinger 图层的句柄 InputChannel 窗口和输入系统之间的事件通道 需要重点掌握的几类状态： - 窗口层级（z-order）：由窗口类型和层级规则决定，系统窗口通常在应用窗口之上，最终反映到 Layer 顺序。 - 焦点窗口：决定按键和输入法目标；touch 更多按可触摸区域命中窗口，key/IME 更依赖焦点窗口。 - 可见性：窗口是否显示由 WMS 记录并通过 SurfaceControl 同步给图层。 - 输入目标：InputDispatcher 依赖 WMS 的窗口信息决定事件发给哪个窗口。 Activity / Window / Layer 三个维度 窗口相关其实有三个独立维护、需要互相同步的维度。 [Activity / Window / Layer 三维度关联] 维度 负责什么 归属服务 唯一标识 --- --- --- --- Activity / Task 任务栈、返回关系、生命周期、前后台 ATMS ActivityRecord + token(IBinder) Window 窗口秩序、层级、焦点、输入目标 WMS WindowState（关联 IWindow） Layer 图层合成顺序、上屏 SurfaceFlinger Layer（外部用 SurfaceControl 寻址） 三者不是严格一一对应： - 一个 Activity 可能有多个窗口：主窗口、Dialog、PopupWindow。 - 很多窗口不属于任何 Activity：状态栏、导航栏、输入法、壁纸、Toast、悬浮窗。 - 一个窗口可能对应一个或多个 SurfaceControl / Layer。 关联方式 - ATMS 启动 Activity 时创建 ActivityRecord 并生成 token； addToDisplay 时带上 token，WMS 据此把窗口挂到对应 Activity。 - WMS 的 WindowState 持有 SurfaceControl ，指向 SurfaceFlinger 中唯一的 Layer 。 - 用 token 而不是直接传 Activity 对象，是因为跨进程隔离：Activity 在 App 进程，WindowState 在 system_server，只能用 Binder token 作为身份凭证。这也解释了用非 Activity 的 Context addView 会报 token 错误。 通信通道 为什么要分三个维度 把 Activity/Window/Layer 拆开，是被多进程窗口系统的约束逼出来的，不是为了复杂。 1. 屏幕是多进程共享的：状态栏、输入法、其他 App 的悬浮窗都在同一块屏幕上，窗口秩序必须由系统统一仲裁，不能让某个 App 自己决定。 2. 窗口不等于 Activity：很多窗口没有对应 Activity，需要独立建模。 3. 进程隔离与稳定性：Activity 在 App 进程，会崩溃会被杀；窗口秩序、焦点、输入目标必须放在 system_server，避免一个 App 影响全局。 4. 合成是独立系统：SurfaceFlinger 面对所有 App 的图层，按统一 z-order 和 VSYNC 合成，不可能塞进单个 Activity。 因此三个维度只能各自在责任进程里维护权威状态，靠 token 和 SurfaceControl 关联，靠 Binder 和事务同步。代价是可能短暂不一致，换来的是多应用共享、进程隔离、系统窗口统一管理和灵活显示能力（多屏、分屏、画中画等）。 窗口从创建到显示的流程 Activity resume 后，App 侧发起添加窗口，最终由 WMS 登记并接入图形系统。 几个关键分界： - addWindow 只是登记窗口，创建 WindowState ，还没有可绘制 Surface。 - relayout 才通过 SurfaceControl 给窗口分配 Surface，App 拿到后才能绘制。 - WMS 管窗口属性和层级， SurfaceFlinger 负责把各层 buffer 合成输出。 ViewRootImpl 是窗口在 App 侧的客户端， WMS 是窗口在系统侧的管理者，二者通过 IWindowSession （App→WMS）和 IWindow （WMS→App）通信。 用状态不一致定位显示问题 因为三个维度靠同步保持一致，一旦某个维度状态没更新到，就会出现“看起来矛盾”的现象。 典型案例：Dialog 残留。 原因链： - hide() 通常只改内容可见性，不一定移除窗口； dismiss() 才会走 removeView - WMS.removeWindow 。 - 从 Window 维度看，窗口（WindowState）还在，可见性记录仍是“可见”。 - 切后台再回前台时，系统按窗口维度的“可见”状态重新显示，于是 Dialog 又出现。 本质：Window 维度和 Activity 前后台没对齐，是状态同步问题，不是分层设计问题。 dumpsys 排查 把三个维度分别 dump 出来对比： 排查思路： 1. dumpsys window 看该 Dialog 的 WindowState 是否还在，visibility 是什么。 2. 窗口仍在且可见，说明是 hide 未 remove 或可见性没同步。 3. 对比 Activity 前后台状态与窗口可见性是否一致。 4. 必要时看 SurfaceFlinger 里对应 Layer 是否还在合成。 修复方向：该销毁就 dismiss ；让依附窗口的生命周期跟随宿主 Activity；避免在错误的生命周期时机操作窗口。 结论 1. WMS 是系统侧窗口管理者，App 侧窗口客户端是 ViewRootImpl，二者通过 IWindowSession / IWindow 通信。 2. addWindow 登记窗口， relayout 才分配 Surface；WMS 管窗口秩序，SurfaceFlinger 管合成。 3. Activity / Window / Layer 是三个独立维度，靠 token 和 SurfaceControl 关联，不是一一对应。 4. 分三维度是多进程窗口系统的必然选择：屏幕共享、窗口非 Activity 独有、进程隔离、独立合成。 5. 三维度靠同步保持一致，Dialog 残留等问题多是某个维度状态没同步，用 dumpsys 三件套对比排查。 ","description":"","practiceLabel":""},{"title":"Input 输入系统流程","url":"/notes/9e5b0f3f4ca04e76/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" Input 输入系统流程 输入系统负责把硬件输入事件送到正确的窗口，再由 App 分发到 View。它的核心组件跑在 system_server 的 native inputflinger 里，并依赖 WMS 提供窗口信息。本文按“时间线”组织：从初始化，到窗口通道建立、窗口秩序同步、事件派发、App 接收、对齐帧处理，最后到 finish 回执。 [Android 输入系统时间线] 输入链路总览 两个进程边界：读事件、加工、派发在 system_server （native）；View 分发在 App 进程。WMS 也在 system_server ，所以窗口信息是同进程同步给 InputDispatcher。 事件到来前：建立窗口与输入通道 阶段 0：初始化（开机一次） 各组件职责： - EventHub：用 inotify 监听 /dev/input 设备增删，open 设备，用 epoll 等待可读，读出原始 input_event 。 - InputReader：把原始事件加工成规范的 MotionEvent / KeyEvent。 - InputDispatcher：维护连接表和窗口快照，负责分发和超时判定。 注意分工：读设备的 epoll 在 EventHub（Reader 侧），InputDispatcher 只负责分发，不直接 epoll 驱动设备。 阶段 1：IMS 与 WMS 建立联系 WMS 启动后持有 IMS 引用，负责把窗口信息喂给 InputDispatcher。此时还没有应用窗口，窗口快照为空或只含系统窗口。 阶段 2：窗口创建时建立 InputChannel（每次 addWindow） 关联关系（用 token 对齐，不互相持有对象）： 一个可接收输入的窗口对应一对 InputChannel；窗口销毁时注销通道、关闭 socket、释放 fd。 阶段 3：窗口秩序同步（窗口变化时，低频） InputDispatcher 不自己算窗口秩序，它读 WMS 推送的窗口快照。触发同步的变化包括： WMS 在布局重算后生成 InputWindowHandle 列表并同步给 InputDispatcher，每个 handle 含 token、可触摸区域、z-order、焦点、flags、display。 为什么这样设计：输入事件高频、窗口变化低频，所以由 WMS 在变化时推送快照，派发时 InputDispatcher 只读本地快照，保证低延迟。 事件到来后：分发、处理与回执 阶段 4：事件产生与派发（每个事件，高频） 触摸手势有序列绑定：DOWN 命中的窗口决定后续 MOVE/UP 都发给它，所以一个手势不会中途换窗口。 阶段 5：App 接收（每个事件，经 InputChannel） 这里不能省略 InputChannel： onInputEvent 的事件正是从该窗口 InputChannel 的 socket 读出来的，InputEventReceiver 是绑定在这个通道上的。 阶段 6：对齐帧处理（关键事件尽快，高频事件对齐 VSYNC） 关联点：socket 决定事件“何时到达”，Choreographer 决定事件“在哪一帧处理”。ViewRootImpl 的 pending 队列 + CALLBACK_INPUT 回调把两者串起来，让输入、动画、绘制对齐到同一帧，保证输入→状态→动画→绘制自洽。 主线程只有一个 Looper，同时承载普通 Message、Choreographer 帧回调、InputChannel 的 fd 唤醒。主线程被耗时任务卡住会同时导致输入延迟（ANR）和掉帧。 阶段 7：回执与 ANR（处理完） 这个“长连接 + 回执”模型既保证高频、低延迟、有序，也是 ANR 判定的基础。 按触发频率理解各阶段 时机 频率 做了什么 --- --- --- 初始化 开机一次 启动 EventHub / InputReader / InputDispatcher，EventHub epoll 监听设备 addWindow 每次建窗口 建 InputChannel+token，注册 Connection，App 侧 fd 入 Looper 窗口变化 低频 WMS 推送 InputWindowHandle 快照(token/region/层级/焦点) 事件派发 高频 Reader 加工，Dispatcher 命中窗口，token 找 socket 写事件 App 接收 高频 InputChannel - InputConsumer - onInputEvent - 入队 对齐帧 高频 DOWN/UP 尽快，MOVE 走 Choreographer INPUT 回调对齐 VSYNC 回执 每个事件 finishInputEvent 回执，超时则 ANR 排查方法与关键结论 排查工具 关键结论 1. InputReader / InputDispatcher 都在 system_server 的 native inputflinger，由 Java 层 IMS 通过 JNI 启动。 2. 一个可接收输入的窗口对应一对 InputChannel，addWindow 时建立并以 token 注册到 InputDispatcher。 3. 窗口秩序按“状态变化”由 WMS 推送快照，派发时 Dispatcher 只读本地快照，保证低延迟。 4. 派发目标：touch 按坐标+层级命中窗口，key/IME 按焦点窗口；用 token 找 socket 直接写事件。 5. App 侧经 InputChannel - InputConsumer - InputEventReceiver - ViewRootImpl 入队，不能省略 InputChannel。 6. socket 决定“何时到达”，Choreographer 决定“哪一帧处理”，两者用 pending 队列和 CALLBACK_INPUT 串联。 7. finish 回执是背压和 input dispatching timeout ANR 判定的基础。 ","description":"","practiceLabel":""},{"title":"Activity 启动与显示流程","url":"/notes/df4027642366e720/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" Activity 启动与显示流程 这篇梳理一个 Activity 从 startActivity 发起，到目标 Activity 创建、窗口接入、View 绘制，再到首帧上屏的主链路。 [Activity 从启动到首帧显示流转图] 从启动请求到画面显示 这条链路可以分成两段： 1. 启动阶段：ATMS/AMS 判断组件能不能启动、该放到哪个任务栈、是否需要创建进程，最后让目标 App 创建 Activity。 2. 显示阶段：Activity 创建窗口和 View 树，ViewRootImpl 接入 WMS 和 Surface，最终由 SurfaceFlinger 合成上屏。 组件创建：进程与 Activity 初始化 1. App 发起端 业务调用 startActivity 后，先在发起方 App 进程内走到： Instrumentation 是请求发给 system_server 前的 App 侧入口。插件化常在这里替换 Intent，把真实插件 Activity 包装成宿主 Manifest 里已声明的 Stub Activity。 2. system_server 调度端 ATMS/AMS 收到请求后，主要处理这些问题： - Intent 能不能解析到目标 Activity。 - Manifest 中是否存在对应的 ActivityInfo 。 - 权限、exported、launchMode、taskAffinity 等规则是否允许启动。 - 新 Activity 应该进入哪个 Task。 - 目标进程是否已存在，不存在时是否需要通过 Zygote 创建。 - 当前 Activity 是否需要 pause，新 Activity 何时 resume。 系统允许启动 Activity 的前提是：能从已安装包的 Manifest 信息中查到合法的 ActivityInfo 。 3. 目标进程和 ActivityThread 如果目标进程不存在，AMS 会请求 Zygote fork 新进程。新进程启动后进入 ActivityThread.main ，准备主线程 Looper、Application 和后续组件调度。 新版本 Android 通常通过 ClientTransaction / LaunchActivityItem 把启动事务发送到目标 App；旧版本主要看 LAUNCH_ACTIVITY 。目标 App 收到事务后，进入 ActivityThread.performLaunchActivity 。 4. performLaunchActivity performLaunchActivity 负责真正创建 Activity 对象： 1. 根据 ActivityInfo 找到 LoadedApk 。 2. 从 LoadedApk 拿到 ClassLoader 。 3. 通过 Instrumentation.newActivity 创建 Activity。 4. 创建 ContextImpl ，并关联 Application。 5. 调用 Activity.attach ，绑定 token、Window、Instrumentation 等运行环境。 6. 调用 Instrumentation.callActivityOnCreate 。 7. 进入业务 Activity.onCreate 。 窗口接入与首帧生产 显示阶段：页面如何接入窗口系统 onCreate 只是 Activity 生命周期开始执行，不代表页面已经显示。 setContentView 只是把业务布局放进 PhoneWindow 的 DecorView ，真正接入窗口系统发生在 resume 之后。 [Android 页面运行机制分层架构图] 1. 对象分工 概念 所在位置 职责 --- --- --- Activity App / ATMS 有记录 页面身份、生命周期、任务栈入口 PhoneWindow App Activity 持有的窗口抽象 DecorView App View 树根节点 ViewRootImpl App View 树根控制器，负责 traversal、输入、relayout、Surface 使用 ATMS/AMS system_server Activity、Task、进程、生命周期和权限调度 WMS system_server Window token、层级、焦点、布局、输入目标、SurfaceControl Surface App 进程句柄 App 写 buffer 的入口 Layer SurfaceFlinger 合成单位 SurfaceFlinger 独立系统进程 合成所有 Layer 并输出到屏幕 2. Window、Surface、Layer 的关系 WMS 通过 SurfaceControl 控制 Layer 的位置、大小、裁剪、层级和显示隐藏。App 通过 Surface 写 buffer。SurfaceFlinger 只负责拿各个 Layer 的 buffer 做合成。 从 setContentView 到首帧上屏 resume 阶段会把 DecorView 加入窗口系统： 这里有几个关键边界： - WindowManager.addView 是 App 侧入口。 - ViewRootImpl 连接 App 内 View 树和 system_server 的 WMS。 - WMS 管窗口合法性、布局、层级、焦点和输入目标。 - Surface 只是 buffer 通道，不负责判断窗口是否合法。 - SurfaceFlinger 管图层合成，不理解业务 View 层级。 输入链路与常见误区 输入也走窗口体系 触摸事件不是直接给 Activity，也不是直接给 Surface。InputDispatcher 会根据 WMS 提供的窗口焦点和可触摸区域找到目标 Window，再通过 InputChannel 发给 App，最后由 ViewRootImpl 分发到 DecorView、Activity 和具体 View。 常见误区 1. ActivityInfo 是启动校验核心 没有 Manifest 中的 ActivityInfo ，ATMS/AMS 不会允许直接启动目标 Activity。插件化的 Stub Activity 或宿主预声明，本质是在解决系统校验问题。 2. onCreate 不等于上屏 onCreate 只是生命周期回调。首帧显示还要经过 WindowManager.addView 、ViewRootImpl traversal、Surface 提交 buffer 和 SurfaceFlinger 合成。 3. Activity 不是绘制器 Activity 是生命周期和任务栈单位。真正显示链路是： 4. Window 不等于 Activity 一个 Activity 可以有主窗口、Dialog、PopupWindow；也有些窗口不是 Activity，比如输入法、状态栏、导航栏、Toast、悬浮窗、壁纸。 5. ClassLoader 来自 LoadedApk ActivityThread 创建 Activity 时会从 LoadedApk 拿 ClassLoader 。插件化如果只替换 Intent、不处理类加载，最终会在创建 Activity 时出现 ClassNotFoundException 。 6. 新旧 Android 启动消息不同 Android P 前主要看 LAUNCH_ACTIVITY / ActivityClientRecord ；P 后主要看 EXECUTE_TRANSACTION / LaunchActivityItem 。做 Hook 或源码对照时要注意版本差异。 ","description":"","practiceLabel":""},{"title":"Binder","url":"/notes/03953a247cdb3327/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" Binder 跨进程通信机制 Binder 要解决的核心问题是：让一个进程像调用本地方法一样，调用另一个进程中的对象。 本文关注 Binder 的系统主线，不展开 AIDL、Messenger 和 bindService() 的使用教程。源码基线为本地 frameworks/native 的 d1735f8 （Android 13 tm-qpr2-release ）。 架构、对象身份与服务发现 Binder 分为四层 - AIDL：生成参数序列化、方法编号、Proxy 和 Stub，本身不是 Binder 驱动。 - libbinder：把方法调用转换成 Binder 命令和 Parcel 。 - Binder Driver：跨进程定位对象、复制数据、转换 Binder 引用并调度目标线程。 - Binder 线程池：接收事务并进入服务端的 onTransact() 。 同进程调用是例外。 Stub.asInterface() 如果发现 Binder 对象就在当前进程，会直接返回本地实现，不经过驱动。 node、ref 和 handle 如何关联两端 Binder 驱动不会使用 Java 对象地址直接跨进程寻址，而是维护三层关系： binder_node binder_node 代表真正的服务端 Binder 实体，记录它属于哪个进程，以及服务端用于还原本地 Binder 对象的信息。 一个 binder_node 可以同时被多个进程引用。 binder_ref binder_ref 表示某个进程对目标 binder_node 的引用。不同客户端引用同一个服务端 Binder 时，各自拥有自己的 binder_ref 。 handle handle 是 binder_ref 在当前进程内的整数编号，Java 层通常由 BinderProxy 持有。 handle 只在所属进程内有效，不是 Binder 对象的全局地址；相同数字在不同进程里可以指向不同对象。 调用时，驱动执行的核心查找是： [Binder 对象身份与服务发现] ServiceManager 只负责服务发现 在 Framework 使用的 Binder context 中， servicemanager 是 context manager，客户端通过特殊的 handle 0 获得它的代理。 注册实名系统服务 以 system_server 注册 AMS、WMS 等服务为例： 客户端查询服务 ServiceManager 不参与后续每一次业务调用。客户端取得目标服务的 handle 后，后续事务由 Binder Driver 直接发送到服务端进程。 匿名 Binder Binder 对象不一定要注册到 ServiceManager。 bindService() 返回的 Binder、回调接口和 Binder 连接池，本质上都是把一个 Binder 对象放进已有事务中传给对方： 因此，ServiceManager 管理的是“通过名字发现的 Binder 服务”，Binder Driver 管理的是所有 Binder 对象和事务。 一次事务的数据与调用路径 一次同步事务如何执行 以客户端调用 AIDL 方法为例： [一次同步 Binder 事务] code 标识调用哪个接口方法， Parcel data 保存参数， Parcel reply 保存返回值或异常。 Binder 调用看起来像普通方法调用，但执行线程已经从客户端调用线程切换成服务端 Binder 线程。服务端如果需要修改自己的主线程状态，还要再通过 Handler 等机制切换线程。 mmap 为什么能减少一次复制 每个使用 Binder 的进程都会打开 Binder 设备，并通过 mmap() 建立一块用于接收事务的虚拟地址空间： [Binder mmap 与一次拷贝] 发送事务时，数据路径可以概括为： mmap() 本身不负责复制数据，也不是让发送端和接收端直接共享同一块普通内存。它让驱动管理的接收 buffer 映射到接收进程地址空间，因此接收端不需要再执行一次 copy_to_user() 。 所以 Binder 通常被称为“一次拷贝”，不是“完全零拷贝”。回复数据同样会复制到原调用进程的 Binder 接收区。 Binder 对象不能只复制地址 Parcel 除了普通字节，还可以携带 Binder 对象和文件描述符。驱动复制数据时会根据对象偏移表逐个处理： - 本地 Binder 对象跨进程传输后，转换成接收进程中的 handle。 - 已有远程 Binder 再次传输时，驱动维护新的 binder_ref 关系。 - 文件描述符需要复制成接收进程可用的 fd。 这也是 Binder Driver 不能被普通共享内存完全替代的原因：它不仅搬运数据，还维护对象身份、引用计数和调用方身份。 线程模型、死亡通知与调用身份 同步调用、oneway 和线程池 同步调用 普通 Binder 事务是同步的：客户端调用线程发送事务后等待 BR_REPLY 。 因此，在主线程发起耗时 Binder 调用仍可能造成卡顿或 ANR。Binder 只解决跨进程调用，不会自动把客户端工作切到后台线程。 oneway AIDL 中标记为 oneway 的方法不等待服务端执行结果： oneway 不是“丢了也没关系”，也不代表服务端不执行。发往同一个 Binder node 的异步事务会保持串行顺序；如果发送速度长期高于消费速度，仍会形成积压。 Binder 线程池 服务端进程需要 Binder 线程等待驱动命令： 多个 Binder 线程意味着服务端可能并发执行多个事务，共享状态必须自行保证线程安全。某个 Binder 线程被耗时任务长期占用，也会降低整个服务的并发处理能力。 死亡通知与调用身份 DeathRecipient 客户端可以对远程 BinderProxy 调用 linkToDeath() 。服务端进程退出后，驱动根据 binder_ref 和 binder_node 的关系通知客户端，最终回调 binderDied() 。 DeathRecipient 只能说明远端 Binder 所在进程已经死亡，不能保证服务自动恢复，也不能替代业务层重连。 调用身份 驱动会把调用方的 PID、UID 等身份随事务交给服务端。系统服务可以通过 Binder.getCallingUid() 等接口做权限判断。 如果系统服务收到客户端请求后，再以自己的代码调用其他系统接口，需要明确当前操作应该沿用客户端身份还是服务端身份； clearCallingIdentity() 用错可能造成越权或权限异常。 适用边界与常见误区 与 Linux 基础 IPC 的区别 从最基础的常用通信模型看，Linux 进程间通信主要有字节流、共享页和异步通知： Linux 还提供 System V / POSIX Message Queue、信号量、 eventfd 等独立机制，但它们没有改变 Binder 选型的核心问题：Android 系统服务需要的不只是传输数据，而是受控的本机对象 RPC。 方式 提供的基础能力 用于系统服务时还缺少什么 --- --- --- Pipe / FIFO 单向或半双工字节流 消息协议、请求响应、多客户端和对象生命周期 Unix Domain Socket 双向流或数据报，可传 fd 并获取对端凭据 需自行实现服务发现、远程对象、引用管理和 RPC 线程模型 共享内存 共享物理页，适合大数据 不提供通知、消息边界、同步、权限和生命周期 Signal 进程级异步通知 载荷很小，不适合复杂请求和返回值 Binder 对象 RPC、身份传递、引用转换、死亡通知和线程调度 不适合直接承载图像、音视频等大块数据 Binder 不是对 Pipe、Socket 的简单封装，而是通过专用内核驱动组合多种基础能力： Android 不会用 Binder 替代所有 IPC，而是根据数据特征组合使用： ServiceManager 与 Binder 安全边界 ServiceManager 的安全价值是受控的服务命名空间，但它不是通用的防 Hook 机制： 当前 ServiceManager 会直接拒绝 App UID 注册服务，并通过 SELinux 分别检查 add 与 find 权限。因此普通 App 无法随意注册或替换 AMS 等系统服务，也无法伪造 Binder 驱动提供的 UID。高权限进程对同名服务的处理细节会随 Android 版本变化，安全边界不应建立在“同名一定无法替换”上。 如果攻击者已经获得 Root、内核控制权、 system_server 代码执行权或目标进程内注入能力，Binder 本身不能阻止 Java / Native / 内核层 Hook。 因此 Binder 的安全模型是： 常见误区 1. ServiceManager 是所有 Binder 事务的中转站 错误。ServiceManager 只负责实名服务的注册和查询。获得目标 Binder 后，客户端与服务端通过驱动直接通信。 2. handle 是 Binder 服务的全局编号 错误。handle 是当前进程内 binder_ref 的编号，只有 handle 0 具有 context manager 的特殊语义。 3. mmap 完成了进程间数据复制 错误。复制由驱动完成， mmap() 提供接收 buffer 的用户空间映射，从而省掉接收端的第二次复制。 4. oneway 等于开了一个新线程 错误。它只改变客户端是否等待 reply，服务端仍通过 Binder 线程池执行。 5. Binder 适合传输大块数据 错误。Binder 接收缓冲区由进程内并发事务共享，事务过大可能触发 TransactionTooLargeException 。图片、视频帧等大数据通常只通过 Binder 传递 fd、共享内存句柄或 Surface，而不是直接塞进 Parcel。 应用层封装示例 这些工具没有引入新的 IPC 机制，底层仍然是 Binder，只是对接口形式和线程模型做了不同封装。 1. AIDL：生成 Proxy 和 Stub 服务端实现 Stub ： 客户端取得 Binder 后转换成接口： 如果两端在同一进程， asInterface() 返回本地 Stub；如果跨进程，则返回 Proxy。远程方法调用最终仍是： Book 这类复杂参数需要实现 Parcelable 并在 AIDL 中声明。跨进程后得到的是重新反序列化的数据对象，不再是服务端原对象的 Java 引用。 2. Messenger：把 Binder 调用转换成 Message 服务端通过 server.getBinder() 暴露 Binder，客户端再使用 Messenger.send() 发送消息。 Messenger 底层仍使用 Binder，但请求会进入指定 Handler，因此天然串行，适合简单消息通信；它不适合需要大量强类型方法和并发调用的接口。 3. RemoteCallbackList：管理跨进程回调 客户端把回调 Stub 传给服务端，本质上是把一个新的 Binder 对象放进 Parcel。服务端通常使用 RemoteCallbackList 保存这些回调： 它以底层 Binder 身份区分客户端，并结合死亡通知清理已经退出进程的回调，避免直接用普通 List 管理远程接口。 4. Binder 连接池：通过一个 Binder 返回其他 Binder 客户端先获得 IBinderPool ，再通过 queryBinder() 得到其他业务 Binder。返回的业务 Binder 不需要注册到 ServiceManager，而是通过这次已有事务传给客户端。 它说明了 Binder 的一个重要能力：Binder 对象本身可以作为 Parcel 数据继续跨进程传输，驱动会为接收进程建立对应的 binder_ref 和 handle。 源码入口与结论 源码入口 - frameworks/native/libs/binder/ProcessState.cpp ：打开驱动、 mmap() 、handle 0、线程池。 - frameworks/native/libs/binder/BpBinder.cpp ：客户端代理、 transact() 、 linkToDeath() 。 - frameworks/native/libs/binder/IPCThreadState.cpp ：事务命令、 ioctl() 、等待 reply、处理 BR_TRANSACTION 。 - frameworks/native/libs/binder/Binder.cpp ： BBinder.transact() 和 onTransact() 。 - drivers/android/binder.c ： binder_node 、 binder_ref 、事务路由与引用管理。 - [AOSP Binder overview] - [AOSP Binder threading] 核心结论 Binder 的重点不是记住 AIDL 模板，而是理解驱动如何维护跨进程对象身份，以及一次事务如何从客户端线程进入服务端 Binder 线程。 ","description":"","practiceLabel":""},{"title":"Android 渲染上屏流程","url":"/notes/3428c6a7ad967847/","section":"client","sectionTitle":"客户端开发","folders":["Android","系统原理"],"text":" Android 渲染上屏流程 这篇文档只围绕一条主线：一帧画面从 App 侧产生，到进入 Surface/BufferQueue，再到 SurfaceFlinger 合成，最后输出到屏幕或虚拟显示。 下面这张图是本文的主图，后文按图从左到右解释。 [Android Surface 上屏完整流程] 应用侧如何生产一帧 主窗口从 VSYNC 到 ViewRootImpl 主窗口的绘制由 VSYNC 驱动。VSYNC 到来后，Choreographer 触发 doFrame ，UI 线程进入 ViewRootImpl 的 traversal 流程。 这里的 ViewRootImpl 是 App 进程内连接 View 树和窗口系统的对象。它负责把 requestLayout 、 invalidate 等刷新请求合并到下一帧，并在合适的 VSYNC 时机执行测量、布局和绘制。 View 绘制分为硬件绘制和软件绘制 ViewRootImpl 进入 draw 后，会根据是否启用硬件加速走两条路径。 硬件绘制路径 硬件加速开启时，View 的绘制命令会进入 RenderThread 和 HWUI/OpenGL/EGL 路径。 这里的 GraphicBuffer 是 App 侧最终提交给窗口 Surface 的图形缓冲。硬件绘制并不是直接画到屏幕，而是把 View 树绘制结果写入与窗口 Surface 关联的 buffer。 软件绘制路径 未走硬件加速时，会通过 CPU Canvas 绘制，并通过 Surface.lockCanvas / unlockCanvasAndPost 提交。 软件绘制路径少见于现代复杂 UI，但它能帮助理解：无论硬件绘制还是软件绘制，最终都要产出 buffer，并提交到 Surface 对应的 BufferQueue。 Surface 与独立图层的组织 ViewRootImpl mSurface 是主窗口的 producer 入口 主窗口的 Layer 不是每帧绘制后才生成。窗口创建或 relayout 时，WMS 通过 SurfaceControl 在 SurfaceFlinger 侧创建和配置 App Window Layer；App 侧 ViewRootImpl 持有与这个 Layer 关联的 Surface ，也就是 ViewRootImpl mSurface 。 窗口和 Layer 建立链路可以理解为： 每帧绘制时，App 只是通过这个 producer 入口提交新的 buffer： 所以，主窗口里普通 View 的内容最终都合并在 App Window Layer 里。SurfaceFlinger 不理解 TextView、Button、RecyclerView 这些 View 结构，它只消费 Layer 的 buffer。 SurfaceView 是额外的独立 Layer 图中下方的 SurfaceView 分支表示：SurfaceView 的内容不先画进 ViewRootImpl 的主窗口 Surface。视频、相机、游戏或解码器可以直接写入 SurfaceView 自己的 Surface。 View 树主要负责 SurfaceView 的占位、大小、可见性和 Layer 控制；真正的视频或游戏画面作为独立 Layer 参与 SurfaceFlinger 合成。 这也是 SurfaceView 适合视频、相机、游戏和低延迟渲染的原因：producer buffer 可以更直接地成为 SurfaceFlinger 可合成的 Layer，少一次 App 侧纹理采样和合成。 系统合成与显示输出 SurfaceFlinger 如何合成 SurfaceFlinger 收到 VSYNC 后，会遍历当前所有 Layer，检查每个 Layer 是否有新的 buffer。 每个 Layer 不只有 buffer，还包含位置、大小、裁剪、透明度、层级、旋转等合成属性。SurfaceFlinger 会根据这些信息决定合成方式。 合成路径：GPU 合成或 HWC 硬件合成 图右侧展示了两类合成路径。 如果硬件合成器能够处理当前 Layer 的格式、裁剪、缩放、旋转和混合方式，系统会尽量使用 HWC。否则会回退到 GPU/OpenGL 合成。 输出目标：物理屏或 VirtualDisplay SurfaceFlinger 合成后的结果不一定只输出到物理屏幕。图中展示的是另一类场景：输出到一个 Surface，再进入 VirtualDisplay，并触发下游编码器。 这条路径常见于录屏、投屏、云游戏抓屏等场景。它和普通物理屏显示共用同一套 Layer/BufferQueue/SurfaceFlinger 机制，只是最终 display target 不同。 缓冲同步与云游戏场景 8.1 SurfaceView 与 TextureView SurfaceView 和 TextureView 都能承载视频、相机、游戏画面，但它们接入上屏链路的位置不同。 [SurfaceView 与 TextureView 图形链路差异] 对比项 SurfaceView TextureView --- --- --- 最终是否额外独立 Layer 是，SurfaceFlinger 除 App Window Layer 外还会合成 SurfaceView Layer 否，先画进 App Window Layer producer 写入位置 SurfaceView 自己的 Surface SurfaceTexture 暴露的 Surface 是否参与 View 树绘制 不直接参与内容绘制，View 树主要控制位置和可见性 参与 View 树绘制，通过 TextureLayer 被采样 性能和延迟 路径短，适合低延迟 多一次 App 侧纹理采样和合成，灵活但更重 TextureView 的简化链路是： 所以，TextureView “和 ViewRootImpl 共用同一个 Surface”的准确含义是：TextureView 的最终显示结果会被画进 Activity/Window 的 ViewRootImpl mSurface ，和普通 View 一起成为 App Window Layer 的内容。中间的 SurfaceTexture 用于接收 producer buffer，并不作为独立 Layer 直接交给 SurfaceFlinger 合成。 8.2 BufferQueue、Fence 和三缓冲 [Surface 与 BufferQueue 生产消费模型] BufferQueue 负责连接 producer 和 consumer。典型流程是： Fence 和三缓冲是 buffer 流转中的同步与排队机制，不是主流程本身。 - Fence：表达异步读写依赖，避免消费者读到尚未写完的 buffer。 - 双缓冲：延迟更容易低，但消费者未释放 buffer 时，生产者更容易阻塞。 - 三缓冲：吞吐更稳，降低生产者阻塞概率，但队列里可能多排一帧，增加端到端延迟。 8.3 低延迟场景里的取舍 视频、相机、云游戏这类场景关心的不是“能不能显示”，而是“画面能不能少排队、少拷贝、少合成一次”。 以云游戏为例，远端抓屏侧可能是： 客户端渲染侧可能是： 优化时要看清楚每个方案省掉了什么：少一次 SurfaceTexture、少一次 OES 转 YUV、少一次 OpenGL 绘制，或让 MediaCodec 直接消费/生产图形 buffer。 ","description":"","practiceLabel":""},{"title":"渲染流程","url":"/notes/7582c9b1581b3665/","section":"client","sectionTitle":"客户端开发","folders":["Android","UI 与渲染"],"text":" Android 渲染流程 这篇文档回答一个问题：Android 本地 App 的一帧，是怎么从业务代码里的刷新请求，变成最终屏幕上的像素的。 云游戏场景会复用这套图形系统，但它的链路更长：远端游戏先完成 Android 原生渲染，再被抓屏、编码、传输、解码并在客户端上屏。云游戏相关内容放在 [Android 容器抓屏实现] 中，这里先讲 Android 系统自己的渲染主链路。 [Android 一帧渲染主链路] 一帧的整体流程 核心理解是：应用并不是直接把内容画到屏幕上。应用侧只负责在自己的 Surface 对应的缓冲区里生产一帧，系统侧的 SurfaceFlinger 再把多个窗口、 SurfaceView 、状态栏、导航栏等 Layer 合成为最终画面。 刷新请求与帧调度 触发刷新：invalidate 和 requestLayout 常见刷新入口有两类： 1. invalidate() ：当前 View 内容变了，需要重新绘制。 2. requestLayout() ：尺寸或位置可能变了，需要重新测量和布局。 这两个入口最后都会沿着 View 树向上通知到 ViewRootImpl 。 ViewRootImpl 不会立刻执行完整绘制，而是通过 scheduleTraversals() 把本次 traversal 安排到下一次合适的帧节奏里。 这里的关键点是：UI 刷新受 VSYNC 节奏约束。业务频繁调用 invalidate() 不等于屏幕会无限刷新，系统会在一帧周期内合并刷新请求。 Choreographer：把刷新对齐到 VSYNC Choreographer 负责接收 VSYNC 信号，并在一帧里按顺序执行输入、动画、布局绘制等回调。 [Choreographer 流程图] 一次典型的帧回调里，会处理几类任务： 1. 输入事件：优先处理用户触摸、按键等输入。 2. 动画：推进属性动画、补间动画等基于帧的状态变化。 3. traversal：执行 ViewRootImpl doTraversal() ，完成测量、布局、绘制。 4. commit：提交本帧后置任务。 如果主线程在 VSYNC 到来时还在执行耗时业务逻辑， doFrame 就会延迟。延迟超过一个刷新周期后，用户看到的就是掉帧或卡顿。 从 View 树到图形缓冲 ViewRootImpl：从 DecorView 到 RenderNode ViewRootImpl doTraversal() 是 View 系统进入绘制主流程的入口，内部大致分为三步： 1. performMeasure() ：从根 View 开始测量每个 View 的尺寸。 2. performLayout() ：确定每个 View 在父容器中的位置。 3. performDraw() ：遍历 View 树，生成绘制结果。 软件绘制和硬件加速的区别在这里会开始变明显： - 软件绘制：主线程通过 Canvas 直接执行绘制逻辑，CPU 参与更多。 - 硬件加速：View 的绘制命令会记录为 RenderNode ，后续由渲染线程消费，最终通过 OpenGL/Vulkan 写入图形缓冲区。 所以“View 的 draw 执行了”并不等于“屏幕已经显示了”。它只是把这一帧的绘制命令或绘制结果提交到了后续图形链路。 RenderThread：把 UI 绘制命令变成图形缓冲 开启硬件加速后，主线程主要负责 View 树遍历和绘制命令记录， RenderThread 负责执行这些命令。 这能减少主线程直接做图形工作的压力，但不代表主线程就不重要。主线程如果被业务逻辑、布局计算、频繁刷新阻塞， RenderThread 拿不到新的绘制命令，同样会掉帧。 这里可以把一帧拆成两个阶段看： 1. UI 线程阶段：输入、动画、测量、布局、记录绘制命令。 2. 渲染线程阶段：执行绘制命令，把结果写入 buffer。 缓冲提交与系统合成 Surface：应用和系统合成的边界 Surface 可以理解为应用向系统提交画面的出口。应用绘制完成后，会把一块 GraphicBuffer 入队给对应的 Surface 。 几个容易混淆的概念： - Window ：应用侧描述窗口能力的抽象。 - DecorView ：应用窗口里 View 树的根节点。 - ViewRootImpl ：连接 View 树和窗口系统，负责调度 traversal。 - Surface ：承载像素缓冲的生产消费边界。 - Layer ： SurfaceFlinger 侧参与合成的图层。 普通 Activity 窗口、 SurfaceView 、 TextureView 都会进入图形系统，但它们的合成方式和 View 树的关系不同。 SurfaceView 通常有独立 Surface，适合视频、相机、游戏这类高频画面； TextureView 更像 View 树的一部分，便于变换和动画，但可能多一次纹理合成成本。 更详细的 Surface / BufferQueue / SurfaceFlinger 关系见 [Android 渲染上屏流程]。 SurfaceFlinger：合成最终屏幕画面 SurfaceFlinger 是系统合成服务。它从各个 Layer 拿到最新 buffer，根据窗口层级、裁剪、透明度、旋转、缩放等信息，决定每个 Layer 如何出现在最终屏幕上。 合成方式通常有两类： 1. HWC 合成：交给硬件合成器处理，功耗和性能更好。 2. GPU 合成：复杂变换或硬件不支持时，由 GPU 合成。 最终合成结果会提交给显示设备。对应用来说，这意味着：即使应用侧已经完成绘制，如果 SurfaceFlinger 合成、HWC 提交或显示链路发生排队，也会影响最终上屏时间。 延迟来源与卡顿定位 三缓冲和延迟 Android 图形链路常见生产者-消费者模型： 双缓冲时，如果消费者还没释放上一块 buffer，生产者可能阻塞。三缓冲可以降低阻塞概率，让生产和消费更平滑，但代价是链路里可能多排队一帧。 这也是为什么云游戏这类实时场景会非常关心“多一次 buffer、多一次 SurfaceTexture、多等一个 VSYNC”。普通 UI 更关心稳定帧率，云游戏还要同时压低端到端操作延迟。 卡顿通常卡在哪里 从这条链路看，卡顿不一定只发生在 draw： 1. 主线程消息太重：输入、动画、traversal 没法按时执行。 2. 布局层级复杂：measure/layout/draw 耗时过长。 3. 频繁刷新：短时间内大量无效 invalidate() 造成帧压力。 4. GPU 负载高：RenderThread 执行绘制命令或纹理处理过慢。 5. Buffer 排队：生产和消费节奏不匹配，出现等待。 6. SurfaceFlinger/HWC 合成压力高：多 Layer、复杂裁剪、透明混合或缩放导致合成耗时。 常用观测手段可以结合 [卡顿与丢帧排查]： - adb shell dumpsys gfxinfo \u003c包名 ：看每帧 UI 线程、RenderThread、GPU 等阶段耗时。 - FrameMetrics ：在线上或实验环境采集窗口级帧耗时。 - Choreographer 回调：统计 FPS、掉帧和主线程帧调度延迟。 - Systrace / Perfetto：分析 VSYNC、traversal、RenderThread、SurfaceFlinger、HWC 的跨进程链路。 云游戏中的链路复用 云游戏里的“渲染”至少包含两段 Android 图形链路： 1. 远端 Android 容器内，游戏 App 渲染到 Surface，再由 SurfaceFlinger 合成或输出给抓屏链路。 2. 客户端收到视频帧后，MediaCodec 解码输出到 SurfaceTexture 或 Surface，再由本机 SurfaceFlinger 合成上屏。 因此云游戏优化里常见的 OES、YUV、VirtualDisplay、SurfaceTexture、编码 Surface、渲染直通，本质上都是在调整这条图形链路中的 buffer 流转方式。优化目标不是“让 View 少画一点”，而是减少格式转换、内存拷贝、串行阻塞和额外合成。 ","description":"","practiceLabel":""},{"title":"事件分发机制","url":"/notes/5202b7428683905e/","section":"client","sectionTitle":"客户端开发","folders":["Android","UI 与渲染"],"text":" 事件分发机制 Input 系统负责把事件送到正确的 Window；事件进入 App 后，View 事件分发机制负责在当前窗口的 View 树中找到处理者。 下图先固定一条正常点击主线：父容器不拦截、 OnTouchListener 不消费、目标 View 始终保持有效点击状态。 [Android View 事件分发主链] 事件进入窗口后的入口 DecorView 先通过 Window.Callback 把事件交给 Activity；Activity 再调用 Window，把事件送回 DecorView 的父类实现，正式进入 View 树。Activity 是窗口回调，不是 View 树的父节点。 窗口选择、InputChannel 和 VSYNC 对齐过程见 [Input 输入系统流程]。 回调职责与触摸目标的建立 五个关键回调 方法 所属对象 职责 --- --- --- dispatchTouchEvent View / ViewGroup 分发入口，返回本节点或后代是否处理了事件 onInterceptTouchEvent ViewGroup 决定当前事件是否从子 View 手中截走 OnTouchListener.onTouch View 业务监听器，先于 onTouchEvent 执行，可直接消费 MotionEvent onTouchEvent View / ViewGroup 当前节点真正处理事件；返回 true 表示愿意接管手势 OnClickListener.onClick View 点击语义回调，由 onTouchEvent 在有效点击完成后通过 performClick 触发 View.dispatchTouchEvent 中，已启用且可用的 OnTouchListener.onTouch 先于 onTouchEvent 执行；监听器返回 true 后不会再调用该 View 的 onTouchEvent 。 ViewGroup 如何确定触摸目标 每一层 ViewGroup.dispatchTouchEvent 都负责“是否拦截、交给哪个子节点、是否记录触摸目标”三个决策： 后续 MOVE/UP 优先沿 TouchTarget 发送，不会每次重新遍历整棵 View 树。消费结果沿递归调用栈向上返回，不是 DOM 那种独立的冒泡阶段。 DOWN 如何确定整条手势链 一次手势通常是 DOWN - MOVE... - UP/CANCEL ： 1. DOWN 从根 ViewGroup 向下命中子节点。 2. 子节点消费 DOWN 后，父 ViewGroup 用 TouchTarget 记录该子节点。 3. 后续 MOVE/UP 沿已记录的 TouchTarget 继续发送，不再重新完整命中 View 树。 4. 如果父容器在 MOVE 阶段开始拦截，子节点收到由当前事件转换出的 CANCEL ，之后的事件改由父容器处理。 因此自定义 View 若想持续收到后续事件，通常必须消费 DOWN 。子 View 可以调用 requestDisallowInterceptTouchEvent(true) ，要求祖先暂时不要拦截后续事件，但新的 DOWN 会重置这一状态。 从触摸序列生成点击 onClick 不直接接收 MotionEvent，也不参与 ViewGroup 的路由。默认点击由 View.onTouchEvent 根据一整段手势状态合成： 因此： - OnTouchListener.onTouch 返回 false ：继续执行 onTouchEvent ，默认点击逻辑仍有机会触发。 - OnTouchListener.onTouch 返回 true ：本次事件不会进入 onTouchEvent ；如果整段手势都被监听器消费，默认 onClick 不会自动产生，需要在合适时机调用 performClick() 。 - onTouchEvent 消费 DOWN 的意义不只是处理这一次事件，还会让父容器记录 TouchTarget，使该 View 继续收到后续事件。 父子滚动协作与模型边界 为什么这样设计 - 子 View 优先：点击坐标命中的具体控件通常最了解如何处理事件。 - 父容器可夺取：ScrollView、ViewPager 等容器可以观察位移，在确认是滚动手势后中途拦截。 - 手势保持连续：DOWN 建立 TouchTarget，避免手指移动时处理对象不断变化。 - 无人处理时兜底：子节点返回 false ，父节点仍有机会在自己的 onTouchEvent 中处理。 它解决的是“子控件点击”和“父容器滚动”之间的仲裁，而不只是把一次点击广播给所有节点。 NestedScrolling 如何协调父子滚动 requestDisallowInterceptTouchEvent 控制的是父容器能否接管 MotionEvent ； NestedScrolling 不改变 TouchTarget，而是让当前 Child 把每次滚动的 dx/dy 与 Parent 分段消费。 [Android NestedScrolling 滚动距离协商] 一次嵌套滚动分为四步： 1. Child 调用 startNestedScroll ，沿父链找到愿意接受对应滚动轴和类型的 NestedScrolling Parent。 2. 每次滚动前调用 dispatchNestedPreScroll ，Parent 通过 consumed[] 先消费一部分距离。 3. Child 消费剩余距离，再通过 dispatchNestedScroll 报告已消费量和未消费量，Parent 可以继续处理剩余部分。 4. UP/CANCEL 后调用 stopNestedScroll ；fling 则使用 dispatchNestedPreFling/dispatchNestedFling 协商速度归属。 这条协作链传递的是滚动距离和速度，不是重新分发 MotionEvent ，也不经过 Binder；调用发生在同一 View 树的普通 Java 方法之间。 onNestedPreScroll/onNestedScroll 不等于 onInterceptTouchEvent ，不会自动转移 TouchTarget 或向 Child 发送 CANCEL 。AndroidX 通过 NestedScrollingChildHelper 、 NestedScrollingChild3 和 NestedScrollingParent3 补充了 TYPE_TOUCH/TYPE_NON_TOUCH 以及多级消费能力。 与 DOM / React 的区别 模型 向下阶段 向上阶段 目标如何保持 --- --- --- --- Android View dispatchTouchEvent 递归 + onInterceptTouchEvent 仲裁 子调用返回 false 后父节点兜底，不是独立冒泡回调 DOWN 建立 TouchTarget，覆盖连续手势 DOM capture 从祖先到 target bubble 从 target 到祖先，祖先监听器依次执行 每个事件按 DOM 命中和传播路径处理 React DOM 以组件事件处理器表达 capture / bubble，可停止传播 子组件处理器执行后继续到父组件处理器 主要面向 click 等语义事件传播 Android 更强调连续手势所有权和父子手势冲突；DOM/React 更强调同一个离散事件在祖先链上的传播。两者图形上都像“下去再上来”，但“向上”的语义不同。 另一种常见设计是“集中命中测试 + 手势竞争”：根节点先生成命中路径，再让点击、滑动、缩放等识别器竞争手势所有权。它把仲裁从 ViewGroup 拦截改成独立的手势识别层，Flutter 和游戏 UI 常采用这种思路。 源码入口与结论 源码入口 - [ViewRootImpl.java]： ViewPostImeInputStage 、 processPointerEvent 。 - [DecorView.java] 与 [Activity.java]：Window.Callback 往返链路。 - [ViewGroup.java]： dispatchTouchEvent 、 TouchTarget 、拦截和 CANCEL。 - [View.java]： dispatchTouchEvent 、 onTouchEvent 、 performClick 。 - [NestedScrollingChildHelper.java]：查找协作 Parent、预消费、剩余距离和停止协作。 - [NestedScrollingParent3.java]：Parent 对已消费量和未消费量的处理协议。 关键结论 1. InputDispatcher 只选中 Window，ViewRootImpl 才是事件进入该窗口 View 树的入口。 2. Activity 是 Window.Callback，不是 View 树父节点。 3. Android 的向上过程本质是消费结果沿递归调用栈返回，不等同于 DOM 冒泡。 4. DOWN 决定 TouchTarget；父容器中途拦截时，原目标收到 CANCEL。 5. 触摸路径中的 onClick 不是分发方法，而是 View.onTouchEvent 对有效点击手势生成的语义回调。 6. requestDisallowInterceptTouchEvent 协调 MotionEvent 归属；NestedScrolling 协调父子对滚动距离的共同消费。 ","description":"","practiceLabel":""},{"title":"Dagger2 基础与多宿主实践","url":"/notes/029f8807a6033e04/","section":"client","sectionTitle":"客户端开发","folders":["Android","框架与工程"],"text":" Dagger2 基础与多宿主实践 本文通过多宿主示例说明 Dagger2 的对象创建与组装机制，以及 @Inject 、Module、Component、Binding 和 Scope 的关系。 依赖注入要解决的问题 依赖注入解决什么问题 如果业务对象自己创建具体依赖： 它会同时负责业务逻辑和对象组装，并且直接依赖某个宿主实现。迁移到另一个宿主时，只能修改公共代码、增加宿主判断，或者复制一套实现。 改成从外部传入依赖： 公共业务只依赖接口，具体实现由外部组装。Dagger2 帮助完成的就是这部分重复工作： 依赖注入没有消除依赖，而是将“直接创建具体实现”改为“声明对抽象能力的依赖”。 先建立一个心智模型 Dagger2 可以理解为一个 编译期生成的对象工厂 。 业务代码只声明自己依赖什么： Dagger2 根据构造函数、Module 和 Component 建立依赖图，并生成普通的对象创建代码： 运行时仍然会创建这些对象；“编译期依赖注入”指的是依赖图校验和组装代码生成发生在编译期，不是编译时就创建业务对象。 六个核心概念 概念 含义 --- --- Dependency 一个对象需要使用的其他对象，例如容器依赖 HostAbility Binding 如何获得某个类型的规则，例如 HostAbility - DouyinHostAbility @Inject 声明可使用的构造函数，或者标记需要成员注入的位置 Module 集中声明不能仅靠构造函数推导的 Binding Component 依赖图的边界、入口和生成代码的载体 Scope 指定某个 Binding 在同一 Component 实例中的复用范围 最小示例与 Binding 声明方式 跑通一个最小示例 1. 配置编译器 Kotlin 工程常见的 KAPT 配置如下，版本号以项目实际使用版本为准： Java 工程可以使用 annotationProcessor 。已有工程选择 KSP 后端时，需要按所用 Dagger 版本及其他代码生成器的兼容情况判断。 2. 定义公共能力 3. 声明具体对象如何构造 构造函数上的 @Inject 告诉 Dagger：需要这个类时，可以调用这个构造函数；构造参数则会继续成为依赖图中的节点。 4. 将接口绑定到实现 接口没有构造函数，Dagger 不知道 HostAbility 应该使用哪个实现，因此需要 Module： 这条 Binding 表示： 5. 声明依赖图入口 Component 的返回值方法叫 Provision Method，表示调用者可以从依赖图获取这个对象。 6. 使用生成的 Component 编译后，Dagger 会生成以 Dagger 为前缀的实现： 生成代码完成的工作大致是： @Inject 的两种常见用法 构造函数注入 优先使用构造函数注入，因为依赖在对象创建时就完整，测试时也可以直接传入 Fake 对象。 成员注入 Activity 等由 Android 系统创建的对象不能直接由 Dagger 调用构造函数，可以使用成员注入： 调用者需要显式执行： 成员注入完成前字段不可用，因此普通业务类仍然优先使用构造函数注入。 @Binds 与 @Provides 怎么选择 使用 @Binds 声明接口映射 @Binds 方法是抽象方法，没有方法体。参数是已有实现，返回值是对外暴露的类型。 使用 @Provides 执行创建逻辑 @Provides 适合以下场景： - 第三方类无法添加 @Inject ； - 对象需要配置参数或工厂方法； - 创建过程包含条件或额外逻辑； - 需要提供系统对象。 简单判断： Component、Scope 与实例生命周期 Component 到底管理什么 Component 主要承担三类职责： 1. 确定当前依赖图包含哪些 Module 和 Binding。 2. 对外提供获取对象或注入现有对象的入口。 3. 持有当前依赖图中 Scoped Binding 的缓存。 Component 不是全局容器的同义词。可以按业务生命周期拆成多级依赖图： 子组件可以使用父组件中的 Binding；父组件不能反向依赖子组件，兄弟子组件之间也不能直接依赖彼此。 Scope 如何与 Component 关联 1. 定义自定义 Scope 2. 标记 Component 3. 标记 Binding Dagger 编译器看到 Component 和 Binding 使用相同的 Scope 注解后，将这个 Binding 的 Provider 缓存在生成的 Component 实例中。生成代码的核心逻辑可以近似理解为： 因此： Scope 的含义是“同一个 Component 实例内复用”，不是“所有使用同一 Scope 注解的 Component 共享对象”。 Scope 什么时候结束 Scope 本身只是注解，没有 release() 。真正持有对象的是生成的 Component： 业务退出时需要： 1. 主动反注册监听、取消任务和释放播放器等资源； 2. 清除业务层对 Component 的引用； 3. 清除其他对象对 Scoped 对象的外部引用； 4. 等待 JVM 在合适时机回收对象。 Dagger 不会自动调用 release() ，Scope 也不保证业务对象内部线程安全。 @Singleton 不一定是进程全局单例 @Singleton 仍然遵循“每个 Component 实例缓存一次”的规则： 只有应用全程只创建一个 AppComponent ，它才表现为进程级单例。创建两个 AppComponent ，仍然会有两组 @Singleton 对象。 多宿主下的依赖图组合 在多宿主迁移中，两者解决的问题不同： 工程结构可以抽象为： 公共业务： 不同 Flavor 分别把自己的实现绑定为 HostAbility 。最终链路是： Dagger2 不是在运行时动态判断宿主，宿主实现已经由 Flavor 在编译阶段确定。 编译错误与定位方法 错误 常见原因 处理方向 --- --- --- MissingBinding 接口没有 @Binds/@Provides ，或者构造函数没有 @Inject 沿错误中的依赖链补充 Binding DuplicateBindings 同一个类型存在多个未区分的实现 删除重复 Binding，或使用 Qualifier 区分 IncompatiblyScopedBindings Scoped Binding 与管理它的 Component Scope 不匹配 调整 Binding 所在组件或 Scope Dependency cycle A 直接依赖 B，B 又直接依赖 A 重新划分职责；必要时通过 Provider/Lazy 延迟一侧，但不要掩盖设计问题 生成的 Component 不存在 编译器依赖未接入，或前面已有 Dagger 编译错误 检查 KAPT/KSP/annotationProcessor 配置和首个报错 如果同一类型存在多个合法实现，可以通过 Qualifier 区分： 延伸主题与官方资料 依赖图扩展与创建时机 与依赖图扩展和对象创建时机相关的主题还包括： - Provider\u003cT 与 Lazy\u003cT 的创建时机； - @Subcomponent 与父子依赖图； - Component Dependency 与 Subcomponent 的区别； - Multibindings： @IntoSet 、 @IntoMap ； - Assisted Injection：运行时参数与依赖图参数混合创建； - 测试中如何替换 Module 或构建测试 Component。 官方资料 - [Dagger Basic Usage] - [Dagger Subcomponents] - [Dagger KSP] ","description":"","practiceLabel":""},{"title":"卡顿与丢帧排查","url":"/notes/7556cd7c3bc2b1c3/","section":"client","sectionTitle":"客户端开发","folders":["Android","性能稳定性"],"text":" Android 卡顿与丢帧系统化排查 卡顿排查的目标不是找到一个“超过 16.6ms 的函数”，而是确认哪一帧没有按计划显示，以及延误发生在 App、系统调度、SurfaceFlinger、GPU、DisplayHAL 还是输入链路。 Android 一帧的生产和上屏机制见 [渲染流程] 与 [Android 渲染上屏流程]。本文只保留定位丢帧所需的系统边界和排查方法。 定义问题：丢帧与责任链 什么才算丢帧 显示系统会为每一帧预测一个呈现时间。现代 Android 的 FrameTimeline 将一帧判定为 Jank，核心依据是实际呈现是否符合调度器预测的呈现时间，而不只是某个函数是否超过固定时长。 刷新率 名义刷新周期 ---: ---: 60 Hz 16.67ms 90 Hz 11.11ms 120 Hz 8.33ms 刷新周期只是理解帧预算的起点。真正的 deadline 还受 VSYNC 调度、应用提交、GPU Fence、SurfaceFlinger 合成和显示设备呈现时机影响。 需要区分三种现象： 1. 呈现 Jank：新帧没有在预测时间显示，屏幕延迟显示或重复旧内容。 2. 高延迟：画面可能仍然保持均匀，但 Buffer 排队使输入到显示的延迟变大。 3. 逻辑卡顿：每帧都按时上屏，但动画位移、数据时间戳或手势采样不均匀，肉眼仍然感觉跳变。 平均 FPS 会掩盖连续卡顿和帧率波动。监控应同时观察 Jank 率、连续丢帧、最大超期时间和 P50/P90/P95/P99 分布。 从输入到屏幕的责任链 App 负责按时生成和提交自己的 buffer；SurfaceFlinger 负责收集各 Layer、完成合成并提交显示设备。任何一段错过 deadline，最终都可能表现成前台 App 卡顿。 因此“前台 App 卡了”只描述现象，不能直接把责任归给 App。 第一步：区分责任层并选择证据 先判断 App 还是系统 排查顺序应从问题帧向两端展开，而不是先抓一个主线程堆栈就开始优化： 1. 明确操作、页面、Window/Layer、刷新率和问题时间点。 2. 用 FrameTimeline 判断 App 帧还是 SurfaceFlinger/DisplayFrame 延误。 3. 关联 App UI Thread、RenderThread、GPU completion 和 SurfaceFlinger 帧 token。 4. 根据线程状态判断是执行、调度、锁、Binder 还是 I/O。 5. 检查 CPU 频率、Thermal、内存压力和后台负载等系统条件。 6. 回到源码或业务 TraceSection，确认具体函数和依赖关系。 FrameTimeline 如何归因 Android 12 及以上的 Perfetto FrameTimeline 同时提供 App 和 SurfaceFlinger 的 Expected Timeline、Actual Timeline，并用 token 把 App 帧关联到最终 DisplayFrame。 Jank 类型 含义 优先检查 --- --- --- AppDeadlineMissed App 的 CPU、RenderThread 或 GPU 工作未按 deadline 完成 doFrame 、traversal、RenderThread、GPU completion BufferStuffing App 持续提交过快，BufferQueue 中积压未呈现 buffer queue/dequeue、生产速率、输入到显示延迟 SurfaceFlingerCpuDeadlineMissed SurfaceFlinger 主线程未按时完成 Layer 计算、事务处理、设备合成阻塞 SurfaceFlingerGpuDeadlineMissed SurfaceFlinger CPU 阶段完成，但 GPU 合成未按时完成 GPU 负载、Client Composition、Fence DisplayHAL SurfaceFlinger 已提交，但显示 HAL 没有按预期 VSYNC 呈现 HWC、DisplayHAL、Fence、面板链路 PredictionError 调度器预测时间和硬件 VSYNC 发生偏移 刷新率切换、调度预测；孤立事件不一定可感知 Unknown 已出现 deadline 异常，但现有证据不能完整归因 补充调度、Fence、Binder 和厂商轨道 FrameTimeline 当前对部分 SurfaceView 场景存在覆盖限制。游戏、视频等独立 Surface 需要结合对应 Layer、生产者渲染线程、SurfaceFlinger 和显示轨道判断，不能只依赖 View 体系的帧指标。 不同工具分别能证明什么 工具 适用场景 能证明什么 主要边界 --- --- --- --- Choreographer.FrameCallback App 内轻量趋势监控 主线程帧回调间隔、回调是否延迟 看不到最终呈现，不能区分 RenderThread、SF 和 DisplayHAL FrameMetrics API 24+ Window 帧阶段统计 Window 每帧多个阶段的耗时 回调运行在注册时指定的 Handler；仍不是完整系统归因 JankStats 线上 Window 级 Jank 与场景聚合 帧耗时、Jank 判断、业务 UI State 每个 Window 单独注册；回调必须轻量，数据对象需要及时复制 dumpsys gfxinfo ... framestats 本地快速查看 View 体系近期帧统计 信息有限，不足以还原跨进程根因 Perfetto FrameTimeline Android 12+ 单次问题定位 App 与 SF 的 Expected/Actual Timeline、Jank 类型和关联帧 需要复现或命中采样；部分 SurfaceView 场景覆盖有限 Android Studio System Trace 开发阶段交互分析 UI Thread、RenderThread、GPU、调度和 FrameTimeline 不适合作为长期线上全量监控 Macrobenchmark FrameTimingMetric 固定场景回归测试 frameOverrunMs 、 frameDurationCpuMs 的分位数 证明测试场景回归，不代表全部线上设备 Window.addOnFrameMetricsAvailableListener() 的回调在传入的 Handler 所在线程执行，不必占用主线程；但回调本身仍应只复制和聚合数据，不能做日志格式化、磁盘 I/O 或网络上报。 Choreographer 更适合发现“主线程帧回调出现了多大间隔”，不能把它统计的 FPS 当作最终屏幕真实 FPS。最终呈现归因优先看 FrameTimeline。 第二步：从监控线索定位根因 系统侧常见根因 1. CPU 调度和频率 线程状态能区分“代码执行慢”和“没有被调度”： Trace 现象 说明 --- --- 长时间 Running 线程真实占用 CPU，检查计算、布局、绘制或序列化 长时间 Runnable 线程已经可运行，但拿不到 CPU，检查系统负载、优先级和 CPU 亲和性 Sleeping / futex 可能在等待锁、条件变量、Binder 或其他线程 Uninterruptible Sleep 常见于块设备 I/O 等不可中断等待 系统层面的典型原因包括： - UI Thread 或 RenderThread 被调度到性能不足的小核。 - 关键线程优先级不足，长时间处于 Runnable。 - 被实时线程或大量后台线程抢占。 - CPU 频率未及时提升，或被错误限制在低频。 - 设备过热触发 Thermal 限频，CPU/GPU 可用性能下降。 单看进程 CPU 使用率无法证明主线程卡在哪里。必须结合 sched_wakeup 、 sched_switch 、线程状态、CPU frequency 和 Thermal 轨道。 2. system_server、Binder 和锁 App 在主线程同步调用系统服务时，可能等待： 如果 App 主线程处于 Sleeping，且 Binder flow 指向 system_server ，应继续检查： - Binder 线程池是否繁忙。 - 服务端是否在等待全局或关键锁。 - 锁持有者是否执行磁盘 I/O、跨进程调用或复杂计算。 - 窗口事务、Activity 切换和输入焦点更新是否被同一锁链阻塞。 “主线程没有执行耗时 Java 方法”不能排除 App 帧超时，它可能一直在等待系统服务返回。 3. SurfaceFlinger 和显示链路 系统篇文章中的 SurfaceFlinger、HWC、CRTC 问题，可以在现代链路中归纳为： 常见问题包括： - Layer 或事务过多，Layer 树计算和合成决策耗时。 - 复杂透明、缩放、旋转或格式不受 HWC 支持，回退 GPU 合成。 - SurfaceFlinger 主线程执行过久，或者被调度延迟。 - App、GPU、HWC 之间的 Fence 长时间未 signal。 - DisplayHAL/HWC 提交耗时，最终错过硬件 VSYNC。 - 刷新率切换或 VSYNC 预测异常，造成帧节奏不稳定。 App 的 queueBuffer() 或 dequeueBuffer() 阻塞，有时只是下游 SurfaceFlinger、GPU 或 BufferQueue 拥塞向上游传播的结果，不能看到调用点就直接归因于 App。 4. 内存压力和 I/O 现代 Android 主要由 userspace lmkd 监控内存压力，Android 10 及以上可使用 PSI 描述任务因为 CPU、内存或 I/O 资源不足而被阻塞的时间。 排查低内存不能只看 MemFree 。还要结合： - MemAvailable 、swap/ZRAM 使用情况。 - /proc/pressure/memory 与 /proc/pressure/io 。 - kswapd 、direct reclaim、major page fault 和 page cache refault。 - lmkd kill 记录以及进程反复死亡、重启。 - App GC 和系统后台回收任务的 CPU 占用。 低内存引发的卡顿通常是 CPU、I/O、缺页和进程重启共同作用，不是 lmkd 单点耗时。 5. Input 链路不均匀 连续滑动时，如果 InputReader 报点不均匀、InputDispatcher 调度延迟、目标窗口切换或 Accessibility 处理过重，App 收到的输入本身就可能出现空洞。 这类问题不一定是“画面渲染失败”，而可能是没有新的输入状态可供动画或手势更新，用户同样会感到画面停顿。应同时检查： 完整输入链路见 [Input 输入系统流程]。 线上监控到线下定位 线上事件建议至少包含： - 页面、操作、动画阶段和 Window 标识。 - 当前刷新率、帧开始时间、帧耗时和超期时间。 - 单帧/连续 Jank 数量及最大连续时长。 - 前后台、冷启动/普通交互、设备等级和系统版本。 - CPU/内存压力、Thermal 状态和 GC 计数的轻量快照。 - 命中采样时的主线程堆栈或 Perfetto trace 标识。 不要每帧上传原始数据。线上先按一次交互、一次滑动或固定时间窗聚合，只对严重和高价值场景提高采样率。 第三步：按责任层优化并排除误判 按责任层优化 责任层 常见优化方向 --- --- UI Thread 拆分长 Message，移除同步 I/O/Binder，减少重复 measure/layout、对象分配和图片解码 RenderThread/GPU 降低过度绘制、纹理上传、复杂阴影与模糊，复用纹理，控制离屏渲染 BufferQueue 控制 producer 节奏，避免 BufferStuffing；低延迟场景限制无意义排队 SurfaceFlinger 减少不必要 Layer 和事务，降低透明混合、复杂变换及 GPU 合成压力 CPU 调度 控制后台并发，避免线程爆炸；系统侧再检查优先级、核分配和频率策略 内存 降低峰值和抖动，减少 page cache thrashing、频繁 GC 与进程杀死重启 Thermal 降低持续 CPU/GPU 功耗，避免优化只在冷机短测中成立 Input 检查报点、派发和消费节奏，避免把输入空洞误判为渲染耗时 IdleHandler 、线程池和异步化都不是无成本方案。Idle 可能长期得不到执行机会，后台任务也会争抢 CPU、I/O 和内存带宽。是否移出关键帧，要以 trace 中的 deadline 和资源竞争结果验证。 常见误判 1. 主线程超过 16.6ms 就一定掉帧 ：刷新率和实际 deadline 会变化，还要看 RenderThread、GPU、SurfaceFlinger 和最终呈现。 2. 主线程没耗时就是系统问题 ：主线程可能在 Runnable、Binder、锁或 I/O 等待中。 3. 三缓冲能解决掉帧 ：它能降低 producer 阻塞、改善吞吐，也可能带来 BufferStuffing 和额外输入延迟。 4. 平均 FPS 高就足够流畅 ：连续两三帧超期通常比零散慢帧更明显，帧间隔方差也很重要。 5. Choreographer 回调就是屏幕帧 ：它只看到 App 侧 Looper 的帧调度，不能证明最终显示时间。 6. 看到 queueBuffer/dequeueBuffer 慢就是 App 问题 ：可能是下游 buffer、Fence、SurfaceFlinger 或显示链路反压。 7. 低内存只会导致 LMK 杀进程 ：回收、swap、缺页、I/O 和重启风暴在 kill 前后都可能造成卡顿。 8. 所有卡顿都能在 FrameTimeline 里解释 ：输入不均、逻辑动画跳变和部分独立 Surface 场景还需要其他证据。 参考资料 - [Android 中的卡顿丢帧原因概述：方法论] - [Android 中的卡顿丢帧原因概述：系统篇] - [Android 中的卡顿丢帧原因概述：应用篇] - [Android 中的卡顿丢帧原因概述：低内存篇] - [Android Systrace：Triple Buffer 解读] - [Perfetto：Android Jank detection with FrameTimeline] - [Android Developers：JankStats] - [Android Developers：Macrobenchmark metrics] - [AOSP：SurfaceFlinger and WindowManager] - [AOSP：Low memory killer daemon] ","description":"","practiceLabel":""},{"title":"Lynx 渲染架构与跨端选型","url":"/notes/741ac84d1e8f8b8a/","section":"client","sectionTitle":"客户端开发","folders":["跨端","Lynx"],"text":" Lynx 渲染架构与跨端选型 在原生应用中接入跨端页面，需要同时考虑页面加载、原生能力调用和版本更新。Lynx 的选型价值取决于这三项需求，以及团队已有的组件和发布设施。 对首屏数据可提前准备、需要复用宿主能力的页面，可以验证 Lynx 的接入收益。评估时同时计算容器建设和长期维护成本，性能结论由同一业务页面的测量结果决定。 1. 宿主内嵌页面的需求与约束 以应用内的权益面板为例：标题、权益说明和按钮布局经常调整，登录、支付和页面跳转仍由宿主提供。跨端页面负责内容与交互，宿主负责已有能力和生命周期。 需求 对方案的要求 --- --- 打开面板后尽早显示有效内容 页面包和首屏数据可及时获得，渲染耗时可测量 两端复用页面代码 组件、样式、交互及原生接口行为一致 调整页面不影响已有主流程 页面与宿主通过明确的接口交互 页面版本可独立管理 资源校验、兼容检查、灰度和回滚机制完整 宿主升级后仍能维护 SDK、构建工具、页面包和能力协议有兼容记录 频繁改版只能说明复用和发布效率值得优化，不能单独证明需要更换框架。如果已有 Web 页面或跨端组件足以满足要求，迁移成本也要计入选型。 2. Lynx 的整体架构 2.1 页面、运行时与宿主的分工 页面代码经构建生成页面包，由宿主加载到 LynxView。运行时执行页面逻辑并更新界面；登录、路由等能力通过原生模块连接宿主。 [页面代码构建为页面包，宿主负责加载和初始数据，运行时分为主线程与后台线程，通过原生模块连接宿主能力] 宿主容器需要处理页面包获取、版本检查、参数注入、页面销毁和异常展示。框架提供渲染与扩展接口，业务还需要接入自己的账号、资源和监控系统。 [!NOTE] 架构范围 首屏部分采用 Lynx 3.5 的双线程与即时首帧模型；后续更新以 ReactLynx 为例。原生模块是连接页面与宿主方法的接口，自定义原生组件则用于嵌入宿主视图。 2.2 首屏与后台逻辑并行执行 页面包与初始数据就绪时，主线程可以直接构建首屏；后台线程同时初始化页面逻辑。后台初始化不必串在首次绘制之前。[即时首帧机制] [主线程首屏构建与后台初始化并行；后台处理后续数据并计算变更，再提交主线程更新界面] 这个设计减少了首屏对后台初始化的等待，但主线程仍然承担首屏执行成本。页面结构复杂、同步计算过多，都可能占用主线程。 首屏数据需要网络请求时，先显示的可能只是骨架屏。要提前展示正文，需要把可用数据随页面加载一起提供；页面包本身也必须满足同步加载条件。 2.3 后续更新仍有跨线程成本 ReactLynx 的后续更新会在后台处理组件变化，再把变更提交到主线程更新元素、布局和界面。数据规模、更新频率及节点数量都会影响这段工作，不能把它概括成“差异计算全部下沉到原生层”。[渲染过程分析] 接入后可先检查三类问题：一次更新是否包含无关数据，短时间内是否重复触发更新，布局变化是否波及过多节点。优化应针对实际耗时阶段，而非仅减少某个接口的调用次数。 3. 跨端方案的多维对比 3.1 渲染与接入方式 维度 Lynx React Native 新架构 Flutter WebView --- --- --- --- --- 页面表达 页面组件与样式，构建为页面包 React 组件与原生组件 Dart 组件与框架渲染体系 HTML、CSS、JavaScript 原生应用接入 宿主嵌入 LynxView 宿主集成 React Native 页面 通过 add-to-app 嵌入模块 宿主加载 Web 页面 首屏关注点 包和数据准备、主线程执行 运行时启动、初次渲染与挂载 引擎准备、首帧及资源加载 容器准备、资源与页面渲染 宿主能力接入 原生模块、自定义原生组件 原生模块、原生组件 平台通道、插件及平台视图 宿主与网页通信接口 平台适配 验证组件、样式和宿主实现差异 验证原生组件与模块差异 验证插件及原生视图混合场景 验证内核版本与 Web 能力差异 React Native 需要区分架构代际：旧架构使用异步桥接，新架构通过 JSI 等机制直接连接 JavaScript 与原生代码。不能继续用旧桥接成本代表所有 React Native 页面。[新架构说明] Flutter 支持在已有应用中嵌入页面或局部视图，因此“只能做完整应用”不能作为排除依据。接入成本应结合引擎管理、导航和插件兼容情况评估。[嵌入现有应用] WebView 可以复用已有 Web 内容，但需要验证网页能力、宿主通信及所支持的内核环境。[Android WebView 接入] 3.2 发布与长期维护 维度 需要比较的实际工作 --- --- 页面复用 现有组件、业务逻辑和测试能复用多少，哪些需要重写 版本发布 页面资源与宿主版本如何匹配，失败时能否回退 原生能力 Android 与 iOS 分别需要补齐哪些方法和组件 调试定位 是否能关联页面版本、资源请求、渲染耗时及宿主错误 资源成本 新增包体、冷启动成本、预热内存及多实例峰值 持续维护 SDK 升级、依赖兼容和两端回归需要多少投入 对于依赖浏览器完整环境的已有页面，WebView 可以减少改造；已有成熟 React Native 或 Flutter 组件的团队，应计入继续复用的收益。原生方案也应作为基线，尤其是需要大量平台专有交互的页面。 页面资源可替换与宿主能力可更新是两件事。新页面调用旧宿主没有的方法时，仍需兼容处理或宿主升级；页面包发布能力不能消除这一约束。 4. 内嵌页面的接入实现 4.1 容器与页面的职责 权益面板可以采用下面的分工： 模块 职责 --- --- 页面层 展示权益、处理点击、渲染加载和错误状态 宿主能力层 提供登录、支付、路由及业务状态查询 资源层 选择兼容页面包，校验完整性，记录来源与版本 容器层 创建与销毁页面，注入初始数据，管理前后台状态 监控层 关联一次打开中的资源、渲染和异常记录 接口协议需约定参数、结果、错误码和最低能力版本。能力不足时显示可用的降级界面，不能让按钮持续等待一个不存在的方法。 4.2 加载、更新与失败处理 1. 校验兼容性。 根据宿主能力选择页面包，检查版本、来源和完整性。 2. 准备页面。 注册能力与监控回调，创建页面实例，注入可用的初始数据。 3. 加载与显示。 包和数据已就绪时直接渲染；需要异步请求时展示明确的加载状态。 4. 处理后续更新。 数据返回后更新对应组件；页面关闭后拒绝旧请求修改新实例。 5. 处理失败与退出。 加载失败时展示错误或兼容的备用页面，销毁时释放观察器和事件订阅。 回退包也必须满足当前宿主协议，不能只按时间选择“上一版”。一次打开固定使用选定版本，避免过程中切换资源导致组件与逻辑不匹配。 4.3 接入后的验证条件 验证项 条件控制 观察结果 --- --- --- 首屏 相同设备、业务数据和页面内容；区分冷启动与预热 首次内容、关键内容耗时分布 更新 相同节点规模和数据更新频率 更新耗时、主线程占用、丢帧情况 资源 分别测试缓存命中、下载、失败和回退 加载耗时、错误率、恢复结果 内存与包体 相同构建模式；记录预热与实例数量 新增包体、驻留内存、峰值及退出后回收 宿主兼容 覆盖最低支持版本和缺失能力 降级是否可用，错误能否定位 加载指标的采集与异常关联见 [Lynx 页面加载监控与异常定位]。 预热节省的等待时间应与额外驻留内存一起比较。只看热启动首屏，无法判断用户首次进入页面的成本。 5. 选型结论与验收依据 当页面内容需要跨端复用、首屏数据能够提前准备，且团队愿意维护容器、原生接口和资源发布系统时，Lynx 值得进入验证阶段。 验收结果需要回答两件事：页面体验是否达到既定目标，持续交付成本是否低于现有方案。前者由加载、交互与稳定性数据判断；后者由组件复用、两端适配和版本维护的实际工作量判断。 若首屏主要耗时来自网络数据，优先处理数据准备；若成本主要来自原生能力适配，先明确协议和职责。渲染框架的选择应对应已经识别的问题。 ","description":"","practiceLabel":""},{"title":"Lynx 页面加载监控与异常定位","url":"/notes/a708a884013d8a87/","section":"client","sectionTitle":"客户端开发","folders":["跨端","Lynx"],"text":" Lynx 页面加载监控与异常定位 Lynx 页面加载涉及容器准备、资源加载和页面渲染。监控需要记录各阶段耗时，并关联同一次页面打开中的异常，才能定位加载慢或白屏的原因。 实现上，由宿主记录页面入口和资源请求，Lynx 提供渲染事件，业务标记关键内容。三类数据按页面打开记录关联，避免把接口返回、首次绘制和内容可见混为一个指标。 1. 页面加载过程与监控目标 以详情页为例：容器创建后加载页面包，页面先显示骨架屏，业务数据返回后再显示正文。容器准备、页面包请求和数据请求可能重叠，不能把各阶段耗时直接相加。 [容器准备、页面包请求和业务数据请求并行进行；页面包就绪后首次绘制，数据就绪后更新关键内容] 观察目标 需要记录的证据 能定位的范围 --- --- --- 页面迟迟没有显示 页面入口、容器就绪、页面包就绪、首次渲染事件 容器准备、资源等待或首次渲染 骨架屏显示后等待较久 关键数据返回、更新提交、关键内容渲染事件 数据请求、更新调度或更新渲染 页面持续空白 页面前后台状态、容器可见性、资源和运行时异常 加载失败、渲染失败或可见性异常 [!NOTE] 页面包与容器 页面包是构建工具生成的 Lynx 加载产物。容器是宿主应用中负责创建页面、加载资源和管理生命周期的代码；它的耗时也属于用户打开页面后的等待时间。 2. 采集方案对比与整体架构 2.1 三类数据的分工 对比维度 框架性能事件 宿主与业务埋点 性能追踪 --- --- --- --- 主要覆盖 包加载、渲染过程、框架指标 打开入口、资源请求、业务内容条件 线程调度与细分执行阶段 判断依据 框架定义的时间点 业务约定的开始、结束条件 执行片段及时间关系 接入工作 注册回调，适配 SDK 字段 接入容器、资源层和关键组件 录制、关联标记、分析轨迹 数据成本 按需订阅事件 控制字段数量和上报频率 单次记录体积较大 主要限制 无法自动识别全部业务条件 容易漏埋或误用回调时间 不适合替代全部页面的常规统计 常规监控组合前两类数据；阶段耗时异常时，再用性能追踪细查。这样既能知道哪些页面变慢，也能继续定位到具体执行过程。 2.2 整体架构 [页面入口、资源请求、Lynx 渲染事件和业务标记进入页面记录，经过归属检查、时钟统一与去重后形成耗时和异常报告] 每次打开页面创建一条记录；同一容器重新加载页面包时，再创建新的加载编号。采集时保留加载上下文，并用事件中的加载或渲染标识确认归属，防止旧页面事件写入新页面。无法区分重载事件时，使用独立页面实例采集。 上报只保留定位需要的信息：页面类型、宿主版本、SDK 版本、页面包版本、资源来源和错误类别。请求地址去除用户参数，正文与接口响应内容不进入性能记录。 [!NOTE] SDK 接口 下文使用 Lynx 3.5 的 Performance API 命名。它提供首次加载、渲染过程和指标事件；客户端回调在异步线程执行，采集时读取事件自身的时间戳，不用回调到达时间代替渲染完成时间，也不在回调中直接操作界面。[接口说明] 3. 阶段耗时与关键内容标记 3.1 统一指标的起点和终点 先确定业务要观察的区间，再将 SDK 事件映射到区间端点。下表中的中文名称属于容器监控定义。 指标 起点 终点 数据来源 --- --- --- --- 容器准备耗时 开始创建容器 容器具备加载条件 宿主埋点 页面包获取耗时 本次请求发出 得到可用页面包 资源加载器 首次渲染耗时 开始向 Lynx 加载页面包 对应首次渲染完成点 加载埋点与框架事件 打开至首次内容耗时 页面打开入口 对应首次内容完成点 入口埋点与框架事件 打开至关键内容耗时 页面打开入口 全部必需内容满足展示条件 入口、业务标记及渲染事件 数据更新渲染耗时 关键数据更新提交 对应更新渲染完成点 业务埋点与关联的渲染事件 框架指标保留原始名称与定义。看板中的“打开至首次内容”单独计算，避免把起点不同的指标放进同一条曲线。 [!NOTE] 指标与事件对应 FCP 表示首次内容绘制，LynxFCP 侧重框架内的首绘区间，ActualFMP 对应业务标记的关键内容渲染。首次加载用 LoadBundleEntry 查看过程，标记后的更新用 PipelineEntry 关联；具体起止字段按 SDK 版本读取。 [!NOTE] 时间戳 区间两端必须使用同一单调时钟和单位。SDK 时间戳、宿主时钟及服务端时间不能未经转换直接相减。预加载可能早于页面打开，应单独记录预加载成本和打开后的剩余等待。 3.2 关键内容的完成条件 详情页可以把“标题、价格和购买按钮已按业务数据显示”定义为关键内容完成。骨架屏、空容器和请求成功都不能满足这个条件。 实现时，数据就绪后再为关键节点设置渲染标记，采集对应的完成事件。多个必需模块分别标记，全部完成后才结束业务首屏计时；合法的空数据页面则使用约定的空态展示条件。 [!NOTE] 渲染标记 Lynx 3.5 使用节点属性 __lynx_timing_flag 关联渲染过程；值为 __lynx_timing_actual_fmp 时还会产生 ActualFMP 事件。同一个标记只记录首次命中，多个模块需要不同标记，不能给标题和图片复用同一个值。[标记规则] 如果封面图属于必需内容，还要关联图片资源完成状态及其实际展示事件。文本容器完成渲染不能证明图片已经显示。遮挡、退到后台或容器脱离窗口，也需要结合宿主生命周期判断。 固定等待两三帧无法判断内容是否加载成功，不作为完成条件。普通布局回调、更新提交回调与性能事件也要分别处理。 3.3 页面记录与终态处理 页面记录在打开时创建，在成功、失败、超时或用户离开时结束。所有状态更新放到同一个串行处理队列中，结束后拒绝再次结算。 进入后台时停止本次前台首屏统计，并记录为中断；恢复前台后按恢复展示单独计时。超时后的迟到事件可以补充诊断信息，但不把原超时记录改写成成功。 [!NOTE] 注册与释放 观察器在加载前注册，页面销毁时释放。重新加载需要重置业务完成条件和事件归属；复用容器时只看容器实例无法区分前后两次加载。 4. 资源失败、白屏与错误率 4.1 资源请求保留每次尝试 一次页面包请求可能先读缓存，失败后再下载。请求记录需要保存每次尝试的来源、开始时间、结果和错误码，同时记录最终来源及页面包版本。 “缓存读取失败后下载成功”属于一次成功的页面包获取，同时包含一次失败的缓存尝试。只保留最终结果会丢失等待原因；把每次尝试都算作页面加载失败，又会高估失败率。 统计项 分子 分母 --- --- --- 页面包获取成功率 最终获取成功的逻辑请求数 已完成的成功与失败逻辑请求数 网络下载成功率 成功的网络尝试数 已完成的成功与失败网络尝试数 内存缓存命中率 直接由内存缓存返回的逻辑请求数 纳入缓存策略的逻辑请求数 离线包使用占比 最终由离线包返回的逻辑请求数 成功获取的逻辑请求数 取消和超时另列；这些指标使用不同分母，不能互相补成 100%。共享进行中的请求属于请求复用，也不计为内存缓存命中。 4.2 区分白屏与首屏超时 首屏超时表示截止时间内没有收到有效的完成信号。它可能来自加载慢，也可能来自埋点遗漏。只有同时获得页面可见且内容为空的检测证据，才能进一步标记为疑似白屏。 [首次内容未完成、关键内容未完成和内容已渲染但仍空白分别对应不同排查入口，异常需结合时间关系核对] 运行时错误、原生能力调用失败和接口失败要关联到页面记录，但不能仅凭同时发生就认定因果。例如非关键埋点调用失败，不应直接归因为白屏。 加载期间的页面级错误率按页面去重：加载期间发生某类错误的页面打开数，除以同一批页面打开总数。接口调用失败率按调用次数统计；一次页面连续失败三次，对前者计一次，对后者计三次。 采样在页面打开时决定，并让该页面的阶段和结果事件沿用同一决定。若异常记录另行全量收集，错误率应使用独立完整计数或正确的加权统计，不能直接除以已采样的正常页面数。 5. 定位示例与实现验证 5.1 从总耗时定位到资源等待 下面是一组用于演示计算的时间点，单位为毫秒： 事件 相对页面打开的时间 --- --- 页面打开、页面包请求发出 0 容器准备完成 40 关键业务数据就绪 120 页面包获取完成、提交 Lynx 加载 300 首次内容完成 340 关键内容完成 360 打开至首次内容耗时为 340 ms，其中页面包在 300 ms 才就绪，提交后渲染耗时为 40 ms。优先检查资源请求的尝试记录，确认是缓存未命中、下载慢还是读取失败后重试。 容器准备和数据请求都与资源等待重叠，因此不能再把 40 ms 和 120 ms 加到 340 ms 上。若总耗时下降，也要确认关键内容完成时间和失败率没有变差。 5.2 验证采集结果 验证场景 应观察到的结果 --- --- 人为延迟页面包返回 资源区间增长，渲染区间不应等量增长 人为延迟业务数据 骨架屏可先完成，关键内容完成点后移 页面包获取失败 产生失败终态，保留尝试记录与错误码 打开后立即退出或切后台 记录取消或中断，不进入成功首屏耗时样本 快速连续重载 不串用旧回调，每次加载最多结算一次 故意遗漏关键标记 产生超时，不能仅凭缺少回调判定白屏 验收时同时检查耗时分布、失败率、取消占比和事件完整率。阶段记录完整后，总耗时才能用于发现问题，分段耗时才能用于选择排查方向。 ","description":"","practiceLabel":""},{"title":"对象与资源管理","url":"/notes/7da782b3a8e0f2ef/","section":"fundamentals","sectionTitle":"编程与系统基础","folders":["C++"],"text":" 对象与资源管理 资源管理需要同时回答三个问题：资源由谁持有、何时释放，以及对象复制或移动时如何转移这些责任。以下从对象生命周期进入，再讨论 RAII、移动与多态销毁。 对象构造、资源分配与销毁 先明确对象与资源的生命周期 C++ 的引用和裸指针只是借用关系，不延长普通对象的生命周期： 悬空引用或指针指向已经销毁的对象，继续访问属于未定义行为。它与内存泄漏不同：泄漏是资源仍未释放但失去了可靠的释放路径。 malloc/free 与 new/delete malloc/free 只管理原始内存， new/delete 同时负责对象生命周期： 行为 malloc/free new/delete --- --- --- 构造和析构 不调用 调用 返回类型 void 对应类型指针 默认失败行为 返回 nullptr 抛出 std::bad_alloc 数组配对 手动计算字节 new[] 配对 delete[] 不要混用分配与释放方式。现代业务代码优先使用标准容器和智能指针。 用 RAII 与 Rule of Zero 管理资源 RAII 管理所有成对资源 RAII 将资源的获取与局部对象构造绑定，将释放与析构绑定。正常返回、中途 return 和异常栈展开都会执行局部对象析构。 RAII 不只用于内存，还适用于文件、锁、socket、JNI 引用和事务等资源： Rule of Zero 优先于手动管理 持有裸堆内存的类如果使用编译器生成的拷贝操作，可能发生浅拷贝和重复释放： 需要手动管理资源时，应考虑析构、拷贝构造、拷贝赋值、移动构造和移动赋值，即 Rule of Five。更好的选择是让标准库成员管理资源： 编译器生成的 Buffer 拷贝和移动操作会继续调用 vector 对应的安全操作，这就是 Rule of Zero。 移动语义与异常保证 std::move 只改变值类别 std::move 本身不移动资源，只将表达式转换为右值类别。移动后的对象仍然有效，可以析构和重新赋值，但其具体内容通常处于未指定状态。 std::move 不会移除 const ： 此时表达式类型是 const Buffer\u0026\u0026 ，不能绑定到需要修改源对象的 Buffer\u0026\u0026 。 noexcept 让容器敢于移动 noexcept 承诺异常不会逃出函数；如果异常仍逃出，程序调用 std::terminate() 。只有移动过程确实不抛异常时才能作此承诺。 vector 扩容时通常使用接近 std::move_if_noexcept 的策略： 这样可以在搬迁失败时尽量保持原容器不变。 多态销毁的边界 如果通过 Base 删除实际的 Derived 对象，而 Base 析构不是虚函数，行为未定义。正确析构顺序是先 Derived ，再 Base 。 不参与继承或声明为 final 的类不需要虚析构。基类设计通常选择： - 允许通过基类指针删除： public virtual 析构。 - 不允许通过基类指针删除： protected 非虚析构。 构造和析构期间，虚函数只派发到当前正在构造或析构的类。基类构造时派生部分尚未完成，基类析构时派生部分已经销毁。 要点回顾 优先让类型和成员表达所有权；用 RAII 保证成对释放，用 Rule of Zero 减少手写特殊成员函数。移动语义不等于资源自动转移，多态销毁也需要单独检查析构约定。 ","description":"","practiceLabel":""},{"title":"智能指针与异步生命周期","url":"/posts/cpp-lifetime/","section":"fundamentals","sectionTitle":"编程与系统基础","folders":["C++"],"text":" 智能指针与异步生命周期 本文讨论对象销毁与异步回调执行顺序不一致时，如何选择捕获方式，并把对象存活、请求取消和资源释放落实到接口中。 任务需要延长对象生命时捕获已有的强引用；允许随对象消失而放弃时捕获弱引用，并在执行时用 lock() 取得临时强引用。 页面关闭或新请求替代旧请求，还需要单独的取消或版本判断。智能指针负责对象存活，不负责判断一项业务操作是否仍应执行。 背景：页面、播放器与任务各有生命周期 页面通过 shared_ptr 持有播放器，执行器负责保存并调度播放任务。提交任务只表示执行器接收了回调，并不表示回调已经执行；页面可以在这段等待期间关闭，播放器也可能同时被其他模块持有。 因此，页面是否存在、播放器是否存活、播放请求是否仍然有效，是三个不同的状态。任务需要在哪些状态下继续执行，决定了它应当怎样保存播放器。 问题：任务排队后，对象先销毁 一个播放任务已经提交到队列，但还没有执行。此时页面关闭，最后一个持有播放器的对象释放了引用。等到任务出队，回调里保存的 this 还能用吗？ 要分析这类故障，先把三个时刻排列出来：任务入队、对象析构、任务执行。示例中，析构发生在执行之前；若能收集实际日志，可以为对象和任务记录标识，确认它们是否属于同一次请求，不能仅凭一次崩溃位置就认定是生命周期问题。 这段代码只把对象地址交给了任务。假如对象已经销毁，再通过这个地址调用成员函数，就会访问失效对象。即使播放器原本由 shared_ptr 管理，捕获 this 也不会自动增加引用计数。 给 play() 加锁并不能单独修复这个问题：如果对象已经不存在，访问它的成员锁本身也可能失效。把 this 复制进另一个局部变量，同样只复制地址。 需要改变的是任务和对象之间的持有关系。选择之前，先确定页面关闭之后，这个任务是否还有继续执行的必要。 [!NOTE] 示例约定 · C++17 executor.post() 保存回调供稍后执行； Player 通过 std::make_shared\u003cPlayer () 创建，并公开继承 std::enable_shared_from_this\u003cPlayer 。代码片段省略执行器与业务方法的实现。 方案比较：任务是否需要持有播放器 有几种办法能约束这个顺序，但代价不同： 做法 适用条件 需要付出的代价 --- --- --- 对象销毁前取消或等待全部任务 执行器能保证没有正在运行或稍后启动的回调 退出可能等待；同线程等待自己队列里的任务可能无法推进 任务捕获强引用 即使原调用方离开，任务仍需要这个对象 对象释放取决于闭包何时销毁，还要检查引用环 任务捕获弱引用 对象消失后可以放弃操作 执行时可能跳过，调用方必须接受这个结果 只复制任务所需的数据 操作可以脱离原对象完成 需要明确输入快照与结果接收方式 下面保留以 Player 为操作对象的接口，分别实现强引用和弱引用路径。若任务只需要几个不可变参数，复制参数也可能比延长整个播放器的生命更合适。 [强引用持有对象到回调释放；弱引用在没有其他持有者时失效] 强引用：延长对象生命周期 如果任务仍然需要访问播放器，可以让回调持有它： 这里有两个持有者：原来的业务对象，以及任务里的 self 。页面释放自己的引用后，任务仍持有播放器，因此播放器可以活到回调执行时。 释放时间还取决于队列什么时候销毁回调。即使回调已经执行，如果执行器继续保存这个闭包，其中的强引用也还存在。判断对象为什么没有析构时，需要沿着实际持有关系检查，不能只看函数是否返回。 这也说明，捕获强引用只解决对象存活问题。任务会不会被调度、是否超时、能否取消，仍由执行器和业务协议决定。 弱引用：执行时检查对象 如果任务只是更新已关闭页面的播放状态，继续延长对象生命周期就没有必要。可以在执行时尝试取得强引用： lock() 成功时返回一个 shared_ptr ，在 self 存活期间维持对象生命；对象已被销毁时返回空指针，回调跳过本次操作。这个获取过程是原子的，不应拆成“先检查 expired() ，再使用裸指针”两个步骤。可核对标准中的 [ weak_ptr::lock() 定义]。 [!WARNING] 弱引用不等于取消 页面关闭后，如果播放器仍被其他模块持有， lock() 依然可能成功。需要取消旧请求时，还应检查取消标记或请求版本。 同样， self 存活只保证对象没有被销毁。多个线程同时修改 Player 的成员时，仍需同步或将操作放在指定线程上。 实现：把存活、取消和释放分开处理 用请求代次取消过期操作 假设页面关闭后允许放弃播放，新的播放请求又会替代排队中的旧请求。弱引用已经能处理对象销毁，但如果别的模块仍持有播放器，旧任务仍能通过 lock() 。于是还需要一个请求代次，记录“这个任务是否仍是当前请求”。 每次发起新请求或取消时递增代次，任务保存提交时的值，执行时再比较。下面约定发起、取消和回调都在同一个事件线程执行；跨线程调用需要先调度到该线程，或另外设计同步。此处不把非原子的成员当作线程安全方案。 示例需要 \u003cmemory 、 \u003ccstdint ，并由执行器提供 post() 。执行器应覆盖播放器使用它的整个期间；播放器仍通过 make_shared 创建，在构造完成后才调用 requestPlay() 。 执行路径里有两次不同的判断： lock() 判断对象能否安全访问，代次比较判断任务是否已经过期。页面关闭但播放器仍存活时， cancelPending() 使排队中的回调成为空操作；连续两次 requestPlay() 则只保留最新一次的执行资格。 这是一种排队任务的逻辑取消，不会将回调从队列移除，也不能中断已经进入 play() 的操作。如果业务需要停止正在播放的内容，应提供单独的停止协议。执行器若因异常或容量限制无法接收任务，还需按业务要求回报提交失败。 取得强引用时复用已有控制块 强引用路径需要从当前对象取得一个持有者，这也是前面使用 shared_from_this() 的原因。若直接用 this 构造 shared_ptr ，虽然地址相同，却可能另建一套负责删除对象的控制块： shared_ptr 通过控制块管理共享所有权。控制块通常保存强、弱引用计数，以及删除对象所需的信息。复制已有的 shared_ptr 会共享控制块；从同一个裸指针分别构造两个 shared_ptr ，则会建立两套独立管理关系： 第二个指针应当从 first 复制： enable_shared_from_this 提供的也是复用已有所有权的途径： 这里 self 与 player 共享控制块。相关行为可以对照标准中的 [ enable_shared_from_this ]。 这个关系需要先建立。栈上的对象、仅由 unique_ptr 管理的对象，以及正在构造、尚未交给 shared_ptr 管理的对象，都不能据此取得有效的共享所有权。在上述正常继承条件下，过早调用 shared_from_this() 会抛出 std::bad_weak_ptr 。 weak_from_this() 在关系尚未建立时得到的是空弱引用；把它提前存进回调，不会在构造结束后自动补上关联。 因此，依赖共享所有权的异步启动通常应放在对象构造完成、交给 shared_ptr 管理之后。 沿持有关系检查引用环 假设对象持有一个回调，而回调又捕获对象的 shared_ptr ： 外部引用全部释放后，这个环内部仍然互相持有。如果没有清除回调的路径，对象就无法正常析构。 父子对象也有同样的问题。父对象拥有子对象，子对象只需要回查父对象时，可以让回指使用弱引用： 在 Child 的成员函数中，使用前临时取得强引用： 片段省略了业务方法的声明。哪一条引用应当变弱，要看谁负责拥有谁。把所有回指机械地换成弱引用，可能只是把泄漏变成任务意外失效。 实现效果：对象安全与请求有效分别验证 用一个可以手动推进的执行器，先只入队、不立即运行，再控制释放、取消和执行的顺序，就能验证这里讨论的条件： 操作顺序 预期结果 --- --- 强引用任务入队，释放外部引用，执行任务 对象在执行时仍存活；闭包释放后才能判断是否可析构 弱引用任务入队，释放最后一个强引用，执行任务 lock() 失败，不调用 play() 对象继续存活，入队后调用 cancelPending() 代次不匹配，任务不再调用 play() 连续提交两个播放请求，再推进队列 旧任务跳过，最新任务执行 对象持有捕获自身强引用的回调 清除回调或打破引用环前，对象不会仅因外部释放而析构 本地用可手动推进的执行器检查了前四类顺序，播放次数与析构标记均符合表中的预期；另外验证了取消后重新请求仍可执行。若真实执行器跨线程，还需对成员访问的同步与正在执行任务的停止协议分别验证。 这些结果对应开头的两个判断： 强弱引用决定任务能否安全访问对象，请求代次决定任务是否仍有执行资格。 对象已销毁时，弱引用阻止访问；对象还活着但请求过期时，代次检查阻止执行。只换成智能指针，无法同时解决这两类问题。 补充：同步借用与局部引用 异步任务需要单独考虑生命周期；同步调用若只在调用期间访问对象，可以直接表达借用关系： 常用类型可以按接口意图选择： 接口意图 常用表达 --- --- 借用一个可能为空的对象 T / const T ，约定不负责释放 借用一个必需存在的对象 T\u0026 / const T\u0026 接收或转移独占所有权 std::unique_ptr\u003cT 共同维持对象生命 std::shared_ptr\u003cT 观察对象，使用时再尝试取得所有权 std::weak_ptr\u003cT 裸指针这个类型本身不会说明谁负责释放，需要接口约定。仅为了读几个字段就要求传入 shared_ptr ，会把调用方的所有权方案带进接口。 局部变量的引用捕获 引用捕获局部变量时，也必须检查被引用对象能否活到回调执行： 如果回调只需要这个整数的值，改成值捕获即可： 检查回调时，可以先列出它保存的地址和引用，再逐个确认对象的销毁时机。这也是 [C++ Core Guidelines F.53] 提醒避免在逃逸的 lambda 中捕获局部引用的原因。 补充：对象析构与存储释放 使用 make_shared 时，还需要区分对象生命和底层存储： 合并分配通常能减少分配次数，但会影响弱引用残留时的内存释放时机。最后一个强引用释放后， User 已经析构；如果仍有弱引用，控制块还要保留。在对象与控制块合并分配的实现中，整块存储也要继续保留，直到最后一个弱引用释放。 对于较大的对象，如果弱引用会长期留在注册表或缓存中，这个差别值得检查。看到一块内存尚未归还，不能直接推断对象析构函数没有执行。 这项补充影响的是存储何时归还。排查时将它与对象析构、任务取消分开记录，才能判断延迟释放发生在哪一层。 ","description":"从异步悬空访问推导持有策略，细化弱引用、请求代次和取消接口。","practiceLabel":""},{"title":"C++ 容器：对象存储、地址失效与选型","url":"/notes/b772f3b2675faaf5/","section":"fundamentals","sectionTitle":"编程与系统基础","folders":["C++"],"text":" STL 容器 容器选择需要同时考虑元素的所有权、访问方式和句柄稳定性。本文比较 vector、map 与 unordered_map，并说明插入或扩容对对象地址和迭代器的影响。 先明确容器保存的是对象还是指针 Java 的 ArrayList\u003cUser 通常保存 GC 引用；C++ 容器保存模板参数指定的类型本身： 按值存储具有连续内存、缓存局部性和较少独立分配等优势，代价是扩容时需要处理拷贝、移动和地址失效。 顺序容器：内存布局、插入与地址失效 vector 按值连续保存元素 User 对象直接连续构造在 vector 的存储中。扩容时容器申请更大的连续内存，移动或复制旧元素，再释放旧内存： 发生扩容后，旧元素的指针、引用和迭代器全部失效。长期定位元素时可以保存下标并在使用时重新访问，或者根据所有权需求存储智能指针： 后者扩容时移动的是 unique_ptr ，其管理的堆对象通常保持原地址，但对象被删除或替换时，借用指针仍会悬空。 reserve(n) 可以减少达到预期规模前的扩容次数，但超过容量后仍可能扩容。 push_back 与 emplace_back push_back 接收已经构造好的元素： emplace_back 接收构造参数，在新元素位置直接构造： 它可能避免新元素临时对象的一次移动或拷贝，但并不总是更快： - 已经持有完整对象时，两者都需要拷贝或移动。 - 简单类型通常没有明显区别。 - 扩容时旧元素仍然需要搬迁。 关联容器：顺序、复杂度与哈希行为 项目 std::map std::unordered_map --- --- --- 常见实现 平衡搜索树 哈希表 查询、插入、删除 O(log n) 平均 O(1) ，最坏 O(n) 顺序 按 key 排序 无稳定顺序 范围查询 支持 不适合 map 插入通常不使已有迭代器、指针和引用失效，删除只使被删除元素相关句柄失效。 unordered_map 常使用桶数组处理哈希结果。冲突元素可能进入同一个桶的节点结构： 负载因子是： 超过阈值时，容器申请更多桶并重新分配元素，称为 rehash 。 rehash 会使迭代器失效；元素指针和引用通常仍有效。单个桶冲突严重并不等于负载因子高，也不保证自动触发 rehash 。 可以降低容量增长引发的 rehash 次数，但不能改善劣质哈希函数造成的集中冲突。 选择原则： - 需要排序遍历、范围查询或稳定最坏复杂度： map 。 - 高频单 key 查找、无顺序要求且哈希可靠： unordered_map 。 要点回顾 连续存储有利于局部性，但扩容会影响地址稳定性；树与哈希表则在排序、范围查询和复杂度上各有取舍。reserve 与 emplace_back 只能优化特定成本，不能代替对元素生命周期和访问模式的判断。 ","description":"","practiceLabel":""},{"title":"编译与链接","url":"/posts/cpp-build-and-link/","section":"fundamentals","sectionTitle":"编程与系统基础","folders":["C++"],"text":" 编译与链接 处理 C++ 构建错误时，先确定问题发生在编译还是链接阶段，再检查声明、定义和最终符号是否一致。以下围绕重复定义、缺失定义和 C/C++ 入口名称展开。 构建链路：编译、链接与加载 常规 C++ 构建流程： 编译器分别处理每个翻译单元，链接器再解析符号并组合目标文件与库。运行时加载器将可执行文件和需要的动态库映射进进程。 定义如何跨翻译单元组织 头文件中的普通函数定义会被每个包含者展开： 若多个 .cpp 包含它，链接时可能出现重复符号。这违反 One Definition Rule。 常规方案是头文件只放声明，实现放在一个 .cpp ： 或者将需要在头文件定义的函数声明为 inline ： inline 允许多个翻译单元中存在相同定义，并由工具链实现统一实体语义。它不保证编译器一定把函数调用展开。 根据错误阶段检查符号与语言链接 编译错误与链接错误 表示当前翻译单元没有看到有效声明，属于编译阶段问题。 表示编译器看到了声明，但链接器找不到匹配定义。常见原因包括： - 实现文件没有加入构建。 - 缺少需要链接的静态库或动态库。 - 声明与定义签名不一致。 - C 与 C++ 链接名称不一致。 - 符号可见性或链接顺序错误。 名称修饰与 extern \"C\" C++ 为支持重载、命名空间和成员函数，会将名称与类型信息编码进链接符号，称为 name mangling： 跨 C ABI、JNI 或 dlsym 导出稳定入口时，经常使用： 它要求使用 C 语言链接规则，避免 C++ 名称修饰。C 链接入口不能依赖参数类型重载同名函数。 要点回顾 头文件可见不等于实现已参与链接。排查时先确认翻译单元能看到声明，再确认目标文件或库提供匹配定义，最后检查语言链接与符号可见性。 ","description":"沿着源文件、目标文件到运行进程，厘清 ODR、链接错误与 C ABI 的边界。","practiceLabel":""},{"title":"mmap 原理","url":"/notes/ce6aa3943fd8ff6d/","section":"fundamentals","sectionTitle":"编程与系统基础","folders":["操作系统"],"text":" mmap 内存映射机制 mmap() 的核心不是“复制一块内存”，而是在进程虚拟地址空间中创建一段 VMA，规定这段虚拟地址背后由文件页、匿名页或共享内存对象提供物理页。 mmap() 能减少复制，是因为它可以让进程页表直接指向已经存在的文件页或共享页，而不必先把数据复制到进程私有 Buffer。 [mmap 的 VMA 与底层物理页] 地址空间与映射的基本概念 物理页 物理页是 RAM 的固定大小分块，常见大小为 4 KB。堆、栈、匿名内存和文件缓存最终占用的都是 RAM 物理页。 VMA VMA（Virtual Memory Area）属于某个进程的虚拟地址空间，描述一段连续虚拟地址的来源和权限： 调用 mmap() 时通常先创建 VMA，物理页和 PTE 可以等首次访问时再按需建立。 页表与 PTE 页表属于进程地址空间。PTE 记录某个虚拟页映射到哪个物理页，以及该页是否可读、可写、可执行、可由用户态访问。 不同进程的页表彼此独立，但内核可以让它们的 PTE 指向同一个物理页： 共享的是物理页，不是页表，也不要求两边虚拟地址相同。 Page Cache Page Cache 不是 CPU 的 L1/L2/L3 Cache，也不是一块独立硬件内存。它是 Linux 用 RAM 物理页缓存文件内容的全局机制： 同一个文件、同一个偏移通常对应同一份 Page Cache 页面。不同进程可以复用它，但进程通过 read() 得到的私有 Buffer 不是 Page Cache。 文件映射、私有映射与匿名映射 普通 read/write 与文件 mmap [普通文件 I/O 与文件 mmap] 普通 read/write 假设进程 A、B 读取同一个文件页面： Page Cache 是全局共享的，但 A、B 的用户 Buffer 属于各自进程。A 修改自己的 Buffer 不会自动修改 Page Cache；只有调用 write() 时，内核才复制指定范围： B 已经读取出来的旧 Buffer 也不会自动更新。B 再次调用 read() ，才会从当前 Page Cache 复制新内容。 文件 mmap 调用成功后，进程获得一段虚拟地址。首次访问的主线是： 文件 mmap 省掉的是 Page Cache 到进程私有 Buffer 的复制： 它不是绝对零开销：首次访问仍可能产生缺页处理、磁盘 I/O、页表建立和 TLB 开销。 以上描述针对普通 buffered I/O。 O_DIRECT 、DAX 和设备内存映射等特殊路径可能绕过普通 Page Cache，不直接套用这条主线。 MAP_SHARED 与 MAP_PRIVATE prot 决定当前进程能否读写， flags 决定写入后修改共享对象还是生成私有副本。 映射方式 读取时 写入时 是否修改文件 --- --- --- --- 文件 MAP_SHARED 映射 Page Cache 修改 Page Cache 并形成脏页 会，具体落盘时机需控制 文件 MAP_PRIVATE 可复用 Page Cache 首次写入触发 COW，生成匿名私有页 不会 匿名 MAP_PRIVATE 匿名页 修改当前进程匿名页 无文件 匿名 MAP_SHARED 共享匿名页 修改共享匿名页 无普通磁盘文件 文件 MAP_PRIVATE 的写时复制： 它在只读阶段复用文件页，只有进程需要私有修改时才付出复制成本。 匿名 mmap 不经过普通文件 Page Cache 匿名映射没有普通文件、inode 和文件 offset： 因此，申请 1 GB 匿名映射通常只是先预留 1 GB 虚拟地址范围，实际触碰哪些页，再按需为哪些页分配 RAM。 首次只读时，Linux 还可能先映射全局只读 Zero Page；真正写入时才为当前映射分配匿名物理页。 匿名页没有文件可以重新读取。内存紧张时，它必须继续留在 RAM，或者在启用 Swap 时被换出；不能像干净文件页一样直接丢弃后从原文件恢复。 匿名映射何时共享 - MAP_PRIVATE MAP_ANONYMOUS ：普通情况下属于当前地址空间； fork() 后父子初始通过 COW 共享，写入后分离。 - MAP_SHARED MAP_ANONYMOUS ：先映射再 fork() ，父子进程可以持续共享底层页面。 - 两个无关进程各自调用一次匿名 mmap() ：创建的是两个不同匿名对象，不会自动共享。 Linux 内部可能使用 shmem/tmpfs 机制管理共享匿名页，但它没有普通磁盘文件，也不走普通文件的持久化回写流程。 跨进程共享：建图、交换数据与同步协议 两个独立进程如何建立共享 mmap 两个无关进程需要先引用同一个共享内存对象，常用 memfd_create() 或 shm_open() ： fd 数字只在所属进程内有效， fdA 和 fdB 可以不同，但它们引用同一个内核对象。 物理页通常在首次访问时按需生成： 最终关系： “物理页 100”只是便于理解的示意。更严谨地说，双方引用同一个共享 backing page/folio；具体 PFN 不是用户态可依赖的稳定身份。 进程间交换数据的两种方式 [read/write 与共享 mmap 的进程间数据路径] 方式一：不 mmap，通过共享 fd 读写 memfd 等共享对象也可以像文件一样调用 read/write ： 这种方式能够交换数据，但每次传输仍需要系统调用，并可能同时存在 A 私有副本、共享对象副本和 B 私有副本。 方式二：双方 mmap 同一个共享对象 A 的 CPU Store 和 B 的 CPU Load 直接作用于同一个物理页，不再需要内核把数据从 A 复制到共享对象，再复制给 B。 “零拷贝”的边界 如果数据已经在 A 的私有堆中生成： 仍然存在一次应用层复制。只有从一开始就在共享映射区域中构造数据，才能消除 IPC Payload 的内存副本： 因此应区分： 数据产生方式 IPC 数据复制次数 --- ---: write() 共享 fd，B 再 read() 两次 A 私有对象 memcpy() 到共享 mmap，B 原地读 一次 A 直接在共享 mmap 中构造，B 原地读 零次 Payload 复制 这里的“零拷贝”只描述进程间 Payload 不再搬家，CPU 写数据、缺页、页表和缓存一致性仍然有成本。 共享内存不等于完整 IPC 协议 mmap 只解决双方访问同一物理页，不负责通知、消息边界和并发控制。实际结构通常是： 共享区可设计为： 生产者应先写 Payload，再以正确的内存顺序发布 READY；消费者确认 READY 后读取，不能把 mmap 当成自动同步机制。 两个进程的映射虚拟地址可能不同，因此共享区不能保存只对某个进程有效的裸指针。应保存相对映射起点的 offset，或使用专门的共享内存数据结构。 可见性、持久化与 Binder 的边界 可见性与持久化是两回事 文件 MAP_SHARED 的写入会修改 Page Cache 并形成脏页，其他共享映射可以观察到内存修改；但“另一个进程可见”不代表“已经写入 SSD”。 需要控制映射范围回写时使用 msync(MS_SYNC) 。如果持久化协议还涉及文件大小、其他元数据或目录项，还要按文件系统语义配合相应的 fsync/fdatasync 。突然掉电时，尚未完成持久化的脏页仍可能丢失。 memfd_create() 创建的是以易失性内存为 backing 的匿名文件对象，页面可被换入换出，但不对应持久化磁盘文件。所有引用释放后对象自动消失。 与 Binder mmap 的边界 Binder 的接收进程使用 mmap() 映射驱动管理的接收缓冲区，但发送端 Parcel 仍要通过 copy_from_user() 复制一次到目标 Binder buffer。因此 Binder 通常称为“一次拷贝”，不是两个进程共同直接读写同一 Payload 页。 详见 [Binder 跨进程通信机制]。 参考资料 - [Linux mmap(2)] - [Linux memfd_create(2)] - [Linux msync(2)] - [Linux fsync(2)] - [Linux VFS address_space] - [Linux Unix Domain Socket 与 SCM_RIGHTS] - [Linux futex(2)] - [POSIX shared memory overview] ","description":"","practiceLabel":""},{"title":"WebRTC 连接建立：SDP、ICE 与 DTLS/SRTP","url":"/notes/5974905c4606c9c3/","section":"media","sectionTitle":"音视频","folders":["WebRTC"],"text":" WebRTC 连接建立：SDP、ICE、DTLS/SRTP 本文说明媒体发送前的能力协商、路径探测和加密握手，并讨论一种云游戏接入方案。 讨论范围与建连目标 讨论范围 本文只讨论连接建立阶段：SDP、ICE、DTLS/SRTP，以及云游戏连接建立的对照。 不展开 RTP/RTCP 媒体包、拥塞控制、Pacer、JitterBuffer、NACK、FEC、DataChannel，这些不在本文范围内。 核心机制 WebRTC 连接建立解决三件事： 它的设计目标是在未知设备能力、未知 NAT 环境、未知业务信令的前提下，尽量建立一条安全、低延迟、可传 RTP/RTCP 的通路。 协议分工：协商、探路与密钥建立 SDP：谈媒体能力和传输参数 SDP 是 Session Description Protocol，可以理解成“会话说明书”。它不是发媒体包的协议，而是用来描述和协商后续媒体怎么传。 SDP 里通常会描述这些信息： - 媒体类型：音频、视频、数据通道。 - 媒体方向：sendrecv、sendonly、recvonly、inactive。 - 编解码能力：H264、VP8、VP9、AV1、Opus，以及对应的 fmtp 参数。 - RTP 扩展：例如 TWCC、abs-send-time、audio-level、video-orientation。 - ICE 参数：ice-ufrag、ice-pwd，用于后续 ICE 连通性检查认证。 - DTLS 指纹：fingerprint，用于后续 DTLS 握手时校验证书。 - BUNDLE / RTCP mux：把多路媒体复用到同一条传输连接上，减少端口和 ICE 检查成本。 Offer / Answer 的含义是：一端先提出自己能支持和想使用的能力，另一端在自己的能力范围内选择双方交集并返回结果。 这里有一个关键点：WebRTC 只定义 SDP 内容和 PeerConnection 行为，不定义信令通道本身。SDP 可以通过 WebSocket、HTTP 或业务自己的信令系统传递。 ICE：做连通性检查和路径选择 ICE 解决的是 NAT 环境下“到底哪条网络路径能通”的问题。它不是简单的 IP 优选，而是对一组候选地址做连通性检查。 常见 candidate 类型： 类型 含义 特点 --- --- --- host 本机网卡地址 同局域网可能直连，公网不可直接访问内网地址 srflx STUN 看到的公网映射地址 普通 NAT 下可能可用 relay TURN 中继地址 成功率最高，但延迟和成本最高 ICE 的基本过程： 现代 WebRTC 通常使用 Trickle ICE：SDP 先交换，candidate 边发现边通过信令发送给对端。这样不用等所有 candidate 收集完再开始检查，可以降低建连等待。 DTLS/SRTP：握手、验身份、加密媒体 ICE 选出路径后，媒体还不能明文传。WebRTC 强制加密，所以需要 DTLS/SRTP。 准确分工是： 为什么不是直接用 DTLS 加密每个 RTP 包？因为实时媒体包频率高、延迟敏感，SRTP 更贴合 RTP/RTCP 的格式和开销模型。DTLS 主要负责握手和密钥导出，媒体传输阶段由 SRTP/SRTCP 承担。 整体时序与等待成本 流程图：标准 WebRTC 与云游戏连接建立对照 图里要注意两点：第一，云游戏不是抛弃 SDP/ICE/加密，而是把它们封装进私有信令、接入调度和推拉流流程里；第二，云游戏多了一步业务前置调度，并倾向先 P2S 保底，再 P2P 升级。 标准 WebRTC 的建连耗时在哪里 低延迟场景最关心的是这条链路里产生了多少 RTT。常见耗时来自： - 业务信令往返：offer/answer、candidate 交换。 - candidate 收集：尤其需要 STUN/TURN 时。 - ICE connectivity check：candidate pair 探测需要网络往返。 - DTLS handshake：在选出的路径上再次握手。 - 首帧媒体准备：编码、打包、发送、解码、渲染。 因此 WebRTC 低延迟优化常见方向是：Trickle ICE、复用连接、BUNDLE/RTCP mux、预热 STUN/TURN、优化信令 RTT、减少首帧等待。 云游戏接入方案与适用边界 云游戏连接建立为什么要改造 云游戏和普通 WebRTC 通话不一样。普通 WebRTC 是两个对等端实时通话；云游戏更接近“客户端连接一个云端实例/媒体服务”，并且强关注首帧和操作跟手。 以下以包含业务调度、P2S 保底和 P2P 升级的云游戏接入方案为例；这不是所有云游戏平台的统一实现： 这一步不是 WebRTC 标准的一部分，而是云游戏为了资源调度和首帧路径准备引入的业务前置步骤。 云游戏与标准 WebRTC 的关键差异 环节 标准 WebRTC 云游戏低延迟连接 --- --- --- 连接对象 对等端之间协商 客户端连接云端实例/媒体接入服务，非对称 信令 WebRTC 不定义，由业务自建 私有信令/接入服务承载 room、token、startpush/startpull 等 SDP offer/answer 协商媒体能力 仍有 offer/answer，但封装进推拉流信令里 ICE 对等端 candidate pair 检查 本例先 P2S 保底，再择机 P2P 升级 DTLS/SRTP DTLS 握手导出 SRTP 密钥 仍需媒体安全，工程上可能结合预置信息减少等待 目标 通用连通性和安全实时通信 首帧快、操作低延迟、连接成功率高 这里要注意：云游戏不是完全抛弃 WebRTC 机制。它仍然可能使用 SDP、ICE、SRTP 这些基础能力，只是把业务调度、接入服务、P2S/P2P 选择、预置信息和推拉流信令做了工程化封装。 结论 这条连接建立链路可以压缩成一句话： 云游戏在这条链路上的优化目标不是改变 WebRTC 的基本物理问题，而是把“找谁连、怎么更快连上、首帧怎么更快到、后续能否升级更低延迟路径”这些业务和传输决策前置、工程化。 ","description":"","practiceLabel":""},{"title":"WebRTC 拥塞控制：从反馈到发送端闭环","url":"/notes/ac2f41a67eccb700/","section":"media","sectionTitle":"音视频","folders":["WebRTC"],"text":" WebRTC 拥塞控制：架构与发送端闭环 本文沿网络反馈、拥塞判断、带宽分配和执行层调整，说明发送端拥塞控制闭环。 发送端控制闭环总览 核心机制 拥塞控制不是一个单点模块，而是一条从“网络反馈”到“编码器执行”的控制链： 所以要严格区分： 架构层次图 [拥塞控制架构层次] 图中的横带才是架构层级，横带里的方框是该层内部的模块： - 第 1 层是 RTP 媒体传输数据面，也是被观测对象。 - 第 2 层负责测量和回传；TWCC 位于 RTCP 反馈协议族内部。 - 第 3 层负责拥塞控制和带宽估计；BWE 是职责边界，GCC 和场景化控制器是该层的具体算法实现，并不是 BWE 的下一层。 - 第 4 层把控制结果分配并调度到不同发送对象。 - 第 5 层由编码器和抗丢包模块执行最终的媒体适配。 图中只保留三类必要连线：蓝灰虚线表示网络观测向上反馈，蓝灰实线表示控制结果向上生效，米棕实线表示编码后的媒体向下进入 RTP 数据面。跨层关系沿层间空隙或左侧通道布线，层内只保留最短的数据流箭头。 观测与估计：RTCP、TWCC、BWE 与 GCC 1. RTCP 是反馈协议族 RTCP 是 RTP 的控制协议，负责回传媒体质量和网络状态。它不是一种具体拥塞控制策略，也不是 RTP 媒体数据本身。 常见 RTCP 反馈包括： 类型 主要内容 用途 --- --- --- SR / RR 收发统计、丢包、jitter、RTT 计算字段 粗粒度质量与 RTT 统计 NACK 丢失的 RTP sequence number 请求 RTX 重传 PLI / FIR 请求关键帧 解码恢复 REMB 接收端估算的最大码率 老式带宽反馈 TWCC 逐包到达状态和到达时间差 给 BWE/GCC 等算法提供高精度输入 所以 RTCP 是反馈大容器，TWCC 只是其中一种反馈类型；RTP 是被这些反馈观测的媒体数据面。 2. TWCC 是逐包到达反馈，不是算法 TWCC 的核心是：发送端给 RTP 包打一个 transport-wide sequence number，接收端记录每个包是否到达、什么时候到，再通过 RTCP Transport-CC feedback 回传。 它提供的是观测数据，例如： 发送端结合自己记录的 send time 和 packet size，可以计算： - 到达间隔变化 - acked bitrate / delivery rate - 丢包率 - RTT 变化 - queue delay 趋势 - in-flight 数据量 TWCC 只回传这些数据，不负责判断拥塞，也不直接调码率。 3. BWE 是带宽估计职责 BWE 是 Bandwidth Estimation，表示“估算当前链路还能承受多少发送带宽”这个职责或模块。 BWE 的输入可能来自： - TWCC 逐包到达反馈 - RTCP RR 的丢包、jitter、RTT 信息 - NACK / RTX 相关信号 - Pacer 队列 - 已发送速率、已确认速率、in-flight 数据量 BWE / 拥塞控制层的输出通常是： - estimated bitrate - target bitrate - pacing rate - congestion window - 带宽状态：过载、正常、欠用等 注意：BWE 不是一个具体策略名称。GCC、BBR-like 或面向特定场景的控制器都可以实现 BWE 与拥塞决策职责。因此架构关系应理解为“具体控制器位于拥塞控制 / BWE 层内部”，而不是先经过一个独立 BWE 层，再进入某个算法层。 4. GCC 是 WebRTC 的拥塞控制算法 GCC / GoogCC 是 WebRTC 常见的媒体拥塞控制算法。它通常结合 delay-based 和 loss-based 信号。 简化理解： GCC 的输出不是 QP，而是目标码率和发送节奏。QP 是编码器根据目标码率自行调整的结果。 5. 云游戏会叠加场景化控制策略 云游戏的场景化控制器和 GCC 处在同一层级，都属于发送侧拥塞控制算法或策略。区别是云游戏更强调低排队、快速降速和及时恢复，因此通常会组合观察更多实时状态： - 当前上行估计带宽 - 队列延迟、相对队列延迟 - overuse 状态 - 上行丢包、反向链路丢包 - RTT / min RTT - pacing rate / pacing gain - congestion window / target congestion window - estimate rate / target rate 这些信号并不是某一种私有算法的专属概念，而是低延迟拥塞控制常见的设计维度。具体参数需要结合网络条件、媒体负载与端到端时延目标验证。 从可用带宽到媒体与发送执行 BWA：带宽分配 拥塞控制器在 BWE 职责内估出可用总带宽，但发送端实际要发很多东西： - 媒体数据 - FEC 冗余 - RTX 重传 - padding / probe - 多路音视频流 BWA 负责回答：可用带宽怎么分给这些对象。 例如： 不同场景会有不同分配策略，例如低延迟场景更可能压低排队、减少过期重传；平滑播放场景更可能保留更大的恢复和缓冲空间。 Pacer 与 Encoder：执行控制决策 拥塞控制最终要落到两个执行点： - Pacer：控制包以什么节奏发出去，避免编码器瞬间吐包打爆网络。 - Encoder：根据目标码率调整 QP、分辨率、帧率、丢帧策略。 关键点：拥塞控制通常不直接设置 QP。 因此 QP 是编码器对目标码率的执行结果，而不是 TWCC 或拥塞控制器直接给出的网络判断。 拥塞响应与低延迟场景取舍 拥塞发生后如何调整 [拥塞调整闭环：传统 GCC 与低延迟场景化策略] 这个闭环不是“拥塞算法直接把 QP 改大”，而是网络控制和媒体执行两个阶段： CWND 控制的不是本地发送队列 CWND 是 In-flight 的准入上限： 它不直接修改路由器队列大小，也不等于本地 Pacer 队列。关系可以近似理解为： 因此，把 CWND 控制在 BD
