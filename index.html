P 附近，意味着尽量填满链路而不额外堆高瓶颈队列。如果 CWND 已满，编码器还在按旧码率产生数据，本地 Pacer 队列反而可能短时增大，所以 CWND 通常要和编码码率反压、Pacing 一起调整。 Padding 为什么要减少 Padding 是为了探测带宽或填满 Pacing 配额而发送的填充流量，不承载有效视频画面。例如： 拥塞期间继续发 Padding，相当于用探测流量继续占用已经紧张的链路。因此排空阶段会减少或停止 Padding，先把带宽留给有效媒体、音频和必要的恢复流量。 传统 GCC 与低延迟场景化策略的差异 对比维度 传统 WebRTC GCC / GoogCC 低延迟场景化策略 --- --- --- 共同基础 都依赖 RTP 发送历史和 TWCC / RTCP 反馈，都在发送侧形成闭环 同左 主要观测 到达时间趋势、丢包、acked throughput，现代 GoogCC 会融合 delay-based 与 loss / throughput-based 结果 在逐包反馈上增加 queue / relative delay、pass ratio、In-flight / CWND、近期链路容量等复合状态 拥塞判断 delay-based 识别 overuse / normal / underuse，再结合丢包和吞吐估计调整目标码率 增加包级可疑拥塞、mild / aggressive 分级降速和 Burst RTT 恢复判断 降码率 主要降低 target bitrate，带宽分配再反压到编码器 除 target rate 外，还可以通过 encoding discount 进一步降低视频媒体预算 排空手段 Pacing Rate 跟随目标码率下降；部分配置可用 CWND pushback；Probe / Padding 由探测链调度 可联动 pacing gain、In-flight drain ratio、CWND / BDP 和 Padding suppression，专门对过高 In-flight 加快排空 误判恢复 通过后续 normal / underuse 和探测逐步上调 可利用连续无拥塞、近期链路容量和 Burst RTT 分类快速恢复 这个对比的重点不是“GCC 没有 Pacer / CWND / Probe”。它们同样是 WebRTC 发送端拥塞控制链的组成部分。场景化策略的差别主要在于如何组合早期拥塞信号、编码预算、In-flight 排空和短时 Burst 恢复。具体能力仍取决于控制器实现与配置开关，不能把一种实现的行为泛化成所有 GCC 或所有云游戏会话的固定行为。 云游戏为什么更关心这条链 普通直播/RTC 里，拥塞控制主要在“画质”和“流畅”之间折中。云游戏多了“操作跟手”这个目标，因此更怕队列堆积。 云游戏里的危险情况是： 所以云游戏更关心： - queue delay 是否上升 - relative delay 是否异常 - pacer queue 是否堆积 - RTT / min RTT 是否变差 - in-flight 是否过大 - 过期帧是否还值得等重传 策略取向通常是： - 更早识别 overuse - 更快降码率 - 更严格控制 Pacer 队列 - 更低的 JitterBuffer target delay - 更短的重传价值窗口 - 必要时丢帧保实时 场景化控制器是拥塞控制实现，BWE 是职责，BWA 是带宽分配；三者不是互相替代的同类概念。云游戏还会在控制器和执行模块之上叠加参数、阈值与实时性取舍。 结论 各模块的职责关系如下： ","description":"","practiceLabel":""},{"title":"Android 容器抓屏实现","url":"/notes/38845869d7192ea0/","section":"cloud-gaming","sectionTitle":"云游戏","folders":["技术实现"],"text":" Android 容器抓屏实现 云游戏里的抓屏不是简单截图，而是把远端 Android 容器中游戏渲染出来的连续画面，稳定、低延迟地送入编码链路。它连接了 Android 图形系统、 VirtualDisplay 、 SurfaceFlinger 、OpenGL 纹理和 MediaCodec 。 [Android 容器抓屏路径对比] 问题范围与抓屏方案选择 云游戏抓屏在全链路中的位置 抓屏耗时一般包含：游戏自身渲染、VSYNC 调度、Layer 合成、画面写入抓屏目标 Surface，以及后续送编码前的格式转换或纹理搬运。 常见抓屏方案 方案 实现方式 优点 问题 适用判断 --- --- --- --- --- MediaProjection + VirtualDisplay APK 侧通过系统 API 创建 VirtualDisplay 抓取屏幕 接入成本低，系统 API 支持 会有权限提示，不适合无人值守容器 普通录屏、调试验证 JNI 创建 VirtualDisplay Native 层直接走系统录屏链路，类似 screenrecord 效率高，可绕过前台授权弹窗 依赖系统权限和容器环境 云游戏 Android 容器更常用 ScreenshotClient::capture / /dev/graphics/fb0 直接抓主屏数据，类似 screencap 实现直观 性能低，不适合高帧率实时串流 截图、低频诊断 厂商 HWC / 图形接口 从厂商提供的合成数据或硬件链路拿帧 理论链路更短 强依赖厂商实现，适配成本高 板卡、ArmServer、深度定制场景 历史源码参考： - Android screenrecord ： frameworks/av/cmds/screenrecord/ - Android screencap ： frameworks/base/cmds/screencap/ VirtualDisplay 与编码前的数据路径 VirtualDisplay 抓屏的核心链路 VirtualDisplay 的本质是给系统一个目标 Surface ，让系统把显示内容渲染到这个虚拟显示上。云游戏可以把这个目标接到后续编码或纹理处理链路。 这里的性能瓶颈通常不只在“抓屏 API”本身，而在抓到画面后怎么送编码。 送编码前的三种数据路径 编码前处理可以拆成三种路径，按“是否发生 GPU/CPU 往返、是否多一次 OpenGL 绘制”来理解。 1. OES - YUV / NV12：老方案 优点是兼容性相对好，容易做图像前处理；缺点是链路重，有纹理采样、格式转换和 CPU/GPU 数据流转。 在部分 Android 板卡上，CPU 和 GPU 共享内存，实际拷贝成本没有从架构图上看起来那么夸张，所以这个方案能长期在线上使用。但在 GPU/CPU 分离更明显的 ArmServer 或独显架构上，这条路径的带宽和拷贝成本会更敏感。 2. OES 纹理 GPU 路径：少一次 YUV 转换 这个方案减少了 OES - YUV 和 CPU 传输，主要让数据留在 GPU/图形 buffer 链路里。具体耗时收益需要在相同设备、分辨率和编码配置下对照测量。 它的限制是： SurfaceTexture 或离屏缓冲管理不好时，下游编码阻塞会反向影响上游送帧，所以需要纹理池、buffer 管理和背压策略配合。 3. 编码直通：目标最短路径 编码直通的目标是让 VirtualDisplay 或游戏画面直接进入编码器输入 Surface，减少 SurfaceTexture 绑定和 OpenGL 再绘制。理论上它是抓屏编码的最短路径。 难点在于： 1. 要在正确时机拿到或替换目标 Surface。 2. 要保证分辨率、旋转、裁剪、色彩空间等前处理能力仍然可用。 3. 要处理编码器背压，避免编码吐帧慢时阻塞游戏渲染或抓屏线程。 4. 如果通过 hook 游戏获取 Surface，需要处理不同游戏、不同系统版本、不同图形路径的兼容性。 直通编码的收益方向与工程约束 更进一步的思路是：不等游戏画面先进入普通显示合成链路，而是在游戏获取 Surface 时注入代理 Surface，动态替换为编码器输入 Surface，让游戏画面直接写入编码 Surface。 这个方向能减少 VSYNC 调度、Layer 合成、VirtualDisplay 再输出等环节，但工程风险也更高：游戏兼容、Surface 生命周期、分辨率变化、横竖屏、异常恢复都必须处理完整。 如何观测和比较抓屏链路 只看端到端操作延迟或 100ms 卡顿率，不足以判断抓屏问题。更适合把一帧拆成以下指标： 1. 游戏渲染耗时。 2. VSYNC 等待和调度耗时。 3. SurfaceFlinger / HWC 合成耗时。 4. VirtualDisplay 输出耗时。 5. OES 转 YUV 或 OpenGL 绘制耗时。 6. 送入编码器前的排队耗时。 7. 编码器输入 Surface 的阻塞时间。 当某个方案收益不明显时，要区分是“少了一次处理但增加了排队”，还是“理论链路更短但被兼容逻辑抵消”。 要点回顾 方案比较应落到格式转换、缓冲流转、排队和背压，而不是仅比较抓屏接口。减少中间环节后，仍需在相同负载下检查编码阻塞、分辨率变化和兼容性。 ","description":"","practiceLabel":""},{"title":"Android 容器触摸输入原理","url":"/notes/3e3c8cfb2580f5c8/","section":"cloud-gaming","sectionTitle":"云游戏","folders":["技术实现"],"text":" Android 容器触摸输入原理 云游戏触摸的本质是：客户端采集本地触摸事件，转换为与设备分辨率无关的输入数据，通过网络发往云端，再由云端重建触摸事件并注入 Android 输入系统。 [云游戏多指触摸链路] 链路目标与 Android 多指模型 整体链路 这条链路需要同时保证三件事： - 手指身份正确：多根手指不会在传输过程中串号。 - 坐标映射正确：本地手指位置能对应到云端画面的同一位置。 - 事件顺序正确：按下、移动、抬起不会乱序或长时间积压。 Android 的多指模型 MotionEvent 中有两个容易混淆的概念： - pointerIndex ：手指在当前事件数组中的下标，可能随事件变化。 - pointerId ：一根手指从按下到抬起期间保持稳定的身份。 ACTION_POINTER_DOWN 和 ACTION_POINTER_UP 的完整 action 不只包含动作类型，高位还编码了本次变化的 pointerIndex ： 以双指操作为例： 阶段 action 事件中的指针 --- --- --- 第一指按下 ACTION_DOWN p0 第二指按下 ACTION_POINTER_DOWN + index p0, p1 双指移动 ACTION_MOVE p0, p1 第二指抬起 ACTION_POINTER_UP + index p0, p1 最后一指抬起 ACTION_UP p0 因此，多指传输不能只传「发生变化的手指」。在移动、新增手指和抬起手指时，应把当前事件中的所有指针当作一个完整快照，并保留指针顺序。 Android 对多指数据的定义见 [MotionEvent API]。 输入消息设计与云端状态重建 多指事件如何传输 一个触摸消息应表示一个完整的多指事件，基本信息包括： 其中： - pointerId 用于跨事件追踪同一根手指。 - actionIndex 表示本次哪一根手指按下或抬起。 - points[] 保存当前时刻的完整指针快照。 - eventTime 用于还原事件的发生时间，而不是到达云端的时间。 - gestureSequence 用于识别重复、乱序或跨连接的旧事件。 按下、新增手指、抬起、取消等事件会改变触摸状态，必须保证到达和顺序。移动事件更关心「最新位置」，在网络积压时可以合并过时的中间点，避免云端追赶已经失去意义的轨迹。 云端如何重建事件 云端需要维护一个按手势划分的触摸状态机： 1. 第一根手指按下时创建手势，记录统一的 downTime 。 2. 每次按收到的顺序重建指针属性和坐标数组。 3. 新增或抬起手指时，保留完整 actionIndex 语义。 4. 手指抬起事件注入完成后，才从活跃指针集合中删除该手指。 5. 所有手指抬起后结束手势；取消、断线或状态异常时清空整个手势。 重建后的事件交给 Android 系统输入注入接口，再按正常输入链路分发给目标窗口。这类系统级注入需要容器或系统进程具备相应权限，普通应用无法任意向其他应用注入事件。 坐标、时间与感知精度 1. 坐标系精度 客户端与云端分辨率通常不同，因此应传输画面内的归一化坐标： 这里的 content 必须是实际视频画面矩形，而不是外层容器的尺寸： - 等比适配产生黑边时，需要先扣除画面偏移。 - 等比填充产生裁剪时，需要恢复被裁剪区域对应的坐标。 - 画面发生旋转时，需要对触摸坐标执行显示变换的逆变换。 多数「画面显示正常但点击偏移」问题，本质上是画面坐标系和触摸坐标系没有使用同一组变换参数。 2. 数值精度 坐标应在归一化和网络传输阶段保留浮点值，到云端恢复逻辑像素时再根据目标分辨率转换。过早转为整数会引入量化误差，在高分辨率画面上更明显。 坐标越界检查应在完成黑边、裁剪和旋转变换之后进行。如果过早将坐标截断到 [0, 1] ，可能会隐藏坐标系错误。 3. 时间与采样精度 云游戏的触摸准确性不只是最终坐标是否正确，还包括轨迹是否平滑、事件是否及时： - 传输 eventTime ，区分事件发生时间和网络到达时间。 - 对绘画、摇杆等场景，保留必要的历史采样点。 - 对已积压的移动事件，可以丢弃过时中间点，但不能丢失会改变手势状态的按下、抬起和取消事件。 - 断线或长时间无后续事件时，云端应主动取消手势，避免出现「手指一直按住」的状态残留。 4. 降低本地触摸采集延迟 Android 默认可以将连续的 MOVE 事件暂存起来，在下一次 VSYNC 的输入阶段批量交给应用。云游戏收到触摸回调后还要把事件发送到云端，这段等待会直接增加端到端操作延迟。 云游戏画面 View 可以在手势开始时调用 [ requestUnbufferedDispatch(event) ])： 请求由 View 发起，实际由该 Window 的 ViewRootImpl 调整输入接收策略。它不会绕过 InputChannel 和 View 事件分发，只是不再让当前触摸流的后续移动事件继续等待 VSYNC 合批；手势在 UP 或 CANCEL 后结束。其他 Window、Activity 或进程的输入链路不受影响。 这项优化最多可以减少接近一个刷新周期的本地等待，主要收益发生在连续 MOVE 。代价是触摸回调、线程唤醒和发送次数可能增加，因此需要同时观察： - MotionEvent.eventTime 到事件发送的延迟。 - 每秒触摸回调数和网络消息数。 - 主线程 CPU、掉帧和功耗。 它只优化「本地触摸进入发送链路」这一段，不能消除网络、云端处理、编码和画面显示延迟。 延伸思考：用短期预测隐藏移动事件丢包 连续 MOVE 发生短暂丢包或重传等待时，可以根据最近的真实采样点预测一个很短时间后的坐标，临时填补输入空档；下一条真实事件到达后立即丢弃预测结果并校正状态。也可以由发送端在消息中携带短期预测点，接收端仅在检测到序号缺口或事件超时后使用。 这属于丢包隐藏，不是恢复真实轨迹。预测只适用于短时间、方向稳定的连续移动，不能用于 DOWN 、 UP 、 CANCEL 和多指状态变化；超过预测窗口或置信度下降时应停止外推。可靠有序传输仍需负责关键动作和状态一致性，预测只能遮盖等待重传期间的操作停顿。 预测坐标一旦作为普通 MotionEvent 注入云端就无法回滚，因此更适合摇杆、视角滑动等可连续修正的场景。它应作为实验方案，重点验证丢包条件下的跟手性收益、预测误差和误操作率。 5. 感知精度 用户是根据客户端正在显示的视频帧进行点击，但该帧在云端已经是过去状态。因此，即使坐标转换完全准确，视频编码、网络、解码和渲染延迟仍可能让用户感觉「点击跟手性差」。 所以触摸精度应拆成两个指标： - 坐标误差：触摸位置与云端注入位置之间的偏差。 - 触摸到画面反馈延迟：从本地触摸到包含处理结果的新视频帧显示出来的时间。 结论 云游戏多指的核心不是「同时发送多个坐标」，而是在客户端和云端之间维持同一个多指状态机。 完整设计需要同时保证： pointerId 稳定、指针快照完整、关键动作有序、画面与触摸共用同一套坐标变换，以及移动事件在轨迹保真和低延迟之间取得平衡。 ","description":"","practiceLabel":""},{"title":"Android 云游戏免安装启动机制","url":"/notes/95623197f800b091/","section":"cloud-gaming","sectionTitle":"云游戏","folders":["技术实现"],"text":" Android 云游戏免安装启动机制 云游戏里的“免安装”通常不是绕过 Android 的包管理和进程模型，而是把游戏文件集中存储，在游戏启动前动态映射到云端 Android 实例，并复用或快速补齐 PMS 所需的包状态。用户不需要在本地下载安装，云端实例也不需要长期保存所有游戏。 这套能力可以先概括为： 相关 Android 基础见 [PackageManagerService 包扫描与安装流程]。 免安装启动的目标与分层 传统安装和云游戏启动的区别 传统安装一般包含： 云游戏要避免的是每个实例都重复下载和复制整个游戏： 因此，“免安装”更准确的含义是： 游戏安装文件集中保存，实例启动时通过文件系统挂载快速获得可访问的游戏目录，并复用或快速建立 Android 包状态，从而省略重复的完整下载、复制和编译过程。 整体分层 各层职责不同： 层 主要职责 --- --- PMS 保存包、组件、签名、uid、权限和 codePath 等结构化信息 VFS 向上提供统一文件接口，向下路由到具体文件系统 NFS 将 NFS 服务器目录挂载为本地目录 FUSE 由用户态程序实现一个可挂载的虚拟文件系统 OverlayFS 将共享只读层和当前实例可写层合并为一个目录 启动脚本/守护进程 负责停止进程、挂载、权限处理、包状态处理和启动游戏 文件系统如何提供游戏视图 VFS：为什么游戏不需要适配存储方案 VFS 全称是 Virtual File System，是 Linux 内核提供的统一文件系统抽象。游戏、PMS 和 ART 只调用普通文件接口： VFS 根据挂载表把请求交给 ext4、NFS、FUSE 或 OverlayFS。游戏访问： 底层可能经过： 或者： 只要挂载到游戏原本使用的路径，并完整支持 read 、 mmap 、随机读取等语义，游戏侧通常不需要修改代码。 NFS：把远端目录映射到本地 NFS 是标准网络文件系统协议。服务端集中保存游戏，例如： 宿主机或有挂载权限的容器管理服务执行： 挂载完成后： 实际对应 NFS 服务器上的： mount 不会默认把完整游戏复制到容器。第一次读取且缓存未命中时，才发生远端 I/O： 再次读取相同数据时可能直接命中 Page Cache，不再访问网络。热门游戏还可能通过节点本地 SSD 缓存和启动预热进一步降低首启延迟。 FUSE：由用户态程序提供游戏文件 FUSE 全称是 Filesystem in Userspace。它不是一种固定的远端存储协议，而是让用户态程序实现文件系统的机制。 使用上同样先得到一个挂载目录： 游戏读取文件时： FUSE 服务可以按文件块实现平台自己的策略： - 先拉取 Manifest、dex/oat、启动 so 和首屏资源。 - 其余地图、纹理和音频按访问顺序拉取。 - 通过内容哈希去重多个游戏版本中的相同数据块。 - 对数据进行解压、解密和完整性校验。 - 使用内存、SSD 和远端存储组成多级缓存。 - 根据容量和热度淘汰本地数据。 传统 FUSE 请求需要在内核和用户态守护进程之间切换，通常比内核 NFS 路径多一层开销；优势是能实现更细的游戏资源调度、预取和缓存策略。 NFS 与 FUSE 对比 维度 NFS FUSE --- --- --- 本质 标准网络文件系统协议 用户态文件系统框架 数据来源 NFS Server 可由平台自行定义 访问实现 主要由内核 NFS 客户端完成 由 FUSE 用户态服务处理 接入成本 较低，方案成熟 较高，需要开发文件系统服务 定制能力 相对有限 可实现分块、预取、去重、解密等策略 传统路径开销 内核路径相对直接 多一层内核与用户态交互 游戏侧改动 通常不需要 文件语义完整时通常不需要 NFS 和 FUSE 都是访问驱动：PMS、ART、linker 或游戏第一次访问某段数据且缓存未命中时，才触发实际远端读取。但内核 read-ahead、FUSE 主动预取或平台预热可能提前读取后续数据。 OverlayFS：共享游戏层和实例写入层 OverlayFS 将多个目录合并成一个视图： 示例： 再将合并目录映射到 PMS 记录的固定路径： OverlayFS 的查找规则是： 读取 lowerdir 文件时不会自动复制完整文件；第一次修改 lowerdir 文件时才执行 Copy-up，将文件复制到 upperdir 后再修改。删除 lowerdir 文件时，upperdir 使用 whiteout 标记在 merged 视图中隐藏它。 对于 /data/app 中通常保持只读的 APK、split 和 so，upperdir 可以是一次性的。游戏结束后先卸载 merged，再删除 upperdir 和 workdir： 玩家存档不能默认跟这个临时层一起删除。需要持久化的数据应独立保存： OverlayFS 能否直接使用某个 NFS/FUSE 挂载作为 lowerdir，取决于内核版本、文件系统能力和厂商实现，实际平台可能修改内核或由自定义文件系统直接实现合并和 Copy-on-Write。 包管理状态与启动流程的配合 PMS 在动态覆盖中的边界 已知场景是 Android 系统已经运行，游戏启动前脚本动态覆盖 App 目录。此时必须区分两种情况。 1. PMS 已经认识这个包 PMS 内存中已经有： 脚本把真实游戏文件挂载到同一个 codePath ： 路径没有变化，变化的只是该路径背后的文件系统。此时脚本可能不需要触发 PMS 扫描，完成挂载后直接启动游戏。 覆盖内容仍应保持包名、签名、组件、split 结构和 native library 路径兼容。如果 Manifest 已变化但 PMS 没有重新扫描，就会出现 PMS 内存状态与磁盘 APK 不一致的问题。 2. PMS 原本不认识这个包 仅把一个全新 APK 挂到 /data/app ，不足以保证当前 PMS 自动建立组件索引。启动脚本还必须走以下某一种路径： - 通过 pm install 或 cmd package install 进入标准安装入口。 - 对 PMS 已全局认识但当前用户未启用的包执行 install-existing 。 - 调用厂商新增的 PackageManager Binder/Shell 接口，对指定挂载目录热扫描。 - 在旧版本系统中制造目录文件事件，由 AppDirObserver 触发 scanPackageLI() 。 - 挂载完成后重启 Framework/system_server，使 PMS 重新初始化。 install-existing 只能为用户启用一个 PMS 已知包，不能把未知 APK 注册成新包。 am start 也不会负责扫描 APK；它只能使用 PMS 已有的 ActivityInfo 解析并启动组件。 旧版 AOSP 的目录监听入口可参考： - [ AppDirObserver 与 scanPackageLI ] - [ PackageManagerShellCommand ] 目前没有启动脚本和对应 Android 版本，不能确定实际平台属于“预注册后只覆盖文件”还是“挂载后调用私有热扫描”。 启动脚本可能执行的流程 下面是概念流程，不代表具体平台命令： 先停止旧进程非常重要。已经打开的文件描述符仍然指向旧 inode；动态挂载只会影响后续路径查找和新打开的文件。重新启动进程后，ART、linker 和游戏引擎才会从新的 merged 视图打开 APK、dex、so 和资源。 实际链路验证与结论 怎么验证实际平台走的路线 在执行启动脚本前后分别检查： 判断方式： 脚本中重点查找： 还应观察系统日志中的 PackageManager 、 PackageInstallerSession 、 installd 和 ActivityTaskManager ，确认是否发生了包扫描、安装提交或仅有 Activity 启动。 关键结论 1. NFS 是把远端游戏目录映射为本地目录；读取时由内核 NFS 客户端访问服务器。 2. FUSE 是由用户态服务提供虚拟目录，可以自行实现分块拉取、预取、去重、解密和缓存。 3. NFS 和 FUSE 默认都按访问触发远端 I/O，Page Cache、read-ahead 和平台预热会改变实际读取时机。 4. VFS 屏蔽了底层文件系统差异，所以游戏侧通常不需要改造。 5. OverlayFS 将远端只读游戏层和实例可写层合并；临时 upperdir 可以在游戏退出后删除。 6. /data/app 程序层可以临时挂载，玩家存档和账号数据应独立持久化。 7. PMS 已经注册包时，保持相同 codePath 可以只动态覆盖文件；PMS 未注册时，脚本必须额外触发安装、启用或平台定制的热扫描。 8. 最终实现应以实际启动脚本、Android 版本、PMS 改动和挂载表为准。 ","description":"","practiceLabel":""},{"title":"算法练习","url":"/notes/93a9a083af32c3d2/","section":"algorithms","sectionTitle":"算法练习","folders":[],"text":" 算法练习 算法练习按题目清单、建模笔记和代码实现组织，以 C++ 为主，线程协作示例使用 Java。尚未完成的代码保留为练习模板。 按内容类型进入练习 - [高频算法题清单（通用 / 字节风格）]：通用高频题集合。 - [小红书高频算法题清单]：小红书/内容社区类岗位优先复习题集合。 - [智力题]：面试常见逻辑题、称重题、编码题和最坏情况题。 - LeetCode：按题目保存的练习代码，可从算法分类页浏览。 - [滑动窗口]：常见窗口形式与配套实现。 - [有界阻塞队列]与[顺序打印 ABC]：线程协作练习。 本地代码组织约定 1. 先用 LeetCode 插件生成题目文件。 2. 在题目文件里完成代码，并优先使用 LeetCode/leetcode.h 解决本地 IntelliSense 所需的常用类型和头文件。 3. 做完一类题后，只沉淀必要模板，不提前铺满目录。 ","description":"按主题组织题目、阅读顺序与练习入口。","practiceLabel":"练习导航"},{"title":"高频算法题清单（通用 / 字节风格）","url":"/notes/a78e4d2bbe575447/","section":"algorithms","sectionTitle":"算法练习","folders":[],"text":" 高频算法题清单（通用 / 字节风格） 这份清单用于集中记录通用/字节风格的高频面试题。当前主语言按 C++ 练习。小红书/内容社区类岗位的优先清单单独见：[小红书高频算法题清单]。 题目按主要建模方式分组，适合在完成单题后横向比较同类问题。题号用于检索原题，不表示本文已提供完整题解。 线性结构与区间问题 链表 - LC206 反转链表 - LC25 K 个一组翻转链表 - LC19 删除链表的倒数第 N 个结点 - LC23 合并 K 个升序链表 - LC21 合并两个有序链表 - LC146 LRU 缓存 数组 / 双指针 / 滑动窗口 - LC3 无重复字符的最长子串 - LC15 三数之和 - LC42 接雨水 - LC88 合并两个有序数组 - LC53 最大子数组和 区间 / 矩阵 - LC56 合并区间 - LC54 螺旋矩阵 查找、树与图 二分 / 排序 - LC215 数组中的第 K 个最大元素 - LC33 搜索旋转排序数组 - LC34 在排序数组中查找元素的第一个和最后一个位置 - LC912 排序数组 二叉树 / BFS / DFS - LC200 岛屿数量 - LC236 二叉树的最近公共祖先 - LC102 二叉树的层序遍历 - LC103 二叉树的锯齿形层序遍历 - LC199 二叉树的右视图 状态递推与搜索 动态规划 - LC300 最长递增子序列 - LC121 买卖股票的最佳时机 - LC122 买卖股票的最佳时机 II - LC72 编辑距离 - LC1143 最长公共子序列 - LC5 最长回文子串 回溯 - LC46 全排列 栈 - LC20 有效的括号 ","description":"按主题组织题目、阅读顺序与练习入口。","practiceLabel":"练习导航"},{"title":"小红书高频算法题清单","url":"/notes/f745b2389e7d23e7/","section":"algorithms","sectionTitle":"算法练习","folders":[],"text":" 小红书高频算法题清单 优先练习题目 - LC146 LRU 缓存：哈希表 + 双向链表，考察缓存淘汰策略和 O(1) 数据结构设计。 - LC215 数组中的第 K 个最大元素：TopK，小根堆或快速选择。 - LC3 无重复字符的最长子串：滑动窗口，字符串去重。 - LC15 三数之和：排序 + 双指针 + 去重。 - LC42 接雨水：双指针 / DP / 单调栈。 - LC206 反转链表：链表基础指针操作。 - LC25 K 个一组翻转链表：链表分组反转，边界和递归/迭代指针处理。 - LC23 合并 K 个升序链表：小根堆或分治。 - LC53 最大子数组和：Kadane / 动态规划。 - LC121 买卖股票的最佳时机：一次交易，历史最低价或股票状态机。 - LC122 买卖股票的最佳时机 II：多次交易，贪心或股票状态机。 - LC300 最长递增子序列：DP + 二分牌堆模型。 按题型补充训练 树 / 图 / BFS DFS - LC200 岛屿数量：网格 DFS/BFS + visited。 - LC994 腐烂的橘子：多源 BFS，按层计时。 - LC236 二叉树的最近公共祖先：二叉树递归返回值。 - LC102 二叉树的层序遍历：BFS 层序模板。 - LC103 二叉树的锯齿形层序遍历：层序遍历 + 隔层反转。 - LC199 二叉树的右视图：层序遍历取每层最后一个，或右优先 DFS。 链表补充 - LC21 合并两个有序链表：双指针合并。 - LC19 删除链表的倒数第 N 个结点：快慢指针 + dummy。 - LC142 环形链表 II：快慢指针找环入口。 数组 / 字符串补充 - LC88 合并两个有序数组：从后往前双指针。 - LC56 合并区间：排序 + 合并重叠区间。 - LC54 螺旋矩阵：四边界收缩。 - LC5 最长回文子串：中心扩展。 DP / 回溯补充 - LC72 编辑距离：二维 DP，插入/删除/替换。 - LC1143 最长公共子序列：二维 DP。 - LC46 全排列：回溯，路径 + used。 建议练习顺序 1. LRU、TopK、滑动窗口、三数之和、接雨水。 2. 链表三件套：反转链表、K 个一组、合并 K 个链表。 3. BFS/DFS：岛屿数量、腐烂橘子、层序遍历变种。 4. DP：最大子数组和、股票、LIS、编辑距离、LCS。 ","description":"按主题组织题目、阅读顺序与练习入口。","practiceLabel":"练习导航"},{"title":"生产者消费者：手写阻塞队列","url":"/notes/b7d3ba686668f584/","section":"algorithms","sectionTitle":"算法练习","folders":["业务场景题"],"text":" 生产者消费者：手写阻塞队列 题目要求与接口约束 实现一个有界阻塞队列 SimpleBlockingQueue\u003cT ，支持： 要求： - 队列满时，生产者调用 put() 阻塞等待。 - 队列空时，消费者调用 take() 阻塞等待。 - 多个生产者、多个消费者同时访问时不能破坏队列状态。 - 不能使用 BlockingQueue 直接完成核心逻辑。 - 正确处理中断。 共享状态、等待条件与唤醒 共享资源是内部队列，必须被同一把锁保护。 需要维护的不变量是： 生产者逻辑： 消费者逻辑： 注意： wait() 必须放在 while 中。线程被唤醒后，只能说明“队列状态可能变化了”，不能保证当前线程需要的条件已经满足。 配套代码与检查要点 对应 Java 文件： - [ProducerConsumerPractice.java] 配套文件已有实现，阅读与复查重点如下： 1. put() 中队列满时等待。 2. take() 中队列空时等待。 3. 入队和出队后通知其他等待线程。 4. 确认 main() 能正常结束。 ","description":"记录题目约束、建模思路与推导。","practiceLabel":"算法笔记"},{"title":"三线程顺序打印 ABC","url":"/notes/f5aa5a3d68dc1a13/","section":"algorithms","sectionTitle":"算法练习","folders":["业务场景题"],"text":" 三线程顺序打印 ABC 题目要求与退出条件 有三个线程： - 线程 A 只打印 A - 线程 B 只打印 B - 线程 C 只打印 C 要求最终输出： 总共循环 5 次。 要求： - 不能使用 Thread.sleep() 控制顺序。 - 可以使用 Semaphore 、 synchronized + wait/notifyAll 或 ReentrantLock + Condition 。 - 程序最终正常退出。 用信号量传递执行权 这题最适合先用 Semaphore 做，因为它天然表达“执行权传递”： 初始状态： 也就是 A 先执行，B 和 C 一开始阻塞。 配套代码与检查要点 对应 Java 文件： - [ABCPrinterPractice.java] 配套文件已有实现，阅读与复查重点如下： 1. 初始化三个 Semaphore 。 2. 在 printA/printB/printC 中等待自己的许可。 3. 打印后释放下一个线程的许可。 4. 确认输出顺序稳定为 ABCABCABCABCABC 。 ","description":"记录题目约束、建模思路与推导。","practiceLabel":"算法笔记"},{"title":"总览","url":"/notes/ba2d85f388e95f73/","section":"algorithms","sectionTitle":"算法练习","folders":["智力题"],"text":" 面试智力题 阅读目标与练习方式 怎么使用 1. 先看[高频智力题清单]，了解常见题型。 2. 再看[思维模型]，把题目归类成状态空间、编码、最坏情况、递推等模型。 3. 每道题先独立想，再看题解。看题解时重点关注“为什么这样建模”，不要只记最终数字。 练习约定 1. 一次只练一道题，先说自己的建模和直觉。 2. 复盘时优先回答三个问题：题目要找什么、总共有多少种可能、一次操作能区分多少种结果。 3. 对没理解的题，先保留“模型解释”，不要急着补完整公式。 题目入口 - [12 球称重]：状态空间、三叉决策树、候选状态。 - [毒药小白鼠]：二进制编码、唯一死亡组合。 - [鸡蛋掉落]：最坏情况、递减跳跃、覆盖能力递推。 ","description":"按主题组织题目、阅读顺序与练习入口。","practiceLabel":"练习导航"},{"title":"高频智力题清单","url":"/notes/434b50db1b597ad4/","section":"algorithms","sectionTitle":"算法练习","folders":["智力题"],"text":" 高频智力题清单 这份清单用于记录面试中常见的智力题。优先按题型整理，后续练到具体题目时再补详细题解。 信息量与构造问题 称重与信息量 - 12 个球中 1 个重量异常，可能偏重也可能偏轻，最少称几次能找出异常球并判断轻重？ - 9 个球中 1 个偏重，最少称几次能找出？ - 1000 瓶药水中 1 瓶有毒，24 小时后发作，最少需要多少只小白鼠？ 计时与构造 - 两根不均匀绳子，每根从一端点燃正好 1 小时，如何计时 45 分钟？ - 7 分钟和 11 分钟沙漏，如何量出 15 分钟？ 概率、逻辑与博弈 概率与期望 - 三门问题：主持人打开一扇空门后，是否应该换门？ - 抛硬币直到连续出现两个正面，期望次数是多少？ - 两个人轮流抛硬币，谁先抛到正面谁赢，先手胜率是多少？ 逻辑推理 - 三个盒子分别贴“苹果”“橘子”“苹果和橘子”，标签全错，只摸一次如何判断？ - 100 个囚犯和灯泡，如何确认所有囚犯都进过房间？ - 黑白帽子问题：只能看到别人帽子，如何推断自己的帽子颜色？ 博弈与策略 - 两人轮流拿石子，每次拿 1 到 3 个，拿到最后一个的人赢，如何保证胜利？ - 100 个硬币排成一排，两人轮流从两端拿，如何保证自己不输？ - 海盗分金币问题，如何提出能通过且收益最大的分配方案？ 最坏情况与估算 最坏情况与递推 - 两个鸡蛋、100 层楼，最坏最少扔几次能找出最高安全楼层？ - 三个鸡蛋、100 层楼，最坏最少扔几次？ 估算类 - 北京有多少辆出租车？ - 一架飞机里能装多少个乒乓球？ - 一个城市一天消耗多少杯咖啡？ ","description":"按主题组织题目、阅读顺序与练习入口。","practiceLabel":"练习导航"},{"title":"思维模型","url":"/notes/b00124b11552e20b/","section":"algorithms","sectionTitle":"算法练习","folders":["智力题"],"text":" 智力题思维模型 智力题不要先背结论，先把题目翻译成模型。常见入口是：答案空间有多大、一次操作有几种反馈、最坏情况下要保证什么。 先定义答案空间与反馈能力 先问题目到底要找什么 很多题的难点不是计算，而是读懂“最终答案”的形式。 例如 12 球称重不是只找“哪个球异常”，还要判断“偏重还是偏轻”。所以最终答案不是 12 种，而是： 1重、1轻、2重、2轻、...、12重、12轻 一共 12 × 2 = 24 种候选答案。 状态空间：数清所有候选答案 如果题目保证“有且只有 1 个异常”，状态数通常是： 可疑对象数量 × 每个对象的异常方向数 例子： - 12 个球，异常球可能偏重或偏轻：12 × 2 = 24。 - 1000 瓶药水，只有 1 瓶有毒：1000。 - 如果允许“全都正常”，再额外加 1 个“全正常”状态。 一次操作能区分多少种结果 一次操作能产生几种反馈，就对应几叉决策。 - 天平一次称重：左重、右重、平衡，共 3 种结果。 - 小白鼠一次实验：死、活，共 2 种结果。 - 鸡蛋掉落一次：碎、没碎，共 2 种结果，但后续资源会变化。 如果每次操作都是独立的固定结果容量，可以先用信息量估下界： 结果数^操作次数 = 候选答案数 一次实验中的编码模型 毒药小白鼠题的本质是编码。 10 只小白鼠最终有 2^10 = 1024 种死活组合。提前给每瓶药水绑定一个唯一的小白鼠组合；哪几只小白鼠死了，就反推出对应的那瓶药。 这个模型成立的关键约束是：题目保证只有 1 瓶有毒。无毒药水虽然也被喝了很多，但不会影响死亡结果。 资源会变化时的预算与递推 最坏情况模型：让每条坏路径都不超预算 鸡蛋掉落题不是一次性编码，因为每次扔完之后鸡蛋数量可能变化。它更适合反过来想： 最多允许尝试 x 次时，能够确定的楼层范围有多大？ 两个鸡蛋时，第一次最多跳 x 层；如果没碎，第二次最多再跳 x-1 层；继续递减。 所以最多覆盖： x + (x-1) + ... + 1 = x(x+1)/2 要覆盖 100 层，就找最小的 x 使： x(x+1)/2 = 100 递推模型：碎和不碎分别处理 鸡蛋数量变多时，用覆盖能力递推更清楚。 定义： F(k, x) = k 个鸡蛋、最多扔 x 次，最多能确定多少层 第一次扔后： - 碎了：少一个鸡蛋，少一次机会，楼下最多覆盖 F(k-1, x-1)。 - 没碎：鸡蛋不变，少一次机会，楼上最多覆盖 F(k, x-1)。 - 当前这一层被确定：+1。 所以： F(k, x) = F(k-1, x-1) + 1 + F(k, x-1) ","description":"记录题目约束、建模思路与推导。","practiceLabel":"算法笔记"},{"title":"12 球称重","url":"/notes/d5e1d5a9d69eaefc/","section":"algorithms","sectionTitle":"算法练习","folders":["智力题"],"text":" 12 球称重 本文目前完成候选状态建模和第一次称重分析，尚未展开三轮称重的完整构造。信息量下界只是必要条件，不能单独代替可行方案的证明。 问题约束与候选状态 题目 有 12 个外观完全一样的球，其中 1 个球重量异常，可能比其他球重，也可能比其他球轻。 有一架天平，每次称重只能得到三种结果：左边重、右边重、平衡。 问：最少称几次，才能一定找出异常球，并判断它偏重还是偏轻？ 题目到底要找什么 最终答案不是“哪个球异常”这么简单，而是： 哪个球异常 + 它偏重还是偏轻 所以候选答案是： 1重、1轻、2重、2轻、...、12重、12轻 一共： 12 × 2 = 24 种候选状态 “正常”不用额外乘进去，因为题目保证有且只有 1 个异常球。只要确定了异常球和方向，其他 11 个球自动都是正常的。 第一次称重如何划分状态 一次称重不是把球分成三组，而是把“候选状态”分成三组： 左边重 右边重 平衡 例如第一次称： 1 2 3 4 vs 5 6 7 8 如果左边重，可能状态是： 1重、2重、3重、4重、5轻、6轻、7轻、8轻 如果右边重，可能状态是： 5重、6重、7重、8重、1轻、2轻、3轻、4轻 如果平衡，可能状态是： 9重、9轻、10重、10轻、11重、11轻、12重、12轻 所以这一称把 24 种候选状态切成了 8 / 8 / 8。 信息量下界与当前推导边界 最少次数 每次称重有 3 种结果，称 k 次最多产生 3^k 条结果路径。 题目有 24 种候选状态，所以需要： 3^k = 24 因为： 3^2 = 9，不够 3^3 = 27，够 所以理论下界是 3 次。并且这道题确实能构造出 3 次称完的方案，因此最少是 3 次。 记忆点 这题不是在问“12 个球怎么分三组”，而是在问： 24 个候选状态，如何通过每次只有 3 种反馈的称重一步步排除？ 一次称重就是一个三选一测试；三次称重最多给出 27 种结果路径。 ","description":"解释候选状态与信息量下界；完整三轮称重构造仍待补充。","practiceLabel":"算法笔记"},{"title":"毒药小白鼠","url":"/notes/68e6dc07320087af/","section":"algorithms","sectionTitle":"算法练习","folders":["智力题"],"text":" 毒药小白鼠 题目约束 有 1000 瓶药水，其中只有 1 瓶有毒。毒药喝下去后，会在 24 小时后死亡。 现在只有 24 小时，也就是只能观察一轮死亡结果。 问：最少需要多少只小白鼠，才能一定找出哪一瓶有毒？ 从状态数推导实验规模 候选答案 题目保证只有 1 瓶有毒，所以候选答案是： 第1瓶有毒、第2瓶有毒、...、第1000瓶有毒 一共 1000 种可能。 一只小白鼠提供什么信息 24 小时后，每只小白鼠只有两种状态： 死 / 活 所以 k 只小白鼠能形成： 2^k 种死亡组合 要区分 1000 瓶，需要： 2^k = 1000 因为： 2^9 = 512，不够 2^10 = 1024，够 所以最少需要 10 只小白鼠。 用唯一编码构造实验方案 为什么交叉喝不会乱 核心不是“每只鼠只喝一瓶”，而是： 每瓶药水提前绑定一个唯一的小白鼠组合。 比如小白鼠有 A、B、C。某瓶药绑定的组合是 A、C，就让 A 和 C 都喝一点这瓶药。 如果这瓶药有毒，最后死亡名单就是： A、C 因为题目保证只有 1 瓶有毒，所以无毒药水虽然也被喝了很多，但不会影响死亡结果。最后死掉的小白鼠组合，正好就是毒药瓶绑定的组合。 二进制只是编码工具 二进制的每一位对应一只小白鼠： 1 = 这只小白鼠喝这瓶 0 = 这只小白鼠不喝这瓶 最后： 死 = 1 活 = 0 死亡结果本身就是毒药瓶的编号。 所以更本质的说法是： 10 只小白鼠有 1024 种死亡组合，给 1000 瓶药水分配 1000 个唯一组合，最后用实际死亡组合反查毒药瓶。 ","description":"记录题目约束、建模思路与推导。","practiceLabel":"算法笔记"},{"title":"鸡蛋掉落：为什么下一次要少跳一层","url":"/notes/3d83d5df9cb9a3c8/","section":"algorithms","sectionTitle":"算法练习","folders":["智力题"],"text":" 鸡蛋掉落：为什么下一次要少跳一层 本文讨论怎样在最坏情况下，用尽量少的投掷确定最高安全楼层，并将手工策略推广为可实现的递推。 两个鸡蛋、100 层楼的最少次数是 14。 第一枚鸡蛋从 14 层开始，之后分别增加 13、12、11 层；每次没碎，下一次就少跨一层，把剩余机会留给碎蛋后的线性检查。推广到更多鸡蛋时，用“给定次数能覆盖多少层”作为状态。 下面从每隔 10 层试一次的方案出发，找出它最坏需要 19 次的原因，再推导递减间隔、次数下界与代码实现。 背景：确定最高安全楼层 设最高安全楼层为 F，F 可以取 0 到 100：在 F 层及以下扔不会碎，从 F+1 层开始会碎。F=0 表示一楼也不安全，F=100 表示整栋楼都安全。两个鸡蛋性质相同，没碎可以继续用，碎了不能再用。 目标是无论 F 取多少，都能在尽量少的尝试内确定它。 问题：固定间隔让最坏情况越来越差 如果按下面的顺序扔第一个鸡蛋： 它在 100 层才碎时，已经用了 10 次。此时只知道 90 层安全、100 层不安全，还要用剩下的鸡蛋依次试 91 到 99 层。最坏再用 9 次，总计 19 次。 早碎和晚碎的代价并不一样：在 10 层碎掉，最多总共用 10 次；在 100 层碎掉，却可能用 19 次。固定间隔没有考虑前面已经花掉的尝试次数。 为什么不能直接改成二分 为什么第二个鸡蛋不能继续二分？ 假设还需要区分 91 到 99 层，却直接从 95 层开始。若鸡蛋碎了，之后没有鸡蛋可用，无法判断最高安全楼层究竟是 90、91，还是 94。 只剩一个鸡蛋时，每次都要从最低尚未确定的楼层开始。碎掉就得到答案，没碎再向上一层。 这决定了第一个鸡蛋最多能跳多远：一旦碎掉，留下的区间必须能用剩余次数逐层查完。 方案比较：把剩余次数分配给每个区间 在两个鸡蛋、100 层的约束下，可以先比较几种搜索方式： 做法 优点 代价与限制 --- --- --- 从一楼逐层检查 一枚鸡蛋即可完成，过程简单 最坏需要 100 次 每隔 10 层试一次，碎后逐层检查 容易构造，明显少于逐层检查 最坏需要 19 次，前后区间的预算不均衡 每次取剩余区间中点 鸡蛋足够时可以快速缩小范围 两枚鸡蛋无法保证走完所有分支，不能直接采用 随剩余次数递减间隔 平衡每次碎蛋后的总成本 需要先求次数预算；更多鸡蛋时还需推广状态 选择递减间隔的原因，是它能够让晚碎时更少的剩余次数，对应更小的待查区间。接下来需要证明：每一步究竟能跨多远，以及这个策略是否已经最优。 递减间隔怎样从预算中推导出来 假设希望最多用 x 次完成。 第一下从第 k 层扔。如果碎了，已经用掉 1 次，下面还有 k-1 层需要逐层检查。因此必须满足： 所以第一下最多试到第 x 层。 如果没碎，已经消耗一次机会，剩下 x-1 次。下一次最多向上跨 x-1 层：若这次碎了，就要用剩余的 x-2 次检查中间楼层。 继续推下去，跳跃间隔依次是： 每多扔一次，剩余次数就少一次；为了在下一次碎掉时仍能查完，中间可留下的楼层也要少一层。递减间隔由这个约束直接得到。 [前四次分别试 14、27、39、50 层，剩余逐层检查预算依次减少] 证明 14 次的下界并构造投掷方案 预算为 x 次时，两个鸡蛋最多覆盖： 这个式子既给出上限，也能构造策略。每一跳都不能超过当前剩余预算，所以最多只能覆盖这些楼层；按上述间隔跳，又确实能在每一种碎蛋情况下用剩余次数完成检查。 代入 100 层： 因此 13 次无法保证完成，14 次可以。 第一下从 14 层开始，之后依次增加 13、12、11 层，接近楼顶时截到 100 层： 可以拿几种情况检查预算： 第一个鸡蛋的情况 已用次数 第二个鸡蛋最多还需检查 总次数上限 --- ---: --- ---: 14 层碎 1 1～13 层，共 13 次 14 27 层碎 2 15～26 层，共 12 次 14 39 层碎 3 28～38 层，共 11 次 14 100 层碎 12 99 层已知安全，无需再试 12 到 100 层都没碎 12 已知 F=100 12 最后两种情况少于 14 次，是因为楼只有 100 层，用不完 105 层的覆盖能力。最坏情况下仍然需要 14 次，例如 F=12 或 F=13。 实现：用覆盖楼层数统一处理多个鸡蛋 从手工策略转为覆盖状态 两个鸡蛋时，第一次碎掉以后只剩线性检查，因此能手算出递减间隔。增加到三个鸡蛋，碎掉以后还有两个鸡蛋，下半段也可以跳跃；继续手工枚举每次跳多少层，分支很快就多起来。 一种直接的状态是“k 个鸡蛋、n 层楼，最少试几次”。但这样写递推，需要枚举第一下扔在哪层，再取碎和不碎两种情况中较坏的一边。前面的预算推导给出了更方便的方向：固定可用次数，计算最多能覆盖多少层。这样只需合并碎与不碎两个子问题，不再逐层枚举第一次的位置。 定义： 第一次选定一个楼层后，会有两种结果： - 碎了：下面的区间交给 k-1 个鸡蛋和 m-1 次机会。 - 没碎：上面的区间交给 k 个鸡蛋和 m-1 次机会。 再加上当前试的这一层： 这里统计的是楼层数；n 层楼有 n+1 种可能的最高安全楼层，包括 F=0。不要把两种数量混在一起。 当 k=1 时，递推得到 cover(1, m)=m ，对应逐层检查。当 k=2 时，每增加一次机会，多覆盖 m 层，累计起来就是前面的三角形数。 对于 3 个鸡蛋： 所以 100 层最少需要 9 次。 压缩状态并实现 C++ 递推 递推式可以先写成二维表：行表示尝试次数，列表示鸡蛋数。当前行只依赖上一行，因此可以压缩成一个数组，并逐轮增加尝试次数，直到覆盖目标楼层。 covered[k] 保存 k 个鸡蛋当前能够覆盖的楼层数。每轮开始时，它们属于上一轮；从大到小更新，可以让两个输入都仍然是旧值。 以两个鸡蛋为例： 完成的尝试轮数 covered[1] covered[2] --- ---: ---: 0 0 0 1 1 1 2 2 3 3 3 6 第一轮计算 covered[2] 时，应得到 0 + 1 + 0 = 1 。若从小到大，先把 covered[1] 改成 1，再计算下一项就得到 2，相当于宣称一次投掷可以区分两层楼，这已经与题意冲突。 内层从大到小更新，是为了让 covered[eggs-1] 仍然表示上一轮的结果。若从小到大更新，同一轮的新值会被再次使用，相当于重复花了尚不存在的机会。 数组中的值达到目标楼层数后就可以截断，后续不需要知道它究竟能覆盖多少层。这里输入楼层数是 int ，中间求和使用 long long ，同时对覆盖值做上限截断。 设最终需要 m 次尝试，k 为限制后的鸡蛋数，时间复杂度为 O(km)，额外空间为 O(k)。这段函数只计算最少次数；如果需要实际的投掷方案，还需要根据覆盖状态选择每次测试的楼层。 实现效果：最坏 14 次与独立算法核对 先遍历两鸡蛋、100 层的所有临界点 F=0～100，模拟前面的投掷楼层及碎蛋后的逐层检查：应当都能找到答案，最多 14 次。再对小规模输入，用“枚举第一次投掷楼层”的独立递推计算最优值，与覆盖状态算法逐项比较，避免两个实现重复同一个错误。 本地验证覆盖 1～8 个鸡蛋、0～200 层，共 1,608 组输入，结果一致；上述 101 个临界点的模拟也均通过。另检查零层、没有鸡蛋但楼层非零、负数输入及大整数中间求和。它们验证的是这段次数计算和给出的两鸡蛋策略。 固定间隔的最坏情况是 19 次，递减间隔的 101 个临界点模拟最多使用 14 次；与此同时，13 次最多覆盖 91 层的下界证明排除了更小的答案。 因此，开头的 14 次既有能够完成的策略，也有不能更少的证明。 关键变化是让区间大小随剩余预算一起缩小。将这个关系写成覆盖状态后，同一套推导又支持了多个鸡蛋的实现，并通过小规模独立递推的逐项核对。 ","description":"从固定间隔的最坏情况出发，推导递减策略、覆盖状态与一维实现。","practiceLabel":"算法笔记"},{"title":"滑动窗口","url":"/notes/dbda860183531936/","section":"algorithms","sectionTitle":"算法练习","folders":["题型模板"],"text":" 滑动窗口 滑动窗口模板需要能直接跑起来。当前题型模板以这份 C++ 文件为准： - [滑动窗口.cpp] 适用条件与不适用边界 - 题目要求连续子数组或连续子串。 - 需要求最长、最短、固定长度匹配，或满足条件的区间数量。 - 窗口状态可以增量维护，例如字符频次、窗口和、不同字符数量。 如果是求和问题且数组里可能有负数，普通滑动窗口通常不适合，优先考虑前缀和。 窗口类型与统一维护方式 三种常见形态 形态 记忆方式 代表题 --- --- --- 固定长度窗口 右边进，超长左边出，等长检查 438. 找到字符串中所有字母异位词 可变长度，求最长 非法就缩，合法更新最长 3. 无重复字符的最长子串 可变长度，求最短 满足就缩，边缩边更新最短 209. 长度最小的子数组 统一写法 优先使用 left / right 双指针表达窗口，不用一开始就记 i - len 这类公式。 - right：当前刚进入窗口的右边界。 - left：当前窗口的左边界，也是命中答案时要记录的起点。 - right - left + 1：当前窗口长度。 固定长度窗口也按这三步写： win[s[right] - 'a']++; while (right - left + 1 len) { win[s[left] - 'a']--; ++left; } if (right - left + 1 == len \u0026\u0026 win == need) { ans.push_back(left); } 配套实现与运行入口 以下命令适用于提供 clang++ 的类 Unix Shell，在仓库根目录执行： clang++ -std=c++17 算法练习/题型模板/滑动窗口.cpp -o /tmp/sliding_window_template \u0026\u0026 /tmp/sliding_window_template 期望输出： 438 输出: [0, 6]，期望: [0, 6] 3 输出: 3，期望: 3 209 输出: 2，期望: 2 ","description":"记录题目约束、建模思路与推导。","practiceLabel":"算法笔记"},{"title":"滑动窗口","url":"/notes/77bdd4ba7661b40b/","section":"algorithms","sectionTitle":"算法练习","folders":["题型模板"],"text":" include \u003calgorithm include \u003cclimits include \u003ciostream include \u003cstring include \u003cvector using namespace std; class SlidingWindowTemplate { public: // 固定长度窗口：438. 找到字符串中所有字母异位词 vector\u003cint findAnagrams(string s, string p) { vector\u003cint ans; if (s.size() \u003c p.size()) { return ans; } vector\u003cint need(26, 0); vector\u003cint window(26, 0); for (char c : p) { need[c - 'a']++; } // left / right 始终表示当前窗口的左右边界。 // 固定窗口也优先用这套写法，不用额外记 i - len 公式。 int left = 0; int k = static_cast\u003cint (p.size()); for (int right = 0; right \u003c static_cast\u003cint (s.size()); ++right) { window[s[right] - 'a']++; while (right - left + 1 k) { window[s[left] - 'a']--; ++left; } if (right - left + 1 == k \u0026\u0026 window == need) { ans.push_back(left); } } return ans; } // 可变长度窗口，求最长：3. 无重复字符的最长子串 int lengthOfLongestSubstring(string s) { vector\u003cint count(128, 0); int left = 0; int ans = 0; for (int right = 0; right \u003c static_cast\u003cint (s.size()); ++right) { count[s[right]]++; while (count[s[right]] 1) { count[s[left]]--; ++left; } ans = max(ans, right - left + 1); } return ans; } // 可变长度窗口，求最短：209. 长度最小的子数组 int minSubArrayLen(int target, vector\u003cint \u0026 nums) { int left = 0; int sum = 0; int ans = INT_MAX; for (int right = 0; right \u003c static_cast\u003cint (nums.size()); ++right) { sum += nums[right]; while (sum = target) { ans = min(ans, right - left + 1); sum -= nums[left]; ++left; } } return ans == INT_MAX ? 0 : ans; } }; static void printVector(const vector\u003cint \u0026 nums) { cout \u003c\u003c \"[\"; for (int i = 0; i \u003c static_cast\u003cint (nums.size()); ++i) { if (i 0) { cout \u003c\u003c \", \"; } cout \u003c\u003c nums[i]; } cout \u003c\u003c \"]\"; } int main() { SlidingWindowTemplate solution; vector\u003cint anagrams = solution.findAnagrams(\"cbaebabacd\", \"abc\"); cout \u003c\u003c \"438 输出: \"; printVector(anagrams); cout \u003c\u003c \"，期望: [0, 6]\" \u003c\u003c endl; cout \u003c\u003c \"3 输出: \" \u003c\u003c solution.lengthOfLongestSubstring(\"abcabcbb\") \u003c\u003c \"，期望: 3\" \u003c\u003c endl; vector\u003cint nums = {2, 3, 1, 2, 4, 3}; cout \u003c\u003c \"209 输出: \" \u003c\u003c solution.minSubArrayLen(7, nums) \u003c\u003c \"，期望: 2\" \u003c\u003c endl; return 0; } ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"三线程顺序打印 ABC：Java 练习代码","url":"/notes/74b42a59c64f565b/","section":"algorithms","sectionTitle":"算法练习","folders":["业务场景题"],"text":"import java.util.concurrent.Semaphore; / 三线程顺序打印 ABC。 目标输出：ABCABCABCABCABC / public class ABCPrinterPractice { private static final int LOOP_COUNT = 5; private static final Semaphore semaphoreA = new Semaphore(1); private static final Semaphore semaphoreB = new Semaphore(0); private static final Semaphore semaphoreC = new Semaphore(0); private static void print(char ch, Semaphore cur, Semaphore next) throws InterruptedException { for (int i = 0; i \u003c LOOP_COUNT; i++) { cur.acquire(); System.out.print(ch); next.release(); } } public static void main(String[] args) throws InterruptedException { Thread threadA = new Thread(() - { try { print('A', semaphoreA, semaphoreB); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } }, \"A\"); Thread threadB = new Thread(() - { try { print('B', semaphoreB, semaphoreC); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } }, \"B\"); Thread threadC = new Thread(() - { try { print('C', semaphoreC, semaphoreA); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } }, \"C\"); threadA.start(); threadB.start(); threadC.start(); threadA.join(); threadB.join(); threadC.join(); System.out.println(); System.out.println(\"done\"); } } ","description":"通过三个信号量传递打印许可，形成 A → B → C 的顺序。","practiceLabel":"练习代码"},{"title":"有界阻塞队列：Java 练习代码","url":"/notes/7ed17beca686c3ea/","section":"algorithms","sectionTitle":"算法练习","folders":["业务场景题"],"text":"import java.util.ArrayDeque; import java.util.Queue; / 生产者消费者练习：手写一个有界阻塞队列。 / public class ProducerConsumerPractice { static class BlockingQueue\u003cT { private final int capacity = 10; private final Object lock = new Object(); private final Queue\u003cT queue = new ArrayDeque\u003c (); void put(T value) throws InterruptedException { synchronized (lock) { while (queue.size() = capacity) { lock.wait(); } queue.add(value); lock.notifyAll(); } } T take() throws InterruptedException { synchronized (lock) { while (queue.isEmpty()) { lock.wait(); } T value = queue.poll(); lock.notifyAll(); return value; } } int size() { synchronized (lock) { return queue.size(); } } } public static void main(String[] args) throws InterruptedException { BlockingQueue\u003cInteger queue = new BlockingQueue\u003c (); Thread producer = new Thread(() - { Integer i = 0; try { queue.put(i++); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } }, \"producer\"); Thread consumer = new Thread(() - { try { queue.take(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } }, \"consumer\"); producer.start(); consumer.start(); producer.join(); consumer.join(); } } ","description":"使用同一把锁与条件等待协调有界队列的生产和消费。","practiceLabel":"练习代码"},{"title":"1.两数之和","url":"/notes/2d30c32c4a0e89a0/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=1 lang=cpp [1] 两数之和 / // @lc code=start include \u003cvector include \u003cunordered_map using namespace std; class Solution { public: std::vector\u003cint twoSum(std::vector\u003cint \u0026nums, int target) { unordered_map\u003cint, int map; for (int i = 0; i \u003c nums.size(); i++) { int cur = nums[i]; int diff = target - cur; if (map.count(diff)) { return {map[diff], i}; } map[cur] = i; } return {}; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"2.两数相加","url":"/notes/57a5a57f907a0ec4/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=2 lang=cpp [2] 两数相加 / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / using namespace std; class Solution { public: ListNode addTwoNumbers(ListNode l1, ListNode l2) { ListNode dump = ListNode(); ListNode ptr = \u0026dump; int dist = 0; while (l1 l2 dist) { int num1 = l1 ? l1- val : 0; int num2 = l2 ? l2- val : 0; int sum = num1 + num2 + dist; dist = sum / 10; ptr- next = new ListNode(sum % 10); ptr = ptr- next; l1 = l1 ? l1- next : l1; l2 = l2 ? l2- next : l2; } return dump.next; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"3.无重复字符的最长子串","url":"/notes/3f08bcae660db563/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=3 lang=cpp [3] 无重复字符的最长子串 / include \"leetcode.h\" // @lc code=start class Solution { public: int lengthOfLongestSubstring(string s) { unordered_map\u003cchar, int map; int l = 0; int r = 0; int rs = 0; while (r \u003c s.size()) { char ch = s[r]; map[ch] ++; while(map[ch] 1 \u0026\u0026 l \u003c r) { map[s[l]] --; l++; } rs = max(rs, r - l + 1); r ++; } return rs; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"11.盛最多水的容器","url":"/notes/b16ca27a01318d4b/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=11 lang=cpp [11] 盛最多水的容器 / include \"leetcode.h\" // @lc code=start class Solution { public: int maxArea(vector\u003cint \u0026 height) { int left = 0; int right = height.size() - 1; int maxArea = 0; while(right left) { int areaHeight = min(height[left], height[right]); maxArea = max(maxArea, areaHeight (right - left)); if(height[left] height[right]) { right--; } else { left++; } } return maxArea; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"15.三数之和","url":"/notes/3d08d25f75c18331/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=15 lang=cpp [15] 三数之和 / include \"leetcode.h\" // @lc code=start class Solution { public: vector\u003cvector\u003cint threeSum(vector\u003cint \u0026nums) { vector\u003cvector\u003cint rs; int n = nums.size(); if (n \u003c 3) { return rs; } sort(nums.begin(), nums.end()); for (int i = 0; i \u003c n - 2; i ++) { if (nums[i] 0) { break; } int l = i + 1; int r = n - 1; if (i 0 \u0026\u0026 nums[i] == nums[i - 1]) { continue; } while (r l) { int sum = nums[i] + nums[l] + nums[r]; if(sum == 0) { rs.push_back({nums[i], nums[l], nums[r]}); while (l \u003c r \u0026\u0026 nums[l] == nums[l + 1]) { l++; } while (l \u003c r \u0026\u0026 nums[r] == nums[r - 1]) { r--; } l++; r--; } else if (sum \u003c 0) { l++; } else { r--; } } } return rs; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"19.删除链表的倒数第-n-个结点","url":"/notes/8b208b6f30563fb4/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=19 lang=cpp [19] 删除链表的倒数第 N 个结点 / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: ListNode removeNthFromEnd(ListNode head, int n) { ListNode dumy = new ListNode(); dumy- next = head; ListNode pre = dumy; ListNode cur = head; while (n 0) { if (cur == nullptr) return head; cur = cur- next; n--; } // 只需判断 cur != nullptr while (cur != nullptr) { pre = pre- next; cur = cur- next; } // 此时 pre 是待删除节点的前驱 pre- next = pre- next- next; return dumy- next; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"21.合并两个有序链表","url":"/notes/437bc90908824ab8/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=21 lang=cpp [21] 合并两个有序链表 / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: ListNode mergeTwoLists(ListNode l1, ListNode l2) { if (!l1) { return l2; } if (!l2) { return l1; } ListNode \u0026 cur = (l1- val l2- val) ? l2 : l1; ListNode head = cur; cur = cur- next; head- next = mergeTwoLists(l1, l2); return head; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"23.合并-k-个升序链表","url":"/notes/83f209ba4fcd4b26/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=23 lang=cpp [23] 合并 K 个升序链表 / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: ListNode merge2List(ListNode l1, ListNode l2) { if (!l1) { return l2; } if (!l2) { return l1; } ListNode \u0026 cur = (l1- val l2- val) ? l2 : l1; ListNode head = cur; cur = cur- next; head- next = merge2List(l1, l2); return head; } ListNode mergeKList(vector\u003cListNode \u0026 lists, int start, int end) { if (end \u003c start) { return nullptr; } if (end == start) { return lists[start]; } int mid = (start + end) / 2; ListNode left = mergeKList(lists, start, mid); ListNode right = mergeKList(lists, mid + 1, end); return merge2List(left, right); } ListNode mergeKLists(vector\u003cListNode \u0026 lists) { return mergeKList(lists, 0, lists.size() - 1);; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"25.K-个一组翻转链表","url":"/notes/9aa34711df2551a5/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=25 lang=cpp [25] K 个一组翻转链表 / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: // 反转 [a, b) ListNode reverseList(ListNode start, ListNode end) { if(start == nullptr) { return start; } ListNode cur = start; ListNode pre = nullptr; while(cur != end) { ListNode next_node = cur- next; cur- next = pre; pre = cur; cur = next_node; } return pre; } ListNode reverseKGroup(ListNode head, int k) { if(head == nullptr) { return head; } ListNode start = head; ListNode next_start = head; for (int i = k; i 0; --i) { if(next_start == nullptr) { return start; } next_start = next_start- next; } ListNode new_start = reverseList(start, next_start); start- next = reverseKGroup(next_start, k); return new_start; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"33.搜索旋转排序数组","url":"/notes/d67130692b90b8f7/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=33 lang=cpp [33] 搜索旋转排序数组 / include \"leetcode.h\" // @lc code=start class Solution { public: int searchDps(vector\u003cint \u0026 nums, int target, int l, int r) { if(l r) { return -1; } int mid = l + (r - l) / 2; if (nums[mid] == target) { return mid; } if(nums[mid] = nums[l]) { // 左边有序 if(nums[mid] target \u0026\u0026 target = nums[l]) { return searchDps(nums, target, l, mid - 1); } else { return searchDps(nums, target, mid + 1, r); } } else { // 右边有序 if(nums[mid] \u003c target \u0026\u0026 target \u003c= nums[r]) { return searchDps(nums, target, mid + 1, r); } else { return searchDps(nums, target, l, mid - 1); } } } int search(vector\u003cint \u0026 nums, int target) { return searchDps(nums, target, 0, nums.size() - 1); } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"34.在排序数组中查找元素的第一个和最后一个位置","url":"/notes/9d1a99705c93d424/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=34 lang=cpp [34] 在排序数组中查找元素的第一个和最后一个位置 / include \"leetcode.h\" // @lc code=start class Solution { public: vector\u003cint searchRange(vector\u003cint \u0026nums, int target) { return {lowerBound(nums, target), upperBound(nums, target)}; } int lowerBound(vector\u003cint \u0026nums, int target) { int l = 0, r = nums.size() - 1, rs = -1, m; while (r = l) { m = l + (r - l) / 2; if (nums[m] \u003c target) { l = m + 1; } else if (nums[m] target) { r = m - 1; } else { rs = m; r = m - 1; } } return rs; } int upperBound(vector\u003cint \u0026nums, int target) { int l = 0, r = nums.size() - 1, rs = -1, m; while (r = l) { m = l + (r - l) / 2; if (nums[m] target) { r = m - 1; } else if (nums[m] \u003c target) { l = m + 1; } else { rs = m; l = m + 1; } } return rs; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"42.接雨水","url":"/notes/b112df5a6fc5781c/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=42 lang=cpp [42] 接雨水 / include \"leetcode.h\" // @lc code=start class Solution { public: int trap(vector\u003cint \u0026height) { int ans = 0; int leftMax = 0; int rightMax = 0; int left = 0; int right = height.size() - 1; while (right left) { if(height[left] \u003c height[right]) { leftMax = max(height[left], leftMax); ans += leftMax - height[left]; left ++; } else { rightMax = max(height[right], rightMax); ans += rightMax - height[right]; right --; } } return ans; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"49.字母异位词分组","url":"/notes/ecc2a5f653ffa5fa/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=49 lang=cpp [49] 字母异位词分组 / include \"leetcode.h\" // @lc code=start class Solution { public: vector\u003cvector\u003cstring groupAnagrams(vector\u003cstring \u0026 strs) { unordered_map\u003cstring, vector\u003cstring map; for (const string\u0026 str: strs) { string sorted_str = str; sort(sorted_str.begin(), sorted_str.end()); map[sorted_str].push_back(str); } vector\u003cvector\u003cstring ans; for (const pair\u003cstring, vector\u003cstring \u0026 group : map) { ans.push_back(group.second); } return ans; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"53.最大子数组和","url":"/notes/39c18d0756052355/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=53 lang=cpp [53] 最大子数组和 / include \"leetcode.h\" // @lc code=start class Solution { public: int maxSubArray(vector\u003cint \u0026 nums) { if(nums.empty()) { return 0; } int max_sum = nums[0]; int ans = max_sum; for (int i = 1; i \u003c nums.size(); i++) { max_sum = max(nums[i], max_sum + nums[i]); ans = max(max_sum, ans); } return ans; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"56.合并区间","url":"/notes/e59ded4d7dea5ec5/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=56 lang=cpp [56] 合并区间 / include \"leetcode.h\" // @lc code=start class Solution { public: vector\u003cvector\u003cint merge(vector\u003cvector\u003cint \u0026intervals) { if(!intervals.size()) { return {{}}; } vector\u003cvector\u003cint rs; sort(intervals.begin(), intervals.end()); for (int i = 0; i \u003c intervals.size(); i++) { int l = intervals[i][0]; int r = intervals[i][1]; if(!rs.size() rs.back()[1] \u003c l) { rs.push_back(intervals[i]); } else { rs.back()[1] = max(rs.back()[1], r); } } return rs; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"72.编辑距离","url":"/notes/18406501b8d5cc47/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=72 lang=cpp [72] 编辑距离 / include \"leetcode.h\" // @lc code=start class Solution { public: int minDistance(string word1, string word2) { int m = word1.size() + 1; int n = word2.size() + 1; vector\u003cvector\u003cint dp(m, vector\u003cint (n, 0)); for (int i = 0; i \u003c m; i++) { dp[i][0] = i; } for (int j = 0; j \u003c n; j++) { dp[0][j] = j; } for (int i = 1; i \u003c m; i++) { for (int j = 1; j \u003c n; j++) { if (word1[i - 1] == word2[j - 1]) { dp[i][j] = dp[i - 1][j - 1]; } else { dp[i][j] = min({dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]}) + 1; } } } return dp[m - 1][n - 1]; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"82.删除排序链表中的重复元素-ii","url":"/notes/07d983c7275b5666/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=82 lang=cpp [82] 删除排序链表中的重复元素 II / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: ListNode deleteDuplicates(ListNode head) { if(head == nullptr head- next == nullptr) { return head; } if (head- val == head- next- val) { while (head- next != nullptr \u0026\u0026 head- val == head- next- val) { head = head- next; } return deleteDuplicates(head- next); } head- next = deleteDuplicates(head- next); return head; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"83.删除排序链表中的重复元素","url":"/notes/0ad3d0db8dd86ec0/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=83 lang=cpp [83] 删除排序链表中的重复元素 / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: ListNode deleteDuplicates(ListNode head) { if (head == nullptr head- next == nullptr) { return head; } ListNode childHead = deleteDuplicates(head- next); if (childHead- val == head- val) { head- next = childHead- next; } return head; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"92.反转链表 II","url":"/notes/1c62040a09bc4c3a/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=92 lang=cpp [92] 反转链表 II / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: ListNode reverseBetween(ListNode head, int left, int right) { if(head == nullptr left == right) { return head; } ListNode dump(0); dump.next = head; // pre_node为反转 left 位置的前一个 ListNode pre_node = \u0026dump; for(int i = 1; i \u003c left \u0026\u0026 pre_node != nullptr; i++) { pre_node = pre_node - next; } // 说明链表没这么长 if (pre_node == nullptr pre_node- next == nullptr) { return head; } // 反转后这个就是尾部的node ListNode tail_node = pre_node- next; // 现在开始找righ位置后的下一个的node ListNode right_pre_node = tail_node; for(int i = left; i \u003c right \u0026\u0026 right_pre_node != nullptr; i++) { right_pre_node = right_pre_node - next; } // 说明rignt没这么长 if (right_pre_node == nullptr) { return head; } ListNode right_node = right_pre_node- next; right_pre_node- next = nullptr; // 反转 ListNode reverse_list_head = reverseList(tail_node); pre_node- next = reverse_list_head; tail_node- next = right_node; return dump.next; } ListNode reverseList(ListNode head) { ListNode pre = nullptr; while(head != nullptr) { ListNode next = head- next; head- next = pre; pre = head; head = next; } return pre; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"93.复原 IP 地址","url":"/notes/cdb661dcf6e9acbe/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=93 lang=cpp [93] 复原 IP 地址 / include \"leetcode.h\"; // @lc code=start class Solution { public: // 回溯 + 剪枝 vector\u003cstring rs; vector\u003cstring restoreIpAddresses(string s) { vector\u003cstring path; dbs(s, 0, path); return rs; } / s字符串，从start开始，对应拼出的path IP / void dbs(string s, int start, vector\u003cstring \u0026 path) { if (path.size() == 4) { if(start == s.length()) { rs.push_back( path[0] + \".\" + path[1] + \".\" + path[2] + \".\" + path[3] ); } return; } if (start s.length()) { return; } for(int i = 1; i \u003c= 3 \u0026\u0026 start + i \u003c= s.length(); i ++) { int index = start + i; string child = s.substr(start, i); if((i 1 \u0026\u0026 s[start] == '0') stoi(child) 255) { break; } path.push_back(child); dbs(s, index, path); path.pop_back(); } } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"121.买卖股票的最佳时机","url":"/notes/2616f4bde8260e5d/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=121 lang=cpp [121] 买卖股票的最佳时机 / include \"leetcode.h\" // @lc code=start class Solution { public: int maxProfit(vector\u003cint \u0026 prices) { if(prices.empty()) { return 0; } int min_price = prices[0]; int ans = 0; for (int i = 1; i \u003c prices.size(); i++) { ans = max(ans, prices[i] - min_price); min_price = min(min_price, prices[i]); } return ans; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"122.买卖股票的最佳时机-II","url":"/notes/3db84bfe65ff3824/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=122 lang=cpp [122] 买卖股票的最佳时机 II / include \"leetcode.h\" // @lc code=start class Solution { public: int maxProfit(vector\u003cint \u0026 prices) { if(prices.empty()) { return 0; } vector\u003cvector\u003cint dp(prices.size(), vector\u003cint (2, 0)); dp[0][0] = 0; dp[0][1] = -prices[0]; for (int i = 1; i \u003c prices.size(); i++) { // 当天没有持有股票 dp[i][0] = max(dp[i - 1][0], dp[i - 1][1] + prices[i]); // 当天持有股票 dp[i][1] = max(dp[i - 1][1], dp[i - 1][0] - prices[i]); } return dp[prices.size() - 1][0]; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"128.最长连续序列","url":"/notes/5e5910321065c5f2/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=128 lang=cpp [128] 最长连续序列 / include \"leetcode.h\" // @lc code=start class Solution { public: int longestConsecutive(vector\u003cint \u0026 nums) { unordered_set\u003cint num_set(nums.begin(), nums.end()); int ans = 0; for(int num : num_set) { int len = 1; if(num_set.count(num - 1) == 0) { while (num_set.count(num + len) != 0) { len++; } } ans = max(len, ans); } return ans; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"142.环形链表-ii","url":"/notes/50db8c67d7d6c96b/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=142 lang=cpp [142] 环形链表 II / include \"leetcode.h\" // @lc code=start class Solution { public: ListNode detectCycle(ListNode head) { if (head == nullptr head- next == nullptr) { return nullptr; } ListNode slow = head; ListNode fast = head; while (fast != nullptr \u0026\u0026 fast- next!= nullptr) { slow = slow- next; fast = fast- next- next; if (slow == fast) { break; } } if (fast == nullptr fast- next == nullptr) { return nullptr; } slow = head; while (slow != fast) { slow = slow- next; fast = fast- next; } return slow; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"143.重排链表","url":"/notes/a745b24e46f7e8e2/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=143 lang=cpp [143] 重排链表 / include \"leetcode.h\" // @lc code=start class Solution { public: void reorderList(ListNode head) { if(head == nullptr head- next == nullptr) { return; } ListNode fast = head; ListNode slow = head; // 找到中间节点 while(fast- next != nullptr \u0026\u0026 fast- next- next != nullptr) { slow = slow- next; fast = fast- next- next; } // 拆分后半部分，反转它 ListNode half_node = slow- next; slow- next = nullptr; ListNode previous = revertNode(half_node); ListNode first = head; ListNode second = previous; // 交替拆分 while(second != nullptr) { ListNode firstNext = first- next; ListNode secondNext = second- next; first- next = second; second- next = firstNext; first = firstNext; second = secondNext; } } ListNode revertNode(ListNode head) { if(head == nullptr head- next == nullptr) { return head; } ListNode child_node = revertNode(head- next); head- next- next = head; head- next = nullptr; return child_node; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"146.lru-缓存","url":"/notes/50be710fff45d868/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=146 lang=cpp [146] LRU 缓存 / include \"leetcode.h\" // @lc code=start class LRUCache { public: size_t capacity_; list\u003cpair\u003cint, int nodes_; unordered_map\u003cint, list\u003cpair\u003cint, int ::iterator key_to_nodes_; LRUCache(int capacity) : capacity_(capacity) { } int get(int key) { auto cache_value = key_to_nodes_.find(key); if (cache_value != key_to_nodes_.end()) { nodes_.splice(nodes_.begin(), nodes_, cache_value- second); return cache_value- second- second; } return -1; } void put(int key, int value) { auto cache_value = key_to_nodes_.find(key); if (cache_value != key_to_nodes_.end()) { cache_value- second- second = value; nodes_.splice(nodes_.begin(), nodes_, cache_value- second); return; } if (key_to_nodes_.size() = capacity_) { int remove_key = nodes_.back().first; nodes_.pop_back(); key_to_nodes_.erase(remove_key); } nodes_.push_front({key, value}); key_to_nodes_[key] = nodes_.begin(); } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"199.二叉树的右视图","url":"/notes/98723cd4305832f1/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=199 lang=cpp [199] 二叉树的右视图 / include \"leetcode.h\" // @lc code=start / Definition for a binary tree node. struct TreeNode { int val; TreeNode left; TreeNode right; TreeNode() : val(0), left(nullptr), right(nullptr) {} TreeNode(int x) : val(x), left(nullptr), right(nullptr) {} TreeNode(int x, TreeNode left, TreeNode right) : val(x), left(left), right(right) {} }; / class Solution { public: vector\u003cint rightSideView(TreeNode root) { queue\u003cTreeNode queue; vector\u003cint ans; if(root == nullptr) { return ans; } queue.push(root); while(!queue.empty()) { int size = queue.size(); for (size_t i = 0; i \u003c size; i++) { TreeNode node = queue.front(); queue.pop(); if(i == size - 1) { ans.push_back(node- val); } if(node- left != nullptr) { queue.push(node- left); } if(node- right != nullptr) { queue.push(node- right); } } } return ans; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"206.反转链表","url":"/notes/8953c9820b15afeb/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=206 lang=cpp [206] 反转链表 / include \"leetcode.h\" // @lc code=start / Definition for singly-linked list. struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; / class Solution { public: ListNode reverseList(ListNode head) { if(!head !head- next) { return head; } ListNode childListHead = reverseList(head- next); head- next- next = head; head- next = nullptr; return childListHead; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"209.长度最小的子数组","url":"/notes/e436ea8876352dc3/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=209 lang=cpp [209] 长度最小的子数组 / include \"leetcode.h\" // @lc code=start class Solution { public: int minSubArrayLen(int target, vector\u003cint \u0026 nums) { } }; // @lc code=end ","description":"待完成练习：核心函数尚未实现。","practiceLabel":"待完成模板"},{"title":"215.数组中的第K个最大元素","url":"/notes/8fa679c5f37a53c9/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=215 lang=cpp [215] 数组中的第K个最大元素 / include \"leetcode.h\" // @lc code=start class Solution { public: int findKthLargest(vector\u003cint \u0026 nums, int k) { } }; // @lc code=end ","description":"待完成练习：核心函数尚未实现。","practiceLabel":"待完成模板"},{"title":"227.基本计算器-ii","url":"/notes/2475489ce09d9280/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=227 lang=cpp [227] 基本计算器 II / include \"leetcode.h\" // @lc code=start class Solution { public: int calculate(string s) { stack\u003cint stk; int num = 0; char op = '+'; for (int i = 0; i \u003c s.size(); i++) { char ch = s[i]; bool isDigit = isdigit(ch); if (isDigit) { num = num 10 + (ch - '0'); } if ((!isDigit \u0026\u0026 ch != ' ') (i == s.size() - 1)) { if(op == '+') { stk.push(num); } else if(op == '-') { stk.push(-num); } else if (op == ' ') { num = num stk.top(); stk.pop(); stk.push(num); }else if (op == '/') { num = stk.top() / num; stk.pop(); stk.push(num); } num = 0; op = ch; } } int rs = 0; while(!stk.empty()) { rs += stk.top(); stk.pop(); } return rs; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"236.二叉树的最近公共祖先","url":"/notes/08d2ef416fe36746/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=236 lang=cpp [236] 二叉树的最近公共祖先 / include \"leetcode.h\" // @lc code=start / Definition for a binary tree node. struct TreeNode { int val; TreeNode left; TreeNode right; TreeNode(int x) : val(x), left(NULL), right(NULL) {} }; / class Solution { public: TreeNode lowestCommonAncestor(TreeNode root, TreeNode p, TreeNode q) { if (root == nullptr) { return nullptr; } if (root == p root == q) { return root; } // 在左子树找公共祖先 TreeNode left = lowestCommonAncestor(root- left, p, q); // 在右子树找公共祖先 TreeNode right = lowestCommonAncestor(root- right, p, q); // 都找不到，则当前节点为公共组件 if (left != nullptr \u0026\u0026 right != nullptr) { return root; } if (left != nullptr) { return left; } if (right != nullptr) { return right; } return nullptr; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"300.最长递增子序列","url":"/notes/110fa7fed851d549/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=300 lang=cpp [300] 最长递增子序列 / include \"leetcode.h\" // @lc code=start class Solution { public: int lengthOfLIS(vector\u003cint \u0026 nums) { vector\u003cint tails; for(int num: nums) { auto target = lower_bound(tails.begin(), tails.end(), num); if(target == tails.end()) { tails.push_back(num); } else { target = num; } } return tails.size(); } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"387.字符串中的第一个唯一字符","url":"/notes/5c1073abb1a4354f/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=387 lang=cpp [387] 字符串中的第一个唯一字符 / include \"leetcode.h\" // @lc code=start class Solution { public: int firstUniqChar(string s) { int count[26] = {}; for (int i = 0; i \u003c s.size(); i++) { count[s[i] - 'a']++; } for (int i = 0; i \u003c s.size(); i++) { if (count[s[i] - 'a'] == 1) return i; } return -1; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"438.找到字符串中所有字母异位词","url":"/notes/f0fafa58fa81eced/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=438 lang=cpp [438] 找到字符串中所有字母异位词 / include \"leetcode.h\" // @lc code=start class Solution { public: vector\u003cint findAnagrams(string s, string p) { vector\u003cint rs; vector\u003cint need(26, 0); vector\u003cint win(26, 0); if (s.size() \u003c p.size()) { return rs; } for (char ch : p) { need[ch - 'a'] ++; } int len = p.size(); int left = 0; for (int right = 0; right \u003c s.size(); right++) { char ch = s.at(right); win[ch - 'a'] ++; if (right - left + 1 len) { win[s.at(left) - 'a']--; left ++; } if (right - left + 1 == len \u0026\u0026 need == win) { rs.push_back(left); } } return rs; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"688.骑士在棋盘上的概率","url":"/notes/e6273d804d024ac3/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=688 lang=cpp [688] 骑士在棋盘上的概率 / include \"leetcode.h\" // @lc code=start class Solution { public: map\u003ctuple\u003cint,int,int , double memo; double knightProbability(int n, int k, int row, int column) { if(row \u003c 0 row = n column \u003c 0 column = n) { return 0; } if(k == 0) { return 1; } auto key = make_tuple(k, row, column); if (memo.count(key)) return memo[key]; double result = 0; result += knightProbability(n, k - 1, row - 2, column - 1) 1 / 8; result += knightProbability(n, k - 1, row - 2, column + 1) 1 / 8; result += knightProbability(n, k - 1, row - 1, column - 2) 1 / 8; result += knightProbability(n, k - 1, row - 1, column + 2) 1 / 8; result += knightProbability(n, k - 1, row + 1, column - 2) 1 / 8; result += knightProbability(n, k - 1, row + 2, column - 1) 1 / 8; result += knightProbability(n, k - 1, row + 2, column + 1) 1 / 8; result += knightProbability(n, k - 1, row + 1, column + 2) 1 / 8; return memo[key] = result; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"695.岛屿的最大面积","url":"/notes/5080a7cf177c528f/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=695 lang=cpp [695] 岛屿的最大面积 / include \"leetcode.h\" // @lc code=start class Solution { public: vector\u003cvector\u003cint gridMap; int maxAreaOfIsland(vector\u003cvector\u003cint \u0026grid, int i, int j) { if (i \u003c 0 i = grid.size() j \u003c 0 j = grid[0].size()) { return 0; } if (gridMap[i][j] == 1 grid[i][j] == 0) { return 0; } gridMap[i][j] = 1; int top = maxAreaOfIsland(grid, i - 1, j); int down = maxAreaOfIsland(grid, i + 1, j); int left = maxAreaOfIsland(grid, i, j - 1); int right = maxAreaOfIsland(grid, i, j + 1); int sum = top + down + left + right + 1; return sum; } int maxAreaOfIsland(vector\u003cvector\u003cint \u0026grid) { int maxSize = 0; gridMap.assign(grid.size(), vector\u003cint (grid[0].size(), 0)); for (int i = 0; i \u003c grid.size(); i++) { for (int j = 0; j \u003c grid[i].size(); j++) { int size = maxAreaOfIsland(grid, i, j); maxSize = maxSize size ? maxSize : size; } } return maxSize; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"739.每日温度","url":"/notes/002e2eddfaae4e16/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=739 lang=cpp [739] 每日温度 / include \"leetcode.h\" // @lc code=start class Solution { public: vector\u003cint dailyTemperatures(vector\u003cint \u0026 temperatures) { vector\u003cint maxTemps; vector\u003cint ans(temperatures.size(), 0); for (int i = temperatures.size() - 1; i = 0; i--) { while(!maxTemps.empty() \u0026\u0026 temperatures[maxTemps.back()] \u003c= temperatures[i]) { maxTemps.pop_back(); } if (!maxTemps.empty()) { ans[i] = maxTemps.back() - i; } maxTemps.push_back(i); } return ans; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"1143.最长公共子序列","url":"/notes/5852112c135004af/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":"/ @lc app=leetcode.cn id=1143 lang=cpp [1143] 最长公共子序列 / include \"leetcode.h\" // @lc code=start class Solution { public: int longestCommonSubsequence(string text1, string text2) { vector\u003cint dp(text1.size() + 1, 0); for (int i = 0; i \u003c text2.size(); i++) { int leftTop = 0; for (int j = 0; j \u003c text1.size(); j++) { int top = dp[j + 1]; if(text1[j] == text2[i]) { dp[j + 1] = leftTop + 1; } else { dp[j + 1] = max(dp[j], dp[j + 1]); } leftTop = top; } } return dp[text1.size()]; } }; // @lc code=end ","description":"保留题目对应的 C++ 练习实现，便于回顾与继续练习。","practiceLabel":"练习代码"},{"title":"leetcode","url":"/notes/85e225b9f26a2a1d/","section":"algorithms","sectionTitle":"算法练习","folders":["LeetCode"],"text":" ifndef LEETCODE_H define LEETCODE_H include \u003cvector include \u003cstring include \u003cunordered_map include \u003cunordered_set include \u003cmap include \u003cset include \u003cqueue include \u003cstack include \u003calgorithm include \u003cnumeric include \u003cfunctional include \u003cclimits include \u003ciostream include \u003clist using namespace std; // 链表 struct ListNode { int val; ListNode next; ListNode() : val(0), next(nullptr) {} ListNode(int x) : val(x), next(nullptr) {} ListNode(int x, ListNode next) : val(x), next(next) {} }; // 二叉树 struct TreeNode { int val; TreeNode left; TreeNode right; TreeNode() : val(0), left(nullptr), right(nullptr) {} TreeNode(int x) : val(x), left(nullptr), right(nullptr) {} TreeNode(int x, TreeNode left, TreeNode right) : val(x), left(left), right(right) {} }; // N 叉树 class Node { public: int val; vector\u003cNode children; Node() {} Node(int _val) : val(_val) {} Node(int _val, vector\u003cNode _children) : val(_val), children(_children) {} }; endif ","description":"本地练习共用的类型声明与头文件。","practiceLabel":"辅助代码"},{"title":"IM 会话列表的数据访问优化","url":"/notes/ac7c6e4dc35e8109/","section":"practice","sectionTitle":"项目实践","folders":["业务问题"],"text":" IM 会话列表的数据访问优化 会话系统由多个业务模块组成，各模块可能并发读写同一条会话数据，带来重复查询、频繁写入和数据一致性问题。 各模块通过同一个数据访问层读写会话，减少重复查询和写入。消息与草稿保存成功后，才向页面确认。 [!NOTE] 示例 两个模块同时查询同一会话，只查一次数据库，结果分别返回。连续收到多条消息时，消息全部保存，尚未执行的列表写入可以合并。 1. 业务场景与数据访问问题 会话列表根据新消息更新内容、未读数和排列顺序。多个模块独立查询同一条会话记录，会产生重复访问。 [!NOTE] 会话摘要 指列表展示所需的数据，如最后一条消息、未读数和排序时间。摘要可以重新计算，消息和草稿必须可靠保存。 连续收到消息还会多次修改摘要。优化时需要区分查询、摘要和原始记录： 数据或操作 处理要求 --- --- 多个模块读取同一份会话记录 可以共享一次查询结果 同一会话连续产生多个待写摘要 可以只保存最新摘要 每条消息、草稿、已读位置和删除记录 按业务操作可靠保存，不能随摘要合并而丢弃 查询或摘要计算期间发生新更新 拒绝用旧结果覆盖当前状态 未发送消息和草稿可能只有本地副本，因此不能等缓存批量写入时才保存，也不能依赖服务端重新同步来恢复。 2. 方案对比与整体架构 2.1 三种读写方案对比 对比维度 先写缓存，定时保存 各模块直接读写数据库 统一读写，分类保存 --- --- --- --- 消息与草稿保存 写入数据库前可能丢失 提交后确认保存 提交后确认保存 相同并发查询 有缓存时复用，未命中时仍可能重复 各模块分别查询 有缓存则复用，否则共享一次查询 摘要写入次数 可合并尚未执行的写入 每次更新分别写入 同一会话只保留最新待写摘要 保存确认耗时 需等待定时保存完成 等待本次事务完成 等待事务完成，消息与草稿优先 并发一致性 需处理缓存与数据库的先后关系 数据库处理事务，页面仍需防止旧回调覆盖新值 统一检查数据版本和回调归属 进程退出后恢复 只能恢复已写入数据库的内容 从已提交记录恢复 恢复原始记录，重建摘要，继续待发任务 实现与维护 需要定时保存和失败重试 初始实现简单，访问逻辑分散 集中维护缓存、任务队列与版本，复杂度较高 选择第三种方案：集中处理重复访问，分别安排消息保存和摘要更新。代价是增加任务调度与版本管理。 [!NOTE] 保存确认 页面回显只表示内容已显示，数据库提交成功才表示保存完成。三种方案都需要处理发送重试和草稿保护。 2.2 整体架构 业务模块通过数据访问层访问本地数据库。读取请求共用缓存和查询任务；消息、草稿优先保存；摘要按会话合并写入。发送模块只处理已保存的待发任务。 [业务模块通过统一数据访问层查询缓存、保存原始记录和更新摘要；本地数据库保存消息、草稿、待发任务和同步位置，发送与同步模块连接服务端] [!NOTE] 图中边界 数据库事务保证一组修改全部成功或全部撤销；数据访问层负责查询合并、写入调度和版本检查。网络请求在事务外执行，发送前先保存消息与待发任务。发送结果和同步消息也通过保存路径入库，再更新缓存和页面。 3. 并发查询合并与缓存更新 3.1 多个模块共享查询结果 数据访问层按“账号 ID + 会话 ID”查找缓存。缓存有效则直接返回；否则发起一次查询，其余相同请求等待结果。 [独立查询各自访问数据库；统一入口让同一会话的并发请求等待同一次查询，并将结果分别返回] 查询结束后，每个等待者分别收到结果或错误。 [!NOTE] 合并条件 查询范围和返回内容必须相同。不同消息页、不同筛选条件不能只按会话 ID 合并。 3.2 旧查询结果的回填校验 查询返回时，先检查会话是否已更新。若已有新数据，就丢弃旧结果。 [查询发出时记录 v10，新消息将缓存更新为 v11；旧查询返回后因版本不符而拒绝覆盖] 会话更新或删除时递增本地版本。查询开始时记录版本，返回时比较版本。 [!NOTE] 并发处理 缓存检查、查询登记和版本记录在同一锁内完成；版本比较与缓存更新也需持锁，避免检查后又插入新更新。图中的查询始于 v10，返回时已是 v11，因此不能覆盖缓存。 “登录批次”是每次登录生成的标识，用来区分同一账号退出后重新登录的两次会话。旧请求不能更新新登录的页面。删除标记和本地版本至少保留到旧查询结束，不能随缓存一起清除，否则旧结果可能恢复已删除的会话。 页面订阅会话变化时，也要在同一锁内完成订阅登记和当前快照读取，再按版本顺序通知后续更新，避免首次显示与订阅之间漏掉消息。服务端消息乱序仍按业务序号处理，本地版本仅用于判断本地异步结果是否过期。 4. 会话摘要的写入合并 4.1 只合并尚未执行的摘要 连续消息会改变最后一条消息、未读数和排序时间。数据访问层按会话保留最新待写摘要，新的摘要替换队列中尚未执行的旧版本，消息记录仍完整保存。 [A、B、C 三条消息全部保存；若摘要均未开始写入，则只提交包含 C 和累计未读数的最新摘要] 只替换尚未开始写入的摘要。批次结束时，只移除已提交的版本，保留执行期间新增的摘要。 [!NOTE] 合并示例 收到 A、B、C 三条消息，三条消息全部保存。若对应摘要都未开始写入，只提交 C 对应的最新摘要，未读数仍计入三条消息；若 A 已开始写入，只能合并后续 B、C 的摘要。 4.2 摘要计算期间的数据更新 原始记录更新时，在同一事务中递增会话的数据修订号，标记摘要需要重建。摘要写入前检查修订号；数据已变，则重新计算。 计算时，从同一数据库快照读取记录和修订号；提交时，在事务中重新校验。摘要同时保存计算依据的修订号，重启后据此判断是否过期。摘要更新不修改原始消息或草稿。 [!NOTE] 两类版本 本地版本用于检查旧查询能否更新缓存。数据库修订号表示原始记录已更新到哪一版，用于检查摘要是否过期。 4.3 批次大小与保存优先级 合并写入减少同一会话的摘要更新次数；批量提交则把多个待写操作放进一个事务，减少事务次数。两者可以配合，但批次过大会延迟消息与草稿保存。 调度器限制每批摘要数量，优先处理正在等待保存确认的消息和草稿。待发任务保留在数据库，内存只领取有限批次。容量不足时拒绝新操作并保留输入，已接受的任务不能被丢弃。 5. 消息保存、发送与异常恢复 5.1 消息与待发任务同时保存 消息保存成功后，进程可能在网络请求发出前退出。因此，数据库还需保存一条待发任务，记录这条消息尚未发送。消息与任务在同一事务中提交，重启后就能找到需要继续发送的内容。 [本地事务保存消息和待发任务，成功后发起网络请求；收到服务端确认后，再更新本地消息和任务状态] 网络请求在本地提交成功后执行，防止服务端已经接收、本地却没有记录。提交成功只表示内容已在本地保存；“已发送”还需要服务端确认，并完成本地状态提交。 清空编辑器前也要校验草稿版本，避免删掉提交期间的新输入。附件先保存到应用管理的稳定路径，再在事务中登记引用；清理文件前需检查是否仍被数据库记录引用。提交后即使未能唤醒发送模块，重启扫描待发任务也能恢复发送。 5.2 超时重试与重复消息处理 网络超时不能证明服务端没有收到消息。重试必须沿用原消息标识和内容，服务端按“账号 + 消息标识”去重，让多次请求对应同一条消息。不同内容不能复用标识，服务端的去重保留时间需覆盖重试周期；超过期限后，先查询处理结果。 发送模块只领取当前账号的已提交任务。领取时，在短事务中登记本次发送编号和占用期限，再执行网络请求；到期仍未完成的任务可重新领取。有会话内顺序要求时，按本地序号等待前序任务完成。 结果 本地处理 --- --- 服务端确认成功 在同一事务中关联服务端消息 ID、将消息标为已发送、将任务标为已确认，提交后更新页面 断网或超时 保存重试次数和下次执行时间，逐步延长间隔后重试 自动重试耗尽 暂停自动发送，保留消息与任务，支持手动重试 旧发送尝试返回失败 校验发送编号，不覆盖新尝试或已发送状态 旧尝试返回有效成功确认时，仍可完成同一条消息；服务端同步到的消息也按原消息标识归并。本地确认事务失败时保留待发记录，重试取得同一结果后再次提交确认。 5.3 草稿保存与版本控制 草稿连续编辑时，较早的保存任务可能晚于新任务完成。数据访问层为每次编辑串行分配递增版本，立即调度文本与附件引用的保存，数据库只接受更新版本。清空也要保存一个更高版本的删除标记，防止旧任务恢复已清空内容。 保存过程 页面与数据行为 --- --- 编辑到版本 41，事务未完成 即时显示输入，标记“保存中” 版本 41 提交成功，当前仍为 41 显示“已保存” 版本 41 返回时已编辑到 42 保留新输入，等待版本 42 的保存结果 磁盘满或写入失败 保留输入并提示失败 保存期间进程退出 重启后读取最新已提交版本，版本号继续递增 保存由编辑触发，不依赖页面退出或后台切换。多个保存操作可以共用短事务，但“已保存”必须在相应事务提交后确认。 5.4 进程重启与账号切换 进程退出会丢失内存状态，恢复需以数据库已提交记录为准。图 6 按发送中断的位置区分恢复操作。 [本地保存前、保存后、服务端接收后及本地确认时发生中断，分别按数据库中的草稿、消息与任务状态恢复] 启动时根据数据库修订号重建过期摘要；账号鉴权有效后领取待发任务，并从已保存的同步位置继续拉取消息。每批服务端消息的保存与同步位置更新必须在同一事务提交，避免重启后跳过尚未保存的数据。 全量同步仅替换服务端管理的字段，保留本地草稿、待发消息与操作。普通退出登录保留这些记录，暂停任务领取并解除页面订阅。在途请求仍可能到达服务端，其结果只归属原账号，旧登录回调不得更新当前页面；再次登录后从数据库恢复任务。 6. 验证方法与预期效果 用相同消息负载比较优化前后的数据库访问，并在图 6 的各个中断点终止进程、重新打开数据库，检查保存和恢复行为。 起初的问题 验证方法与预期结果 --- --- 相同查询重复执行 同时请求同一会话，对比业务请求数与实际查询数，确认有效缓存或进行中的查询被共享 摘要中间版本频繁写入 连续接收消息，确认原始记录完整，尚未执行的摘要只提交最新版本，未读数和排序正确 旧结果覆盖新数据 延迟返回查询与草稿保存回调，确认数据不倒退、已删除内容不恢复 已接受的内容丢失 提交后终止进程，重启后能恢复消息、草稿和待发任务 超时后重复发送 丢弃确认响应，再用原标识重试，服务端仍返回同一条消息 并发验证还需覆盖订阅登记与更新同时发生、账号切换时返回旧请求，以及全量同步时存在本地未发送内容。异常验证覆盖磁盘满、确认事务失败和服务端去重期限到期。 性能记录包括查询次数、摘要写入次数、事务次数，以及消息和草稿提交延迟、待发积压与列表更新延迟。事务减少但保存变慢时，应检查摘要批次是否长期占用写队列，调整批次大小或优先级后复测。 方案的预期效果是减少相同查询和摘要中间版本的写入，同时保持消息与草稿可恢复、列表状态不倒退。验收需要同时满足这两组条件。 相关资料：[消息与待发任务的事务提交]、[服务端去重与安全重试]。 ","description":"","practiceLabel":""}]</script></template></div></section>
