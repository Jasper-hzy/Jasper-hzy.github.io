<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
  <title id="title">Surface 与 BufferQueue 生产消费模型</title>
  <desc id="desc">展示 App、MediaCodec 或 Camera 作为生产者，通过 BufferQueue 和 fence 同步，将 buffer 交给 SurfaceFlinger、SurfaceTexture 或编码器消费。</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526174}.group{fill:#f8fafc;stroke:#d1d9e6;stroke-width:1.5}.producer{fill:#e9f5ff;stroke:#6aa6d8}.queue{fill:#fff4df;stroke:#d6a24a}.consumer{fill:#eef8ed;stroke:#71a96d}.box{fill:#fff;stroke:#435166;stroke-width:1.5;rx:12}.buf{fill:#ffffff;stroke:#64748b;stroke-width:1.4;rx:8}.label{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.txt{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c8796;stroke-width:1.8;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow2)}.fence{fill:#fff7ed;stroke:#fb923c;stroke-width:1.4}.note{fill:#f8fafc;stroke:#cbd5e1}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c8796"/></marker>
  </defs>
  <rect class="bg" width="1240" height="680"/>
  <text class="title" x="44" y="44">Surface / BufferQueue：一块 buffer 的流转</text>
  <text class="sub" x="44" y="72">重点不是对象名字，而是谁生产 buffer、谁消费 buffer、什么时候可以复用。</text>

  <rect class="group producer" x="46" y="120" width="280" height="390" rx="18"/>
  <text class="label" x="75" y="152">生产者</text>
  <text class="small" x="75" y="176">App / RenderThread / Camera / MediaCodec</text>
  <rect class="box" x="78" y="220" width="215" height="58" rx="12"/><text class="label" x="185" y="245" text-anchor="middle">dequeueBuffer</text><text class="txt" x="185" y="266" text-anchor="middle">取空闲 GraphicBuffer</text>
  <rect class="box" x="78" y="320" width="215" height="58" rx="12"/><text class="label" x="185" y="345" text-anchor="middle">绘制 / 写入</text><text class="txt" x="185" y="366" text-anchor="middle">CPU / GPU / Codec</text>
  <rect class="box" x="78" y="420" width="215" height="58" rx="12"/><text class="label" x="185" y="445" text-anchor="middle">queueBuffer</text><text class="txt" x="185" y="466" text-anchor="middle">提交给队列</text>

  <rect class="group queue" x="392" y="120" width="420" height="390" rx="18"/>
  <text class="label" x="421" y="152">BufferQueue</text>
  <text class="small" x="421" y="176">管理空闲、已入队、已被消费的 buffer</text>
  <rect class="buf" x="430" y="230" width="90" height="70" rx="8"/><text class="label" x="475" y="260" text-anchor="middle">Buffer A</text><text class="small" x="475" y="282" text-anchor="middle">free</text>
  <rect class="buf" x="560" y="230" width="90" height="70" rx="8"/><text class="label" x="605" y="260" text-anchor="middle">Buffer B</text><text class="small" x="605" y="282" text-anchor="middle">queued</text>
  <rect class="buf" x="690" y="230" width="90" height="70" rx="8"/><text class="label" x="735" y="260" text-anchor="middle">Buffer C</text><text class="small" x="735" y="282" text-anchor="middle">acquired</text>
  <rect class="box fence" x="450" y="355" width="310" height="78" rx="12"/><text class="label" x="605" y="383" text-anchor="middle">Fence 同步</text><text class="txt" x="605" y="406" text-anchor="middle">写完才能读，读完才能复用</text>

  <rect class="group consumer" x="878" y="120" width="315" height="390" rx="18"/>
  <text class="label" x="908" y="152">消费者</text>
  <text class="small" x="908" y="176">SurfaceFlinger / SurfaceTexture / ImageReader</text>
  <rect class="box" x="920" y="220" width="230" height="58" rx="12"/><text class="label" x="1035" y="245" text-anchor="middle">acquireBuffer</text><text class="txt" x="1035" y="266" text-anchor="middle">拿到可消费 buffer</text>
  <rect class="box" x="920" y="320" width="230" height="58" rx="12"/><text class="label" x="1035" y="345" text-anchor="middle">合成 / 采样 / 编码</text><text class="txt" x="1035" y="366" text-anchor="middle">根据场景消费 buffer</text>
  <rect class="box" x="920" y="420" width="230" height="58" rx="12"/><text class="label" x="1035" y="445" text-anchor="middle">releaseBuffer</text><text class="txt" x="1035" y="466" text-anchor="middle">释放后可复用</text>

  <path class="arrow" d="M293 249 L430 249"/><text class="small" x="330" y="235">dequeue</text>
  <path class="arrow" d="M293 449 C340 449,365 275,430 275"/><text class="small" x="322" y="390">queue</text>
  <path class="arrow" d="M780 265 L920 249"/><text class="small" x="820" y="236">acquire</text>
  <path class="dash" d="M920 449 C820 570,560 570,475 300"/><text class="small" x="610" y="600">release 后回到 free 队列</text>
  <path class="arrow" d="M185 278 L185 320"/><path class="arrow" d="M185 378 L185 420"/><path class="arrow" d="M1035 278 L1035 320"/><path class="arrow" d="M1035 378 L1035 420"/>

  <rect class="note" x="58" y="560" width="1124" height="56" rx="12"/>
  <text class="sub" x="82" y="592">三缓冲能减少生产者阻塞，但队列里多排一帧也会增加实时链路延迟；云游戏优化经常就是在减少中间队列和等待。</text>
</svg>
