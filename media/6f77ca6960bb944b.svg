<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 748" role="img" aria-labelledby="title desc"><title id="title">同一会话的查询合并</title><desc id="desc">两个模块读取相同会话记录。独立访问执行两次查询，统一入口在缓存无效时登记两个等待者，只查询一次，再将结果分别返回。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#247267"/></marker></defs><rect width="640" height="748" rx="12" fill="#fcfdfc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="26" fill="#315f82" text-anchor="start" font-weight="600">独立访问：相同记录查两次</text><rect x="32" y="75" width="204" height="62" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="134" y="114" font-size="24" fill="#315f82" text-anchor="middle" font-weight="400">会话列表</text><rect x="32" y="161" width="204" height="62" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="134" y="200" font-size="24" fill="#315f82" text-anchor="middle" font-weight="400">未读数模块</text><rect x="416" y="75" width="192" height="148" rx="10" fill="#edf5f2" stroke="#cadbd7"/><text x="512" y="158" font-size="26" fill="#247267" text-anchor="middle" font-weight="400">数据库</text><path d="M247 106H403" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="91" font-size="20" fill="#566b73" text-anchor="middle" font-weight="400">查询会话 X</text><path d="M247 192H403" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="177" font-size="20" fill="#566b73" text-anchor="middle" font-weight="400">查询会话 X</text><path d="M32 253H608" stroke="#cadbd7"/><text x="32" y="295" font-size="26" fill="#247267" text-anchor="start" font-weight="600">统一入口：共享一次查询</text><rect x="32" y="324" width="244" height="62" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="154" y="363" font-size="24" fill="#315f82" text-anchor="middle" font-weight="400">会话列表</text><rect x="364" y="324" width="244" height="62" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="486" y="363" font-size="24" fill="#315f82" text-anchor="middle" font-weight="400">未读数模块</text><path d="M154 397V436" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><path d="M486 397V436" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="448" width="576" height="80" rx="10" fill="#edf5f2" stroke="#cadbd7"/><text x="320" y="480" font-size="24" fill="#247267" text-anchor="middle" font-weight="600">数据访问层 · 登记两个等待者</text><text x="320" y="511" font-size="20" fill="#566b73" text-anchor="middle" font-weight="400">缓存无效，且没有正在执行的相同查询</text><path d="M230 539V604" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="578" font-size="20" fill="#247267" text-anchor="end" font-weight="400">查询一次</text><path d="M410 604V539" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="578" font-size="20" fill="#247267" text-anchor="start" font-weight="400">返回结果</text><rect x="32" y="617" width="576" height="60" rx="10" fill="#edf5f2" stroke="#cadbd7"/><text x="320" y="655" font-size="24" fill="#247267" text-anchor="middle" font-weight="400">数据库 · 读取会话 X</text><text x="320" y="717" font-size="22" fill="#315f82" text-anchor="middle" font-weight="400">查询完成 → 结果分别返回两个模块</text></g></svg>
