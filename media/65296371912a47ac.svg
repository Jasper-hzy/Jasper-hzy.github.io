<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Android 页面运行机制分层架构图</title>
  <desc id="desc">展示 App 进程、system_server 和 SurfaceFlinger 进程中 Activity、Window、ViewRootImpl、WMS、Surface、Layer 的职责关系。</desc>
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .lane { fill: #f7f8fb; stroke: #c9d1dc; stroke-width: 2; rx: 18; }
      .app { fill: #e9f5ff; stroke: #6aa6d8; }
      .sys { fill: #fff4df; stroke: #d6a24a; }
      .sf { fill: #eef8ed; stroke: #71a96d; }
      .node { fill: #ffffff; stroke: #536173; stroke-width: 1.6; rx: 12; }
      .node2 { fill: #fbfcff; stroke: #536173; stroke-width: 1.4; rx: 10; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .lane-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .desc { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d5b6c; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6b7a; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c8796; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
      .green { stroke: #2f8f46; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .orange { stroke: #c27a18; stroke-width: 2.2; fill: none; marker-end: url(#arrow-orange); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c8796"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2f8f46"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#c27a18"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="760"/>
  <text class="title" x="48" y="48">Android 页面从组件到上屏的分层关系</text>
  <text class="desc" x="48" y="76">每层只解决一类问题：组件能不能运行、窗口能不能显示、View 树怎么绘制、buffer 怎么合成。</text>

  <rect class="lane app" x="44" y="115" width="330" height="520" rx="18"/>
  <text class="lane-title" x="72" y="150">App 进程</text>
  <text class="small" x="72" y="174">业务对象和 View 树运行在这里</text>

  <rect class="lane sys" x="425" y="115" width="330" height="520" rx="18"/>
  <text class="lane-title" x="453" y="150">system_server</text>
  <text class="small" x="453" y="174">系统可信服务，管理组件、进程和窗口秩序</text>

  <rect class="lane sf" x="806" y="115" width="330" height="520" rx="18"/>
  <text class="lane-title" x="834" y="150">SurfaceFlinger 进程</text>
  <text class="small" x="834" y="174">图层 buffer 合成与显示输出</text>

  <rect class="node" x="82" y="215" width="220" height="58" rx="12"/><text class="label" x="192" y="239" text-anchor="middle">Activity</text><text class="desc" x="192" y="260" text-anchor="middle">页面身份 / 生命周期</text>
  <rect class="node" x="82" y="300" width="220" height="58" rx="12"/><text class="label" x="192" y="324" text-anchor="middle">PhoneWindow</text><text class="desc" x="192" y="345" text-anchor="middle">窗口抽象 / DecorView 容器</text>
  <rect class="node" x="82" y="385" width="220" height="58" rx="12"/><text class="label" x="192" y="409" text-anchor="middle">DecorView / View 树</text><text class="desc" x="192" y="430" text-anchor="middle">业务布局和 View 层级</text>
  <rect class="node" x="82" y="470" width="220" height="58" rx="12"/><text class="label" x="192" y="494" text-anchor="middle">ViewRootImpl</text><text class="desc" x="192" y="515" text-anchor="middle">绘制调度 / 输入 / relayout</text>
  <rect class="node" x="82" y="555" width="220" height="58" rx="12"/><text class="label" x="192" y="579" text-anchor="middle">Surface</text><text class="desc" x="192" y="600" text-anchor="middle">App 写 buffer 的入口</text>

  <rect class="node" x="480" y="215" width="220" height="70" rx="12"/><text class="label" x="590" y="240" text-anchor="middle">ATMS / AMS</text><text class="desc" x="590" y="261" text-anchor="middle">Activity / Task / 进程</text><text class="desc" x="590" y="278" text-anchor="middle">生命周期和权限调度</text>
  <rect class="node2" x="480" y="315" width="220" height="58" rx="10"/><text class="label" x="590" y="339" text-anchor="middle">ActivityRecord / Task</text><text class="desc" x="590" y="360" text-anchor="middle">组件和任务栈记录</text>
  <rect class="node" x="480" y="430" width="220" height="70" rx="12"/><text class="label" x="590" y="455" text-anchor="middle">WMS</text><text class="desc" x="590" y="476" text-anchor="middle">Window token / 层级 / 焦点</text><text class="desc" x="590" y="493" text-anchor="middle">布局 / 输入目标</text>
  <rect class="node2" x="480" y="535" width="220" height="58" rx="10"/><text class="label" x="590" y="559" text-anchor="middle">WindowState / SurfaceControl</text><text class="desc" x="590" y="580" text-anchor="middle">系统侧窗口和图层控制句柄</text>

  <rect class="node" x="862" y="250" width="220" height="58" rx="12"/><text class="label" x="972" y="274" text-anchor="middle">Layer</text><text class="desc" x="972" y="295" text-anchor="middle">SurfaceFlinger 合成单位</text>
  <rect class="node" x="862" y="365" width="220" height="58" rx="12"/><text class="label" x="972" y="389" text-anchor="middle">BufferQueue</text><text class="desc" x="972" y="410" text-anchor="middle">buffer 生产消费队列</text>
  <rect class="node" x="862" y="480" width="220" height="58" rx="12"/><text class="label" x="972" y="504" text-anchor="middle">屏幕</text><text class="desc" x="972" y="525" text-anchor="middle">最终显示输出</text>

  <path class="arrow" d="M192 273 L192 300"/><path class="arrow" d="M192 358 L192 385"/><path class="arrow" d="M192 443 L192 470"/><path class="arrow" d="M192 528 L192 555"/>
  <path class="arrow" d="M590 285 L590 315"/><path class="arrow" d="M590 500 L590 535"/>
  <path class="dash" d="M700 344 C740 344, 740 465, 700 465"/>
  <path class="orange" d="M302 499 C365 499, 410 465, 480 465"/><text class="small" x="333" y="455">Binder: addWindow / relayout</text>
  <path class="dash" d="M480 490 C410 545, 370 526, 302 512"/><text class="small" x="326" y="548">Insets / 输入通道 / 布局结果</text>
  <path class="green" d="M700 564 C760 540, 800 310, 862 279"/><text class="small" x="735" y="448">SurfaceControl Transaction</text>
  <path class="green" d="M302 584 C515 660, 700 470, 862 394"/><text class="small" x="500" y="652">queueBuffer</text>
  <path class="arrow" d="M972 308 L972 365"/><path class="arrow" d="M972 423 L972 480"/>

  <rect x="44" y="668" width="1092" height="48" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text class="desc" x="64" y="696">关键分工：ATMS/AMS 管组件和进程，WMS 管窗口秩序，ViewRootImpl 管 App 内 View 树运行，SurfaceFlinger 管图层合成。</text>
</svg>
