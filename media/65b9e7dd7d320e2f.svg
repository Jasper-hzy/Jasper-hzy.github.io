<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
  <title id="title">Android View 事件分发主链</title>
  <desc id="desc">突出一次正常点击从 ViewRootImpl 进入 View 树，经过 ViewGroup 分发、父容器拦截判断、目标 View 的 onTouch 与 onTouchEvent，最终触发 onClick 的主链。拦截和消费分支作为侧边注释。</desc>
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .stage { stroke-width: 2; }
      .entry { fill: #eef7ff; stroke: #60a5fa; }
      .dispatch { fill: #eff6ff; stroke: #3b82f6; }
      .decision { fill: #fff7ed; stroke: #f97316; }
      .handle { fill: #ecfdf5; stroke: #10b981; }
      .click { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .touch { fill: #fefce8; stroke: #eab308; stroke-width: 2; }
      .branch { fill: #fff1f2; stroke: #fb7185; stroke-width: 1.6; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .txt { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .num { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .mainline { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#blue); }
      .greenline { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#green); }
      .branchline { stroke: #e11d48; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#red); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e11d48"/></marker>
  </defs>

  <rect class="bg" width="1200" height="1280"/>
  <text class="title" x="44" y="46">一次正常点击的事件分发主链</text>
  <text class="subtitle" x="44" y="74">先沿中间编号从上往下读；红色虚线只表示会打断主链的分支。</text>

  <rect class="stage entry" x="100" y="102" width="1000" height="88" rx="14"/>
  <text class="label" x="126" y="132">事件进入当前 Window 的 View 树</text>
  <text class="txt" x="126" y="157">InputChannel → ViewRootImpl / InputStage → DecorView → Activity(Window.Callback)</text>
  <text class="txt" x="680" y="157">→ PhoneWindow → DecorView.superDispatchTouchEvent</text>

  <path class="mainline" d="M600 190 L600 232"/>

  <circle cx="330" cy="272" r="20" fill="#2563eb"/>
  <text class="num" x="330" y="272">1</text>
  <rect class="stage dispatch" x="360" y="232" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="264">ViewGroup.dispatchTouchEvent(ev)</text>
  <text class="txt" x="388" y="289">每一级 ViewGroup 的分发入口；DOWN 先清理旧状态</text>

  <path class="mainline" d="M600 312 L600 352"/>

  <circle cx="330" cy="392" r="20" fill="#f97316"/>
  <text class="num" x="330" y="392">2</text>
  <rect class="stage decision" x="360" y="352" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="384">onInterceptTouchEvent(ev) = false</text>
  <text class="txt" x="388" y="409">正常点击主链：父容器不拦截，继续寻找 child</text>

  <rect class="branch" x="875" y="342" width="278" height="100" rx="12"/>
  <text class="label" x="897" y="372">若返回 true</text>
  <text class="small" x="897" y="395">DOWN：父容器自己处理</text>
  <text class="small" x="897" y="417">中途拦截：child 收到 CANCEL，</text>
  <text class="small" x="897" y="435">后续事件由父容器处理</text>
  <path class="branchline" d="M840 392 L865 392"/>

  <path class="mainline" d="M600 432 L600 472"/>

  <circle cx="330" cy="512" r="20" fill="#2563eb"/>
  <text class="num" x="330" y="512">3</text>
  <rect class="stage dispatch" x="360" y="472" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="504">child.dispatchTouchEvent(ev)</text>
  <text class="txt" x="388" y="529">按 z-order + 坐标命中；正常路径返回 true，遇到 ViewGroup 继续递归</text>

  <path class="mainline" d="M600 552 L600 592"/>

  <circle cx="330" cy="632" r="20" fill="#2563eb"/>
  <text class="num" x="330" y="632">4</text>
  <rect class="stage dispatch" x="360" y="592" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="624">View.dispatchTouchEvent(ev)</text>
  <text class="txt" x="388" y="649">递归到最具体的目标 View，进入目标内部处理</text>

  <path class="mainline" d="M600 672 L600 712"/>

  <circle cx="330" cy="752" r="20" fill="#f97316"/>
  <text class="num" x="330" y="752">5</text>
  <rect class="stage decision" x="360" y="712" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="744">OnTouchListener 未设置或 onTouch(ev) = false</text>
  <text class="txt" x="388" y="769">监听器不消费当前事件，继续执行 View 默认触摸逻辑</text>

  <rect class="branch" x="875" y="712" width="278" height="80" rx="12"/>
  <text class="label" x="897" y="742">若 onTouch 返回 true</text>
  <text class="small" x="897" y="763">本次不再调用 onTouchEvent；</text>
  <text class="small" x="897" y="783">默认点击链被截断</text>
  <path class="branchline" d="M840 752 L865 752"/>

  <path class="greenline" d="M600 792 L600 832"/>

  <circle cx="330" cy="872" r="20" fill="#059669"/>
  <text class="num" x="330" y="872">6</text>
  <rect class="stage handle" x="360" y="832" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="864">View.onTouchEvent(ev)</text>
  <text class="txt" x="388" y="889">DOWN 建立 pressed 并返回 true；MOVE 更新状态；UP 校验点击</text>

  <rect class="stage touch" x="35" y="812" width="260" height="120" rx="12"/>
  <text class="label" x="57" y="842">DOWN 返回 true 的结果</text>
  <text class="small" x="57" y="865">父 ViewGroup 逐级记录直接 child</text>
  <text class="small" x="57" y="887">为 TouchTarget；后续 MOVE / UP</text>
  <text class="small" x="57" y="909">沿原路径发送</text>

  <path class="greenline" d="M600 912 L600 952"/>

  <circle cx="330" cy="992" r="20" fill="#059669"/>
  <text class="num" x="330" y="992">7</text>
  <rect class="stage handle" x="360" y="952" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="984">ACTION_UP 仍是有效点击</text>
  <text class="txt" x="388" y="1009">post PerformClick → performClickInternal → performClick</text>

  <rect class="branch" x="875" y="942" width="278" height="100" rx="12"/>
  <text class="label" x="897" y="972">若点击状态失效</text>
  <text class="small" x="897" y="995">MOVE 移出 / 长按 / ACTION_CANCEL</text>
  <text class="small" x="897" y="1017">→ 清理 pressed，不触发 onClick</text>
  <path class="branchline" d="M840 992 L865 992"/>

  <path class="greenline" d="M600 1032 L600 1072"/>

  <circle cx="330" cy="1112" r="20" fill="#16a34a"/>
  <text class="num" x="330" y="1112">8</text>
  <rect class="stage click" x="360" y="1072" width="480" height="80" rx="14"/>
  <text class="label" x="388" y="1104">OnClickListener.onClick(view)</text>
  <text class="txt" x="388" y="1129">点击语义回调；它不直接接收 MotionEvent</text>

  <rect class="stage touch" x="100" y="1180" width="1000" height="76" rx="12"/>
  <text class="label" x="126" y="1212">重点：dispatch 决定“发给谁”，intercept 决定“父容器是否接管”；</text>
  <text class="label" x="126" y="1238">onTouch / onTouchEvent 决定“是否消费”，onClick 是有效点击完成后的结果。</text>
</svg>
