<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <title>WebRTC 拥塞控制分层架构</title>
  <desc>五层逻辑职责架构。媒体数据自上向下进入 RTP 数据面，网络观测自下向上进入拥塞控制，控制结果再向上作用于调度与媒体适配。</desc>

  <defs>
    <marker id="arrow-media" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#a9916d"/>
    </marker>
    <marker id="arrow-control" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#8294a8"/>
    </marker>
    <marker id="arrow-local" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#737b87"/>
    </marker>
  </defs>

  <rect width="1280" height="950" fill="#121419"/>
  <text x="640" y="37" fill="#e5e7eb" font-size="26" font-weight="600" text-anchor="middle">WebRTC 拥塞控制分层架构</text>
  <text x="640" y="63" fill="#8d95a1" font-size="14" text-anchor="middle">横带是逻辑职责层；方框是层内模块；不对应 OSI 协议栈或固定代码类</text>

  <!-- shared layer bands -->
  <g stroke="#303640" stroke-width="1.2">
    <rect x="34" y="86" width="1212" height="128" rx="10" fill="#181b21"/>
    <rect x="34" y="226" width="1212" height="128" rx="10" fill="#16191f"/>
    <rect x="34" y="366" width="1212" height="202" rx="10" fill="#181b21"/>
    <rect x="34" y="580" width="1212" height="144" rx="10" fill="#16191f"/>
    <rect x="34" y="736" width="1212" height="148" rx="10" fill="#181b21"/>
  </g>

  <!-- layer labels -->
  <g>
    <g>
      <rect x="34" y="86" width="150" height="128" rx="10" fill="#1e222a"/>
      <rect x="34" y="86" width="4" height="128" rx="2" fill="#657080"/>
      <text x="109" y="126" fill="#d7dbe2" font-size="18" font-weight="600" text-anchor="middle">第 5 层</text>
      <text x="109" y="155" fill="#c2c7d0" font-size="15" text-anchor="middle">媒体适配</text>
      <text x="109" y="179" fill="#838c99" font-size="12" text-anchor="middle">执行媒体策略</text>
    </g>
    <g>
      <rect x="34" y="226" width="150" height="128" rx="10" fill="#1e222a"/>
      <rect x="34" y="226" width="4" height="128" rx="2" fill="#657080"/>
      <text x="109" y="266" fill="#d7dbe2" font-size="18" font-weight="600" text-anchor="middle">第 4 层</text>
      <text x="109" y="295" fill="#c2c7d0" font-size="15" text-anchor="middle">分配与调度</text>
      <text x="109" y="319" fill="#838c99" font-size="12" text-anchor="middle">落实发送配额</text>
    </g>
    <g>
      <rect x="34" y="366" width="150" height="202" rx="10" fill="#1e222a"/>
      <rect x="34" y="366" width="4" height="202" rx="2" fill="#657080"/>
      <text x="109" y="433" fill="#d7dbe2" font-size="18" font-weight="600" text-anchor="middle">第 3 层</text>
      <text x="109" y="462" fill="#c2c7d0" font-size="15" text-anchor="middle">拥塞控制</text>
      <text x="109" y="486" fill="#838c99" font-size="12" text-anchor="middle">BWE 职责边界</text>
    </g>
    <g>
      <rect x="34" y="580" width="150" height="144" rx="10" fill="#1e222a"/>
      <rect x="34" y="580" width="4" height="144" rx="2" fill="#657080"/>
      <text x="109" y="628" fill="#d7dbe2" font-size="18" font-weight="600" text-anchor="middle">第 2 层</text>
      <text x="109" y="657" fill="#c2c7d0" font-size="15" text-anchor="middle">反馈与测量</text>
      <text x="109" y="681" fill="#838c99" font-size="12" text-anchor="middle">提供网络观测</text>
    </g>
    <g>
      <rect x="34" y="736" width="150" height="148" rx="10" fill="#1e222a"/>
      <rect x="34" y="736" width="4" height="148" rx="2" fill="#657080"/>
      <text x="109" y="785" fill="#d7dbe2" font-size="18" font-weight="600" text-anchor="middle">第 1 层</text>
      <text x="109" y="814" fill="#c2c7d0" font-size="15" text-anchor="middle">媒体传输</text>
      <text x="109" y="838" fill="#838c99" font-size="12" text-anchor="middle">RTP 数据面</text>
    </g>
  </g>

  <!-- Layer 5 -->
  <g>
    <rect x="234" y="109" width="350" height="82" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="409" y="139" fill="#dce0e6" font-size="17" font-weight="600" text-anchor="middle">Encoder RateControl</text>
    <text x="409" y="166" fill="#969eaa" font-size="13" text-anchor="middle">消费视频预算：QP / 分辨率 / 帧率 / 丢帧</text>

    <rect x="696" y="109" width="350" height="82" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="871" y="139" fill="#dce0e6" font-size="17" font-weight="600" text-anchor="middle">保护与恢复策略</text>
    <text x="871" y="166" fill="#969eaa" font-size="13" text-anchor="middle">消费恢复预算：FEC / RTX / 过期包取舍</text>
  </g>

  <!-- Layer 4 -->
  <g>
    <rect x="234" y="249" width="350" height="82" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="409" y="279" fill="#dce0e6" font-size="17" font-weight="600" text-anchor="middle">Pacer 发送调度</text>
    <text x="409" y="306" fill="#969eaa" font-size="13" text-anchor="middle">按 pacing rate 平滑发包并限制排队</text>

    <rect x="696" y="249" width="350" height="82" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="871" y="279" fill="#dce0e6" font-size="17" font-weight="600" text-anchor="middle">BWA 带宽分配</text>
    <text x="871" y="306" fill="#969eaa" font-size="13" text-anchor="middle">音频 / 视频 / FEC / RTX / Probe</text>
  </g>

  <!-- Layer 3 -->
  <g>
    <rect x="216" y="389" width="994" height="156" rx="9" fill="#1d2026" stroke="#3a4049" stroke-width="1.2"/>
    <text x="713" y="419" fill="#cfd4dc" font-size="16" font-weight="600" text-anchor="middle">拥塞控制 / Bandwidth Estimation</text>

    <rect x="242" y="443" width="260" height="76" rx="8" fill="#23272e" stroke="#414955" stroke-width="1.1"/>
    <text x="372" y="470" fill="#d7dbe2" font-size="15" font-weight="600" text-anchor="middle">网络观测与状态</text>
    <text x="372" y="494" fill="#959daa" font-size="12" text-anchor="middle">acked rate / delay / loss / RTT</text>
    <text x="372" y="511" fill="#959daa" font-size="12" text-anchor="middle">queue / in-flight / probe</text>

    <rect x="582" y="443" width="260" height="76" rx="8" fill="#262a31" stroke="#4a525e" stroke-width="1.1"/>
    <text x="712" y="470" fill="#d7dbe2" font-size="15" font-weight="600" text-anchor="middle">算法实现</text>
    <text x="712" y="494" fill="#959daa" font-size="12" text-anchor="middle">WebRTC：GCC / GoogCC</text>
    <text x="712" y="511" fill="#959daa" font-size="12" text-anchor="middle">云游戏：低延迟场景化控制器</text>

    <rect x="922" y="443" width="260" height="76" rx="8" fill="#23272e" stroke="#414955" stroke-width="1.1"/>
    <text x="1052" y="470" fill="#d7dbe2" font-size="15" font-weight="600" text-anchor="middle">控制输出</text>
    <text x="1052" y="494" fill="#959daa" font-size="12" text-anchor="middle">target bitrate / pacing rate</text>
    <text x="1052" y="511" fill="#959daa" font-size="12" text-anchor="middle">cwnd / bandwidth state</text>

    <path d="M502 481 H582" fill="none" stroke="#737b87" stroke-width="1.8" marker-end="url(#arrow-local)"/>
    <path d="M842 481 H922" fill="none" stroke="#737b87" stroke-width="1.8" marker-end="url(#arrow-local)"/>
  </g>

  <!-- Layer 2 -->
  <g>
    <rect x="225" y="603" width="330" height="98" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="390" y="632" fill="#dce0e6" font-size="16" font-weight="600" text-anchor="middle">发送端 Packet History</text>
    <text x="390" y="658" fill="#969eaa" font-size="13" text-anchor="middle">transport seq / send time / size</text>
    <text x="390" y="680" fill="#969eaa" font-size="13" text-anchor="middle">将反馈与原始发送记录对齐</text>

    <rect x="645" y="596" width="540" height="112" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="915" y="625" fill="#dce0e6" font-size="16" font-weight="600" text-anchor="middle">RTCP 反馈协议族</text>
    <rect x="674" y="642" width="226" height="48" rx="7" fill="#262a31" stroke="#454d59" stroke-width="1"/>
    <text x="787" y="662" fill="#d6dae1" font-size="13" font-weight="600" text-anchor="middle">TWCC / Transport-CC</text>
    <text x="787" y="681" fill="#929aa6" font-size="11" text-anchor="middle">逐包到达状态与时间差</text>
    <rect x="930" y="642" width="226" height="48" rx="7" fill="#262a31" stroke="#454d59" stroke-width="1"/>
    <text x="1043" y="662" fill="#d6dae1" font-size="13" font-weight="600" text-anchor="middle">SR / RR / NACK …</text>
    <text x="1043" y="681" fill="#929aa6" font-size="11" text-anchor="middle">统计、质量与恢复反馈</text>
  </g>

  <!-- Layer 1 -->
  <g>
    <rect x="218" y="764" width="282" height="92" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="359" y="793" fill="#dce0e6" font-size="16" font-weight="600" text-anchor="middle">RTP Sender</text>
    <text x="359" y="818" fill="#969eaa" font-size="13" text-anchor="middle">音视频 RTP 包</text>
    <text x="359" y="839" fill="#969eaa" font-size="12" text-anchor="middle">Header Extension：transport seq</text>

    <rect x="555" y="779" width="170" height="62" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="640" y="805" fill="#dce0e6" font-size="15" font-weight="600" text-anchor="middle">Network</text>
    <text x="640" y="828" fill="#969eaa" font-size="12" text-anchor="middle">排队 / 丢包 / 抖动</text>

    <rect x="780" y="764" width="405" height="92" rx="9" fill="#20242c" stroke="#3c434e" stroke-width="1.2"/>
    <text x="982" y="793" fill="#dce0e6" font-size="16" font-weight="600" text-anchor="middle">RTP Receiver + Arrival Recorder</text>
    <text x="982" y="818" fill="#969eaa" font-size="13" text-anchor="middle">记录 transport seq 是否到达</text>
    <text x="982" y="839" fill="#969eaa" font-size="12" text-anchor="middle">记录到达时间并生成反馈依据</text>
  </g>

  <!-- concise media path -->
  <g fill="none" stroke="#a9916d" stroke-width="1.9" marker-end="url(#arrow-media)">
    <path d="M409 191 V249"/>
    <path d="M234 290 H202 V810 H218"/>
    <path d="M500 810 H555"/>
    <path d="M725 810 H780"/>
  </g>

  <!-- observations: short, local, dashed -->
  <g fill="none" stroke="#8294a8" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-control)">
    <path d="M359 764 V701"/>
    <path d="M982 764 V708"/>
    <path d="M640 580 V568"/>
  </g>

  <!-- control result: only layer-to-layer arrows -->
  <g fill="none" stroke="#8294a8" stroke-width="1.8" marker-end="url(#arrow-control)">
    <path d="M640 366 V354"/>
    <path d="M640 226 V214"/>
  </g>

  <text x="640" y="906" fill="#7f8793" font-size="12" text-anchor="middle">层级只表达职责依赖；实现中可合并为同一组件、线程或传输引擎</text>

  <g font-size="12">
    <line x1="335" y1="927" x2="373" y2="927" stroke="#a9916d" stroke-width="2" marker-end="url(#arrow-media)"/>
    <text x="385" y="932" fill="#a3aab4">媒体数据：向下发送</text>
    <line x1="563" y1="927" x2="601" y2="927" stroke="#8294a8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-control)"/>
    <text x="613" y="932" fill="#a3aab4">网络观测：向上反馈</text>
    <line x1="822" y1="927" x2="860" y2="927" stroke="#8294a8" stroke-width="2" marker-end="url(#arrow-control)"/>
    <text x="872" y="932" fill="#a3aab4">控制结果：向上生效</text>
  </g>
</svg>
