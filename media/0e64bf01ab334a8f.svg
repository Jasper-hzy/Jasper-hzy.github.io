<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 732" role="img" aria-labelledby="title desc"><title id="title">会话摘要合并</title><desc id="desc">三条消息全部保存。在三份摘要均未开始写入的前提下，只保留最后消息为 C、未读数为三的最新摘要；不丢弃原始消息和未读变化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#247267"/></marker></defs><rect width="640" height="732" rx="12" fill="#fcfdfc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="44" font-size="26" fill="#263b42" text-anchor="start" font-weight="600">连续收到三条消息：A → B → C</text><rect x="32" y="74" width="576" height="120" rx="10" fill="#edf5f2" stroke="#cadbd7"/><text x="56" y="111" font-size="25" fill="#247267" text-anchor="start" font-weight="600">消息记录 · 全部保存</text><text x="56" y="153" font-size="24" fill="#263b42" text-anchor="start" font-weight="400">消息 A　　消息 B　　消息 C</text><path d="M320 205V252" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="342" y="237" font-size="20" fill="#566b73" text-anchor="start" font-weight="400">计算摘要</text><rect x="32" y="267" width="576" height="222" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="56" y="305" font-size="25" fill="#315f82" text-anchor="start" font-weight="600">同一会话 · 待写摘要</text><text x="56" y="346" font-size="22" fill="#263b42" text-anchor="start" font-weight="400">收到 A：最后消息 A，未读数 1</text><text x="56" y="390" font-size="22" fill="#263b42" text-anchor="start" font-weight="400">收到 B：最后消息 B，未读数 2</text><text x="56" y="434" font-size="22" fill="#263b42" text-anchor="start" font-weight="400">收到 C：最后消息 C，未读数 3</text><text x="56" y="470" font-size="19" fill="#566b73" text-anchor="start" font-weight="400">前提：原未读数为 0，期间没有已读操作</text><path d="M320 500V552" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="342" y="533" font-size="20" fill="#566b73" text-anchor="start" font-weight="400">只写最新摘要</text><rect x="32" y="567" width="576" height="90" rx="10" fill="#edf5f2" stroke="#cadbd7"/><text x="56" y="602" font-size="25" fill="#247267" text-anchor="start" font-weight="600">摘要记录 · 提交一次</text><text x="56" y="636" font-size="23" fill="#263b42" text-anchor="start" font-weight="400">最后消息 C，未读数 3</text><text x="320" y="701" font-size="22" fill="#315f82" text-anchor="middle" font-weight="400">仅替换尚未开始写入的旧摘要</text></g></svg>
