<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 708" role="img" aria-labelledby="title desc"><title id="title">发送中断点与恢复动作</title><desc id="desc">本地提交前保留已保存草稿；本地提交后扫描待发；服务端接收后丢失确认则复用消息标识重试；本地确认事务中断时依靠原子状态继续处理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#247267"/></marker></defs><rect width="640" height="708" rx="12" fill="#fcfdfc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#263b42">
<text x="32" y="46" font-size="27" fill="#263b42" font-weight="600" text-anchor="start">发送中断后的恢复路径</text>
<rect x="32" y="72" width="576" height="124" rx="10" fill="#edf5f2" stroke="#cadbd7"/>
<text x="52" y="108" font-size="22" fill="#247267" font-weight="600" text-anchor="start">01</text>
<text x="98" y="108" font-size="24" fill="#263b42" font-weight="600" text-anchor="start">本地事务尚未提交</text>
<text x="52" y="145" font-size="22" fill="#566b73" font-weight="400" text-anchor="start">依据：最近已提交的草稿</text>
<text x="52" y="179" font-size="22" fill="#247267" font-weight="400" text-anchor="start">恢复：不确认发送，回到已保存内容</text>
<rect x="32" y="214" width="576" height="124" rx="10" fill="#f1f4f7" stroke="#cadbd7"/>
<text x="52" y="250" font-size="22" fill="#247267" font-weight="600" text-anchor="start">02</text>
<text x="98" y="250" font-size="24" fill="#263b42" font-weight="600" text-anchor="start">本地已提交，尚未发送</text>
<text x="52" y="287" font-size="22" fill="#566b73" font-weight="400" text-anchor="start">依据：消息记录 + 待发任务</text>
<text x="52" y="321" font-size="22" fill="#247267" font-weight="400" text-anchor="start">恢复：扫描待发任务，继续发送</text>
<rect x="32" y="356" width="576" height="124" rx="10" fill="#edf5f2" stroke="#cadbd7"/>
<text x="52" y="392" font-size="22" fill="#247267" font-weight="600" text-anchor="start">03</text>
<text x="98" y="392" font-size="24" fill="#263b42" font-weight="600" text-anchor="start">服务端已收到，回执丢失</text>
<text x="52" y="429" font-size="22" fill="#566b73" font-weight="400" text-anchor="start">依据：原消息 ID + 待发记录</text>
<text x="52" y="463" font-size="22" fill="#247267" font-weight="400" text-anchor="start">恢复：原 ID 重试，服务端归并同一消息</text>
<rect x="32" y="498" width="576" height="124" rx="10" fill="#f1f4f7" stroke="#cadbd7"/>
<text x="52" y="534" font-size="22" fill="#247267" font-weight="600" text-anchor="start">04</text>
<text x="98" y="534" font-size="24" fill="#263b42" font-weight="600" text-anchor="start">本地确认事务中断</text>
<text x="52" y="571" font-size="22" fill="#566b73" font-weight="400" text-anchor="start">依据：消息与任务的原子状态</text>
<text x="52" y="605" font-size="22" fill="#247267" font-weight="400" text-anchor="start">恢复：未提交则重试，已提交则完成</text>
<text x="320" y="681" font-size="22" fill="#315f82" font-weight="500" text-anchor="middle">摘要丢失 → 从已保存记录重建</text>
</g></svg>