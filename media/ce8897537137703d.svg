<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="620" viewBox="0 0 1520 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .text { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 13; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1520" height="620" fill="#f8fafc"/>
  <text x="760" y="48" text-anchor="middle" class="title">Profile 对首次启动与后续启动的影响</text>

  <rect x="38" y="83" width="1444" height="212" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="66" y="122" class="lane">没有预置 Profile：先运行、再学习、后优化</text>
  <rect class="box" x="75" y="164" width="190" height="76" fill="#ffffff" stroke="#94a3b8"/>
  <text x="170" y="198" text-anchor="middle" class="text">首次调用</text>
  <text x="170" y="222" text-anchor="middle" class="small">无可用 AOT</text>
  <rect class="box" x="340" y="164" width="190" height="76" fill="#fee2e2" stroke="#ef4444"/>
  <text x="435" y="198" text-anchor="middle" class="text">解释执行</text>
  <text x="435" y="222" text-anchor="middle" class="small">累积热度</text>
  <rect class="box" x="605" y="164" width="190" height="76" fill="#ffedd5" stroke="#f97316"/>
  <text x="700" y="198" text-anchor="middle" class="text">JIT 编译</text>
  <text x="700" y="222" text-anchor="middle" class="small">当前进程变快</text>
  <rect class="box" x="870" y="164" width="215" height="76" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="977" y="198" text-anchor="middle" class="text">保存 Runtime Profile</text>
  <text x="977" y="222" text-anchor="middle" class="small">记录真实热点</text>
  <rect class="box" x="1160" y="164" width="250" height="76" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1285" y="198" text-anchor="middle" class="text">后台 AOT → 后续启动</text>
  <text x="1285" y="222" text-anchor="middle" class="small">下次直接使用编译代码</text>
  <path class="line" d="M265 202 H340"/><path class="line" d="M530 202 H605"/>
  <path class="line" d="M795 202 H870"/><path class="line" d="M1085 202 H1160"/>

  <rect x="38" y="325" width="1444" height="212" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="66" y="364" class="lane">带 Baseline / Cloud Profile：运行前已经知道关键路径</text>
  <rect class="box" x="100" y="406" width="245" height="76" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="222" y="440" text-anchor="middle" class="text">预置 Profile</text>
  <text x="222" y="464" text-anchor="middle" class="small">启动与热点方法列表</text>
  <rect class="box" x="465" y="406" width="245" height="76" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="587" y="440" text-anchor="middle" class="text">安装 / 优化阶段 AOT</text>
  <text x="587" y="464" text-anchor="middle" class="small">提前生成机器码</text>
  <rect class="box" x="830" y="406" width="245" height="76" fill="#dcfce7" stroke="#22c55e"/>
  <text x="952" y="440" text-anchor="middle" class="text">用户首次启动</text>
  <text x="952" y="464" text-anchor="middle" class="small">关键方法直接执行 AOT</text>
  <rect class="box" x="1195" y="406" width="205" height="76" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1297" y="440" text-anchor="middle" class="text">减少预热成本</text>
  <text x="1297" y="464" text-anchor="middle" class="small">仍需优化其他启动工作</text>
  <path class="line" d="M345 444 H465"/><path class="line" d="M710 444 H830"/><path class="line" d="M1075 444 H1195"/>

  <text x="760" y="584" text-anchor="middle" class="small">Profile 只描述“编译谁”，机器码仍由 ART 编译链路生成</text>
</svg>
