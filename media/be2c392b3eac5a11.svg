<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 298" role="img" aria-labelledby="title desc"><title id="title">两鸡蛋问题的递减间隔与剩余预算</title><desc id="desc">前四次分别试十四、二十七、三十九、五十层。每次碎掉后的线性检查次数依次为十三、十二、十一、十，合计最多十四次。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59727a"/></marker></defs><rect width="680" height="298" fill="#fcfdfc"/><g font-family="Microsoft YaHei, sans-serif" fill="#263b42"><text x="84" y="31" text-anchor="middle" font-size="18" fill="#263b42">已用次数</text><text x="328" y="31" text-anchor="middle" font-size="18" fill="#263b42">本次楼层 / 前进间隔</text><text x="560" y="31" text-anchor="middle" font-size="18" fill="#263b42">若碎：最坏总次数</text><text x="82" y="82" text-anchor="middle" font-size="19" fill="#263b42">第 1 次</text><rect x="170" y="58" width="220" height="35" rx="3" fill="#cfe6e2"/><text x="182" y="82" text-anchor="start" font-size="19" fill="#263b42">14 层</text><text x="420" y="82" text-anchor="middle" font-size="19" fill="#263b42">+14</text><text x="561" y="82" text-anchor="middle" font-size="20" fill="#263b42">1 + 13 = 14</text><text x="82" y="134" text-anchor="middle" font-size="19" fill="#263b42">第 2 次</text><rect x="170" y="110" width="205" height="35" rx="3" fill="#d9ebe7"/><text x="182" y="134" text-anchor="start" font-size="19" fill="#263b42">27 层</text><text x="420" y="134" text-anchor="middle" font-size="19" fill="#263b42">+13</text><text x="561" y="134" text-anchor="middle" font-size="20" fill="#263b42">2 + 12 = 14</text><text x="82" y="186" text-anchor="middle" font-size="19" fill="#263b42">第 3 次</text><rect x="170" y="162" width="190" height="35" rx="3" fill="#e3efec"/><text x="182" y="186" text-anchor="start" font-size="19" fill="#263b42">39 层</text><text x="420" y="186" text-anchor="middle" font-size="19" fill="#263b42">+12</text><text x="561" y="186" text-anchor="middle" font-size="20" fill="#263b42">3 + 11 = 14</text><text x="82" y="238" text-anchor="middle" font-size="19" fill="#263b42">第 4 次</text><rect x="170" y="214" width="175" height="35" rx="3" fill="#ebf3f0"/><text x="182" y="238" text-anchor="start" font-size="19" fill="#263b42">50 层</text><text x="420" y="238" text-anchor="middle" font-size="19" fill="#263b42">+11</text><text x="561" y="238" text-anchor="middle" font-size="20" fill="#263b42">4 + 10 = 14</text><text x="340" y="282" text-anchor="middle" font-size="17" fill="#566b73">每多用一次机会，下一段最多少跨一层。</text></g></svg>