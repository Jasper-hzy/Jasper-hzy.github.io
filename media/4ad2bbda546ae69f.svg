<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Android 热更新实现原理图</title><desc id="desc">展示 Dex 热修、方法插桩、资源热修、Native 热修与补丁下发治理链路。</desc><defs><style>.bg{fill:#fffdf8}.title{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.sub{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#526174}.box{fill:#fff;stroke:#475569;stroke-width:1.5;rx:12}.head{fill:#e9f5ff;stroke:#6aa6d8}.risk{fill:#fff7ed;stroke:#fb923c}.label{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.txt{font:12.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#4b5563}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs><rect class="bg" width="1080" height="520"/><text class="title" x="44" y="44">Android 热更新：补丁级止血，不是常规发布</text><text class="sub" x="44" y="72">小范围修复 + 强校验 + 灰度 + 可回滚。</text><rect class="head" x="50" y="120" width="180" height="70" rx="12"/><text class="label" x="140" y="148" text-anchor="middle">补丁配置</text><text class="txt" x="140" y="170" text-anchor="middle">版本 / ABI / 灰度</text><rect class="head" x="285" y="120" width="180" height="70" rx="12"/><text class="label" x="375" y="148" text-anchor="middle">下载和校验</text><text class="txt" x="375" y="170" text-anchor="middle">签名 / hash / 范围</text><rect class="head" x="520" y="120" width="180" height="70" rx="12"/><text class="label" x="610" y="148" text-anchor="middle">安装</text><text class="txt" x="610" y="170" text-anchor="middle">私有目录 / 状态记录</text><rect class="head" x="755" y="120" width="230" height="70" rx="12"/><text class="label" x="870" y="148" text-anchor="middle">生效和监控</text><text class="txt" x="870" y="170" text-anchor="middle">命中率 / crash / 回滚</text><path class="arrow" d="M230 155 L285 155"/><path class="arrow" d="M465 155 L520 155"/><path class="arrow" d="M700 155 L755 155"/><rect class="box" x="60" y="260" width="210" height="90" rx="12"/><text class="label" x="165" y="287" text-anchor="middle">Dex 热修</text><text class="txt" x="165" y="310" text-anchor="middle">dexElements 前插</text><text class="txt" x="165" y="329" text-anchor="middle">冷启动前类替换</text><rect class="box" x="310" y="260" width="210" height="90" rx="12"/><text class="label" x="415" y="287" text-anchor="middle">方法插桩</text><text class="txt" x="415" y="310" text-anchor="middle">PatchProxy 分发</text><text class="txt" x="415" y="329" text-anchor="middle">小范围逻辑止血</text><rect class="box" x="560" y="260" width="210" height="90" rx="12"/><text class="label" x="665" y="287" text-anchor="middle">资源热修</text><text class="txt" x="665" y="310" text-anchor="middle">AssetManager / Resources</text><text class="txt" x="665" y="329" text-anchor="middle">文案、图片、布局</text><rect class="box" x="810" y="260" width="210" height="90" rx="12"/><text class="label" x="915" y="287" text-anchor="middle">Native 热修</text><text class="txt" x="915" y="310" text-anchor="middle">替换 so 路径</text><text class="txt" x="915" y="329" text-anchor="middle">通常下次启动生效</text><rect class="risk" x="70" y="410" width="940" height="54" rx="12"/><text class="txt" x="92" y="436">边界：已加载类、构造函数、字段结构、复杂资源缓存、已加载 so 都不是热更新适合强修的对象。</text><text class="txt" x="92" y="456">治理：灰度、禁用、bad patch 标记、回滚、patchId 维度监控必须同时存在。</text></svg>
