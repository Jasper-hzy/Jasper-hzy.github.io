<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="title desc">
  <title id="title">Android 容器抓屏路径对比</title>
  <desc id="desc">对比 MediaProjection、JNI VirtualDisplay、主屏截图、厂商 HWC 接口，以及 OES、YUV、编码直通三种送编码路径。</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526174}.lane{fill:#f8fafc;stroke:#d1d9e6;stroke-width:1.4}.source{fill:#e9f5ff;stroke:#6aa6d8}.capture{fill:#fff4df;stroke:#d6a24a}.encode{fill:#eef8ed;stroke:#71a96d}.box{fill:#fff;stroke:#435166;stroke-width:1.5;rx:12}.best{fill:#ecfdf5;stroke:#22c55e}.warn{fill:#fff7ed;stroke:#fb923c}.bad{fill:#fff1f2;stroke:#fb7185}.label{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.txt{font:12.3px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}.small{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c8796;stroke-width:1.8;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow2)}.green{stroke:#16a34a;stroke-width:2.2;fill:none;marker-end:url(#arrow3)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c8796"/></marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect class="bg" width="1420" height="760"/>
  <text class="title" x="44" y="44">Android 容器抓屏：抓到画面只是第一步，关键是怎么送编码</text>
  <text class="sub" x="44" y="72">从左到右：远端游戏出帧 -> 抓屏入口 -> 编码前处理 -> MediaCodec 硬编。</text>

  <rect class="lane source" x="48" y="125" width="255" height="485" rx="18"/>
  <text class="label" x="76" y="158">画面来源</text>
  <rect class="box" x="84" y="230" width="180" height="68" rx="12"/><text class="label" x="174" y="258" text-anchor="middle">游戏 App</text><text class="txt" x="174" y="281" text-anchor="middle">Surface / Layer</text>
  <rect class="box" x="84" y="365" width="180" height="68" rx="12"/><text class="label" x="174" y="393" text-anchor="middle">SurfaceFlinger</text><text class="txt" x="174" y="416" text-anchor="middle">合成输出</text>

  <rect class="lane capture" x="350" y="125" width="420" height="485" rx="18"/>
  <text class="label" x="378" y="158">抓屏入口</text>
  <rect class="box warn" x="385" y="205" width="155" height="76" rx="12"/><text class="label" x="462" y="232" text-anchor="middle">MediaProjection</text><text class="txt" x="462" y="255" text-anchor="middle">系统 API</text><text class="txt" x="462" y="273" text-anchor="middle">有权限提示</text>
  <rect class="box best" x="575" y="205" width="155" height="76" rx="12"/><text class="label" x="652" y="232" text-anchor="middle">JNI VirtualDisplay</text><text class="txt" x="652" y="255" text-anchor="middle">类似 screenrecord</text><text class="txt" x="652" y="273" text-anchor="middle">容器内常用</text>
  <rect class="box bad" x="385" y="335" width="155" height="76" rx="12"/><text class="label" x="462" y="362" text-anchor="middle">主屏截图</text><text class="txt" x="462" y="385" text-anchor="middle">screencap 路径</text><text class="txt" x="462" y="403" text-anchor="middle">低频诊断</text>
  <rect class="box best" x="575" y="335" width="155" height="76" rx="12"/><text class="label" x="652" y="362" text-anchor="middle">厂商 HWC</text><text class="txt" x="652" y="385" text-anchor="middle">链路短</text><text class="txt" x="652" y="403" text-anchor="middle">适配成本高</text>
  <rect class="box" x="480" y="475" width="155" height="64" rx="12"/><text class="label" x="557" y="502" text-anchor="middle">VirtualDisplay</text><text class="txt" x="557" y="525" text-anchor="middle">输出到目标 Surface</text>

  <rect class="lane encode" x="820" y="125" width="535" height="485" rx="18"/>
  <text class="label" x="848" y="158">送编码路径</text>
  <rect class="box bad" x="860" y="205" width="175" height="86" rx="12"/><text class="label" x="947" y="234" text-anchor="middle">OES -> YUV</text><text class="txt" x="947" y="258" text-anchor="middle">GPU 采样 / CPU Buffer</text><text class="txt" x="947" y="276" text-anchor="middle">兼容好但链路长</text>
  <rect class="box warn" x="1065" y="205" width="175" height="86" rx="12"/><text class="label" x="1152" y="234" text-anchor="middle">OES 纹理路径</text><text class="txt" x="1152" y="258" text-anchor="middle">SurfaceTexture + GL draw</text><text class="txt" x="1152" y="276" text-anchor="middle">约省 2ms</text>
  <rect class="box best" x="960" y="355" width="185" height="86" rx="12"/><text class="label" x="1052" y="384" text-anchor="middle">编码直通</text><text class="txt" x="1052" y="408" text-anchor="middle">直接写编码 Surface</text><text class="txt" x="1052" y="426" text-anchor="middle">理论最短路径</text>
  <rect class="box" x="1185" y="355" width="130" height="86" rx="12"/><text class="label" x="1250" y="384" text-anchor="middle">MediaCodec</text><text class="txt" x="1250" y="408" text-anchor="middle">硬件编码</text>

  <path class="arrow" d="M174 298 L174 365"/><path class="arrow" d="M264 399 C330 399,340 243,385 243"/><path class="arrow" d="M264 399 C335 399,505 243,575 243"/><path class="dash" d="M264 399 L385 373"/><path class="arrow" d="M730 373 C775 410,805 398,860 248"/><path class="arrow" d="M635 507 C760 507,780 248,860 248"/><path class="arrow" d="M1035 248 L1065 248"/><path class="arrow" d="M1240 248 C1275 280,1268 330,1250 355"/>
  <path class="green" d="M635 507 C780 535,900 420,960 398"/><path class="green" d="M1145 398 L1185 398"/>

  <rect class="box" x="74" y="655" width="1250" height="52" rx="14"/><text class="sub" x="100" y="687">判断方案优劣：不要只看抓屏 API，要看是否多了一次格式转换、CPU/GPU 往返、SurfaceTexture 队列、OpenGL draw 或编码器背压。</text>
</svg>
