<svg xmlns="http://www.w3.org/2000/svg" width="800" height="880" viewBox="0 0 800 880" role="img" aria-labelledby="title desc"><title id="title">lynx-loading-diagnosis.svg</title><desc id="desc">首次内容、关键内容与容器可见性对应不同定位入口；资源、接口和运行时异常需要核对时间与影响范围。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#247267"/></marker></defs><rect width="800" height="880" rx="16" fill="#f7faf9"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="48" fill="#263b42" font-size="31" text-anchor="start" font-weight="600">按完成阶段定位</text>
<text x="32" y="87" fill="#647779" font-size="23" text-anchor="start" font-weight="400">先确认页面前台可见，再检查记录是否完整</text>
<rect x="32" y="133" width="736" height="190" rx="12" fill="#fff" stroke="#cbdcd8"/>
<text x="59" y="179" fill="#247267" font-size="28" text-anchor="start" font-weight="600">1. 首次内容未完成</text>
<text x="59" y="232" fill="#263b42" font-size="26" text-anchor="start" font-weight="400">包未就绪：检查资源尝试记录</text>
<text x="59" y="273" fill="#263b42" font-size="26" text-anchor="start" font-weight="400">包已就绪：检查加载与渲染事件</text>
<rect x="32" y="353" width="736" height="190" rx="12" fill="#fff" stroke="#cbdcd8"/>
<text x="59" y="399" fill="#247267" font-size="28" text-anchor="start" font-weight="600">2. 首次内容已完成</text>
<text x="59" y="452" fill="#263b42" font-size="26" text-anchor="start" font-weight="400">关键数据未就绪：检查接口</text>
<text x="59" y="493" fill="#263b42" font-size="26" text-anchor="start" font-weight="400">数据已提交：检查更新与标记</text>
<rect x="32" y="573" width="736" height="190" rx="12" fill="#fff" stroke="#cbdcd8"/>
<text x="59" y="619" fill="#247267" font-size="28" text-anchor="start" font-weight="600">3. 已有渲染记录仍空白</text>
<text x="59" y="672" fill="#263b42" font-size="26" text-anchor="start" font-weight="400">检查容器尺寸、遮挡与窗口归属</text>
<text x="59" y="713" fill="#263b42" font-size="26" text-anchor="start" font-weight="400">核对图片状态和空白检测证据</text>
<text x="400" y="838" fill="#647779" font-size="23" text-anchor="middle" font-weight="400">错误事件需核对时间与影响范围，不能直接当作原因</text></g></svg>
