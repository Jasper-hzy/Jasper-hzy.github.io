<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="980" viewBox="0 0 1520 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .text { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .box { stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1520" height="980" fill="#f8fafc"/>
  <text x="760" y="48" text-anchor="middle" class="title">ART：JIT、Profile 与 AOT 的运行优化闭环</text>

  <rect x="35" y="78" width="1450" height="190" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="112" class="lane">安装 / 更新阶段</text>
  <rect class="box" x="90" y="145" width="210" height="78" fill="#ffffff"/>
  <text x="195" y="178" text-anchor="middle" class="code">APK / DEX</text>
  <text x="195" y="204" text-anchor="middle" class="small">字节码</text>
  <rect class="box" x="405" y="132" width="270" height="104" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="540" y="169" text-anchor="middle" class="text">Baseline / Cloud Profile</text>
  <text x="540" y="198" text-anchor="middle" class="small">启动与热点类、方法列表</text>
  <rect class="box" x="805" y="145" width="240" height="78" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="925" y="178" text-anchor="middle" class="code">dexopt / dex2oat</text>
  <text x="925" y="204" text-anchor="middle" class="small">按 Profile 选择编译目标</text>
  <rect class="box" x="1165" y="145" width="245" height="78" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1287" y="178" text-anchor="middle" class="text">AOT 编译产物</text>
  <text x="1287" y="204" text-anchor="middle" class="small">可跨进程启动复用</text>
  <path class="line" d="M300 184 H405"/>
  <path class="line" d="M675 184 H805"/>
  <path class="line" d="M1045 184 H1165"/>

  <rect x="35" y="296" width="1450" height="390" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="332" class="lane">App 运行阶段：一次方法调用的执行选择</text>
  <rect class="box" x="90" y="384" width="220" height="78" fill="#f1f5f9"/>
  <text x="200" y="418" text-anchor="middle" class="text">调用目标方法</text>
  <text x="200" y="444" text-anchor="middle" class="small">Java / Kotlin → DEX</text>
  <rect class="box" x="405" y="370" width="245" height="106" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="527" y="408" text-anchor="middle" class="text">有可用 AOT 代码？</text>
  <text x="527" y="438" text-anchor="middle" class="small">检查方法执行入口</text>
  <rect class="box" x="775" y="340" width="265" height="82" fill="#dcfce7" stroke="#22c55e"/>
  <text x="907" y="375" text-anchor="middle" class="text">直接执行 AOT 机器码</text>
  <text x="907" y="401" text-anchor="middle" class="small">启动时无需现场编译</text>
  <rect class="box" x="775" y="488" width="265" height="82" fill="#fee2e2" stroke="#ef4444"/>
  <text x="907" y="523" text-anchor="middle" class="text">Interpreter 解释执行</text>
  <text x="907" y="549" text-anchor="middle" class="small">同时累积方法热度</text>
  <rect class="box" x="1155" y="488" width="260" height="82" fill="#ffedd5" stroke="#f97316"/>
  <text x="1285" y="523" text-anchor="middle" class="text">JIT 编译热点方法</text>
  <text x="1285" y="549" text-anchor="middle" class="small">写入进程 JIT Code Cache</text>
  <rect class="box" x="1155" y="603" width="260" height="58" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1285" y="638" text-anchor="middle" class="text">记录 Runtime Profile</text>
  <path class="line" d="M310 423 H405"/>
  <path class="line" d="M650 405 C705 405 712 381 775 381"/>
  <text x="703" y="383" class="small">是</text>
  <path class="line" d="M650 441 C705 441 712 529 775 529"/>
  <text x="704" y="478" class="small">否</text>
  <path class="line" d="M1040 529 H1155"/>
  <text x="1097" y="514" text-anchor="middle" class="small">达到热点阈值</text>
  <path class="line" d="M1285 570 V603"/>

  <rect x="35" y="714" width="940" height="224" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="62" y="750" class="lane">后台优化与下次启动</text>
  <rect class="box" x="90" y="799" width="235" height="78" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="207" y="833" text-anchor="middle" class="text">Runtime Profile</text>
  <text x="207" y="859" text-anchor="middle" class="small">真实运行产生的热点</text>
  <rect class="box" x="405" y="799" width="235" height="78" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="522" y="833" text-anchor="middle" class="code">后台 dexopt</text>
  <text x="522" y="859" text-anchor="middle" class="small">典型为空闲、充电时</text>
  <rect class="box" x="720" y="799" width="205" height="78" fill="#dcfce7" stroke="#22c55e"/>
  <text x="822" y="833" text-anchor="middle" class="text">下次启动</text>
  <text x="822" y="859" text-anchor="middle" class="small">更多方法直接 AOT</text>
  <path class="line" d="M325 838 H405"/>
  <path class="line" d="M640 838 H720"/>
  <path class="dash" d="M1285 661 C1285 704 207 694 207 799"/>

  <rect x="1005" y="714" width="480" height="224" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="1032" y="750" class="lane">并行的另一条链路：GC</text>
  <text x="1055" y="799" class="text">对象分配增多</text>
  <text x="1055" y="838" class="text">→ 堆增长 / 达到触发条件</text>
  <text x="1055" y="877" class="text">→ 并发回收与必要暂停</text>
  <text x="1055" y="916" class="small">影响 CPU、主线程停顿和首帧，但不决定 JIT / AOT</text>
</svg>
