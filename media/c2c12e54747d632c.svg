<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1144" viewBox="0 0 800 1144" role="img" aria-labelledby="title desc"><title id="title">lynx-runtime-architecture.svg</title><desc id="desc">构建页面包后由宿主加载；主线程执行首屏和界面更新，后台处理业务变化；原生模块连接宿主能力。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#247267"/></marker></defs><rect width="800" height="1144" rx="16" fill="#f7faf9"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="48" fill="#263b42" font-size="31" text-anchor="start" font-weight="600">原生应用内嵌 Lynx 页面</text>
