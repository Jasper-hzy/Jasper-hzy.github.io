<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc">
  <title id="title">Android 一帧渲染主链路</title>
  <desc id="desc">展示从业务刷新请求到 ViewRootImpl、Choreographer、RenderThread、Surface、SurfaceFlinger 和最终屏幕输出的流程。</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526174}.lane{fill:#f8fafc;stroke:#d1d9e6;stroke-width:1.4}.app{fill:#e9f5ff;stroke:#6aa6d8}.rt{fill:#eef8ed;stroke:#71a96d}.sf{fill:#fff4df;stroke:#d6a24a}.hw{fill:#f5f3ff;stroke:#8b7bd8}.box{fill:#fff;stroke:#435166;stroke-width:1.5;rx:12}.label{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.txt{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#607080}.num{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.circle{fill:#334155}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c8796;stroke-width:1.8;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow2)}.vsync{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}.note{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c8796"/></marker>
  </defs>
  <rect class="bg" width="1320" height="700"/>
  <text class="title" x="44" y="44">Android 一帧渲染主链路</text>
  <text class="sub" x="44" y="72">应用负责生产窗口 buffer，SurfaceFlinger 负责收集 Layer 并合成到显示设备。</text>

  <rect class="lane app" x="40" y="110" width="500" height="365" rx="18"/>
  <text class="label" x="66" y="140">App 主线程：调度和记录 View 绘制</text>
  <rect class="lane rt" x="575" y="110" width="260" height="365" rx="18"/>
  <text class="label" x="601" y="140">RenderThread：执行绘制命令</text>
  <rect class="lane sf" x="870" y="110" width="255" height="365" rx="18"/>
  <text class="label" x="896" y="140">SurfaceFlinger：图层合成</text>
  <rect class="lane hw" x="1160" y="110" width="120" height="365" rx="18"/>
  <text class="label" x="1184" y="140">Display</text>

  <g transform="translate(70,190)"><rect class="box" width="170" height="64" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">1</text><text class="label" x="50" y="25">刷新请求</text><text class="txt" x="50" y="47">invalidate / requestLayout</text></g>
  <g transform="translate(310,190)"><rect class="box" width="190" height="64" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">2</text><text class="label" x="50" y="25">ViewRootImpl</text><text class="txt" x="50" y="47">scheduleTraversals</text></g>
  <g transform="translate(310,305)"><rect class="box vsync" width="190" height="64" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">3</text><text class="label" x="50" y="25">Choreographer</text><text class="txt" x="50" y="47">等下一次 VSYNC</text></g>
  <g transform="translate(70,305)"><rect class="box" width="170" height="64" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">4</text><text class="label" x="50" y="25">doTraversal</text><text class="txt" x="50" y="47">measure / layout / draw</text></g>
  <g transform="translate(70,420)"><rect class="box" width="430" height="64" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">5</text><text class="label" x="50" y="25">RenderNode</text><text class="txt" x="50" y="47">主线程记录绘制命令，不等于已经上屏</text></g>
  <g transform="translate(605,260)"><rect class="box" width="200" height="74" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">6</text><text class="label" x="50" y="25">执行渲染命令</text><text class="txt" x="50" y="47">OpenGL / Vulkan</text><text class="txt" x="50" y="64">写入 GraphicBuffer</text></g>
  <g transform="translate(605,380)"><rect class="box" width="200" height="64" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">7</text><text class="label" x="50" y="25">Surface</text><text class="txt" x="50" y="47">queueBuffer</text></g>
  <g transform="translate(900,230)"><rect class="box" width="195" height="74" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">8</text><text class="label" x="50" y="25">Layer 合成</text><text class="txt" x="50" y="47">窗口 / SurfaceView</text><text class="txt" x="50" y="64">状态栏 / 导航栏</text></g>
  <g transform="translate(900,360)"><rect class="box" width="195" height="64" rx="12"/><circle class="circle" cx="22" cy="22" r="13"/><text class="num" x="22" y="26" text-anchor="middle">9</text><text class="label" x="50" y="25">HWC / GPU</text><text class="txt" x="50" y="47">硬件或 GPU 合成</text></g>
  <g transform="translate(1180,275)"><rect class="box" width="78" height="120" rx="12"/><text class="label" x="39" y="54" text-anchor="middle">屏幕</text><text class="txt" x="39" y="78" text-anchor="middle">扫描</text><text class="txt" x="39" y="96" text-anchor="middle">输出</text></g>

  <path class="arrow" d="M240 222 L310 222"/><path class="arrow" d="M405 254 L405 305"/><path class="arrow" d="M310 337 L240 337"/><path class="arrow" d="M155 369 L155 420"/><path class="arrow" d="M500 452 C560 452,565 300,605 300"/><path class="arrow" d="M705 334 L705 380"/><path class="arrow" d="M805 412 C850 412,850 267,900 267"/><path class="arrow" d="M998 304 L998 360"/><path class="arrow" d="M1095 392 C1135 392,1148 335,1180 335"/>
  <path class="dash" d="M405 305 C480 230,540 190,605 260"/><text class="small" x="515" y="220">VSYNC 节奏约束整条链路</text>

  <rect class="note" x="54" y="540" width="1212" height="76" rx="14"/>
  <text class="sub" x="78" y="568">看卡顿时不要只看 draw：主线程消息、布局复杂度、RenderThread、GPU、BufferQueue、SurfaceFlinger/HWC 都可能让一帧错过显示时机。</text>
  <text class="sub" x="78" y="594">云游戏的抓屏、解码上屏和渲染直通，本质上都是在调整 Surface / Buffer / 合成这段链路。</text>
</svg>
