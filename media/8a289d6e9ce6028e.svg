<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc"><title id="title">Tinker Dex 插入热修流程图</title><desc id="desc">展示 Tinker 从补丁 dex 校验、优化到反射插入宿主 ClassLoader dexElements 的流程。</desc><defs><style>.bg{fill:#fffdf8}.title{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.sub{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#526174}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:18}.box{fill:#fff;stroke:#475569;stroke-width:1.5;rx:12}.api{fill:#fff7ed;stroke:#fb923c}.ok{fill:#eef8ed;stroke:#71a96d}.label{font:700 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.txt{font:12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#4b5563}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow2)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs><rect class="bg" width="1180" height="620"/><text class="title" x="44" y="44">Dex 插入热修：以 Tinker 主链路理解</text><text class="sub" x="44" y="72">关键：patch dex 先生成 elements，再插到宿主 BaseDexClassLoader.pathList.dexElements 前面。</text><rect class="lane" x="44" y="110" width="1092" height="405" rx="18"/><rect class="box" x="80" y="165" width="190" height="70" rx="12"/><text class="label" x="175" y="190" text-anchor="middle">补丁包校验</text><text class="txt" x="175" y="211" text-anchor="middle">版本 / md5 / dex 列表</text><rect class="box" x="315" y="165" width="190" height="70" rx="12"/><text class="label" x="410" y="190" text-anchor="middle">TinkerDexLoader</text><text class="txt" x="410" y="211" text-anchor="middle">loadTinkerJars</text><rect class="box" x="550" y="165" width="190" height="70" rx="12"/><text class="label" x="645" y="190" text-anchor="middle">Dex 优化</text><text class="txt" x="645" y="211" text-anchor="middle">TinkerDexOptimizer</text><rect class="box" x="785" y="165" width="250" height="70" rx="12"/><text class="label" x="910" y="190" text-anchor="middle">SystemClassLoaderAdder</text><text class="txt" x="910" y="211" text-anchor="middle">installDexes</text><rect class="api" x="150" y="330" width="245" height="88" rx="12"/><text class="label" x="272" y="356" text-anchor="middle">反射宿主 ClassLoader</text><text class="txt" x="272" y="377" text-anchor="middle">loader.pathList</text><text class="txt" x="272" y="394" text-anchor="middle">DexPathList.dexElements</text><rect class="api" x="468" y="330" width="245" height="88" rx="12"/><text class="label" x="590" y="356" text-anchor="middle">生成 patch elements</text><text class="txt" x="590" y="377" text-anchor="middle">makePathElements</text><text class="txt" x="590" y="394" text-anchor="middle">makeDexElements</text><rect class="ok" x="786" y="330" width="245" height="88" rx="12"/><text class="label" x="908" y="356" text-anchor="middle">写回 dexElements</text><text class="txt" x="908" y="377" text-anchor="middle">[patchElements, hostElements]</text><text class="txt" x="908" y="394" text-anchor="middle">补丁类优先命中</text><path class="arrow" d="M270 200 L315 200"/><path class="arrow" d="M505 200 L550 200"/><path class="arrow" d="M740 200 L785 200"/><path class="arrow" d="M910 235 C910 285,908 300,908 330"/><path class="arrow" d="M785 200 C620 255,360 260,272 330"/><path class="arrow" d="M395 374 L468 374"/><path class="arrow" d="M713 374 L786 374"/><path class="dash" d="M590 418 C560 470,320 470,272 418"/><text class="txt" x="392" y="488">不同 Android 版本 makePathElements / makeDexElements 签名不同</text><rect x="70" y="548" width="1040" height="42" rx="12" fill="#fff7ed" stroke="#fdba74"/><text class="txt" x="92" y="574">边界：只能影响未加载类；必须尽早加载；类结构、Kotlin inline、ART 校验和 MultiDex 都可能出问题。</text></svg>
