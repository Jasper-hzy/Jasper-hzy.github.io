<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">Mira 插件资源注入到底层系统 API 流程图</title><desc id="desc">展示插件加载时从 NewMiraResourcesManager.addAssetPath 到 ResourcesManager、ResourcesImpl、AssetManager、LoadedApk 的底层调用点。</desc><defs><style>.bg{fill:#fffdf8}.title{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.sub{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#526174}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:18}.mira{fill:#e9f5ff;stroke:#6aa6d8}.fw{fill:#fff4df;stroke:#d6a24a}.cache{fill:#eef8ed;stroke:#71a96d}.box{fill:#fff;stroke:#475569;stroke-width:1.5;rx:12}.api{fill:#fff7ed;stroke:#fb923c}.label{font:700 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.txt{font:12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#4b5563}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow2)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs><rect class="bg" width="1280" height="760"/><text class="title" x="44" y="44">Mira 插件资源注入：从插件加载到系统 Resources API</text><text class="sub" x="44" y="72">主线：插件 sourceDir 进入路径表，ResourcesManager 重建 ResourcesImpl，LoadedApk 和 Activity Resources 被修正。</text><rect class="lane mira" x="40" y="110" width="370" height="560" rx="18"/><text class="label" x="66" y="140">Mira 插件加载层</text><rect class="lane fw" x="455" y="110" width="370" height="560" rx="18"/><text class="label" x="481" y="140">Android Framework 资源层</text><rect class="lane cache" x="870" y="110" width="370" height="560" rx="18"/><text class="label" x="896" y="140">被更新的运行时对象</text><rect class="box" x="80" y="180" width="285" height="56" rx="12"/><text class="label" x="222" y="203" text-anchor="middle">PluginLoader.launchPluginApp</text><text class="txt" x="222" y="224" text-anchor="middle">拿 pluginAppInfo.sourceDir</text><rect class="box" x="80" y="270" width="285" height="64" rx="12"/><text class="label" x="222" y="294" text-anchor="middle">NewMiraResourcesManager.addAssetPath</text><text class="txt" x="222" y="315" text-anchor="middle">mSplitPathMaps[pluginPkg] = plugin.apk</text><rect class="box" x="80" y="372" width="285" height="64" rx="12"/><text class="label" x="222" y="396" text-anchor="middle">installLoadedApk(pluginLoadedApk)</text><text class="txt" x="222" y="417" text-anchor="middle">给插件包构建 Resources</text><rect class="box" x="80" y="505" width="285" height="78" rx="12"/><text class="label" x="222" y="529" text-anchor="middle">callActivityOnCreate 兜底</text><text class="txt" x="222" y="550" text-anchor="middle">updateActivityResources</text><text class="txt" x="222" y="567" text-anchor="middle">updatePluginActivityTheme</text><rect class="api" x="495" y="165" width="290" height="70" rx="12"/><text class="label" x="640" y="190" text-anchor="middle">ResourcesManagerExt.appendSplitAsset</text><text class="txt" x="640" y="211" text-anchor="middle">把所有资源路径追加到 ResourcesManager</text><rect class="api" x="495" y="265" width="290" height="82" rx="12"/><text class="label" x="640" y="290" text-anchor="middle">ResourcesKey / ResourcesImpl</text><text class="txt" x="640" y="311" text-anchor="middle">findKeyForResourceImplLocked</text><text class="txt" x="640" y="328" text-anchor="middle">findOrCreateResourcesImplForKeyLocked</text><rect class="api" x="495" y="380" width="290" height="78" rx="12"/><text class="label" x="640" y="404" text-anchor="middle">AssetManager</text><text class="txt" x="640" y="425" text-anchor="middle">addAssetPath(plugin.apk)</text><text class="txt" x="640" y="442" text-anchor="middle">旧版本 addAssetPathNative + StringBlock</text><rect class="api" x="495" y="505" width="290" height="78" rx="12"/><text class="label" x="640" y="529" text-anchor="middle">LoadedApk</text><text class="txt" x="640" y="550" text-anchor="middle">mResDir / mSplitResDirs / overlay</text><text class="txt" x="640" y="567" text-anchor="middle">LoadedApk.getResources()</text><rect class="box" x="910" y="170" width="285" height="70" rx="12"/><text class="label" x="1052" y="195" text-anchor="middle">Application Resources</text><text class="txt" x="1052" y="216" text-anchor="middle">application.getResources 可见插件路径</text><rect class="box" x="910" y="275" width="285" height="70" rx="12"/><text class="label" x="1052" y="300" text-anchor="middle">已有 Activity Resources</text><text class="txt" x="1052" y="321" text-anchor="middle">遍历 ActivityThread.mActivities 更新</text><rect class="box" x="910" y="395" width="285" height="70" rx="12"/><text class="label" x="1052" y="420" text-anchor="middle">Plugin LoadedApk Resources</text><text class="txt" x="1052" y="441" text-anchor="middle">插件包自己的 Resources 环境</text><rect class="box" x="910" y="520" width="285" height="78" rx="12"/><text class="label" x="1052" y="544" text-anchor="middle">Activity Theme / 缓存</text><text class="txt" x="1052" y="565" text-anchor="middle">Theme、Tint、AppCompat、Config</text><text class="txt" x="1052" y="582" text-anchor="middle">onCreate 前后兜底修正</text><path class="arrow" d="M222 236 L222 270"/><path class="arrow" d="M365 302 C410 275,450 210,495 200"/><path class="arrow" d="M640 235 L640 265"/><path class="arrow" d="M640 347 L640 380"/><path class="arrow" d="M365 404 L495 544"/><path class="arrow" d="M785 200 L910 205"/><path class="arrow" d="M785 306 L910 310"/><path class="arrow" d="M785 544 L910 430"/><path class="arrow" d="M365 544 L910 559"/><path class="dash" d="M1052 240 L1052 275"/><path class="dash" d="M1052 345 L1052 395"/><rect x="62" y="700" width="1155" height="36" rx="10" fill="#fff7ed" stroke="#fdba74"/><text class="txt" x="82" y="723">关键：资源 ID 要先在构建期稳定；运行期资源注入解决的是“资源表路径和 Resources 缓存能不能被当前进程看到”。</text></svg>
