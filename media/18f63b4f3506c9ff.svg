<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1094" viewBox="0 0 800 1094" role="img" aria-labelledby="title desc"><title id="title">lynx-render-sequence.svg</title><desc id="desc">时间向下：主线程构建首屏与后台初始化并行；后台处理后续数据并提交变更，由主线程更新布局与绘制。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#247267"/></marker></defs><rect width="800" height="1094" rx="16" fill="#f7faf9"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="48" fill="#263b42" font-size="31" text-anchor="start" font-weight="600">首屏与后续更新</text>
<text x="32" y="87" fill="#647779" font-size="23" text-anchor="start" font-weight="400">Lynx 双线程；后续更新以 ReactLynx 为例</text>
<text x="230" y="151" fill="#247267" font-size="29" text-anchor="middle" font-weight="600">主线程</text>
<text x="585" y="151" fill="#315f82" font-size="29" text-anchor="middle" font-weight="600">后台线程</text>
<path d="M230 173V960" fill="none" stroke="#bdceca" stroke-width="2.5" stroke-dasharray="7 7"/>
<path d="M585 173V960" fill="none" stroke="#bdceca" stroke-width="2.5" stroke-dasharray="7 7"/>
<text x="400" y="206" fill="#647779" font-size="24" text-anchor="middle" font-weight="400">页面包与初始数据就绪</text>
<path d="M230 224H585" fill="none" stroke="#247267" stroke-width="2.5"/>
<rect x="80" y="250" width="300" height="100" rx="12" fill="#fff" stroke="#cbdcd8"/>
<text x="230" y="291" fill="#247267" font-size="28" text-anchor="middle" font-weight="600">构建首屏</text>
<text x="230" y="327" fill="#263b42" font-size="24" text-anchor="middle" font-weight="400">执行首屏脚本</text>
<rect x="435" y="250" width="300" height="100" rx="12" fill="#edf3f7" stroke="#cbdcd8"/>
<text x="585" y="309" fill="#315f82" font-size="28" text-anchor="middle" font-weight="600">初始化页面逻辑</text>
<path d="M230 350V403" fill="none" stroke="#247267" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="80" y="415" width="300" height="100" rx="12" fill="#fff" stroke="#cbdcd8"/>
<text x="230" y="474" fill="#247267" font-size="28" text-anchor="middle" font-weight="600">布局与首次绘制</text>
<text x="585" y="441" fill="#315f82" font-size="26" text-anchor="middle" font-weight="400">与首屏并行</text>
<text x="585" y="480" fill="#647779" font-size="23" text-anchor="middle" font-weight="400">不等首次绘制才启动</text>
<rect x="435" y="561" width="300" height="100" rx="12" fill="#edf3f7" stroke="#cbdcd8"/>
<text x="585" y="602" fill="#315f82" font-size="28" text-anchor="middle" font-weight="600">后续数据或事件</text>
<text x="585" y="638" fill="#263b42" font-size="24" text-anchor="middle" font-weight="400">计算并打包变更</text>
<path d="M585 661V709H230V756" fill="none" stroke="#247267" stroke-width="2.5" marker-end="url(#a)"/>
<text x="438" y="697" fill="#247267" font-size="24" text-anchor="middle" font-weight="400">跨线程提交变更</text>
<rect x="80" y="768" width="300" height="90" rx="12" fill="#fff" stroke="#cbdcd8"/>
<text x="230" y="822" fill="#247267" font-size="28" text-anchor="middle" font-weight="600">更新元素与布局</text>
<path d="M230 858V904" fill="none" stroke="#247267" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="80" y="916" width="300" height="78" rx="12" fill="#fff" stroke="#cbdcd8"/>
<text x="230" y="964" fill="#247267" font-size="28" text-anchor="middle" font-weight="600">更新绘制</text>
<text x="400" y="1050" fill="#647779" font-size="24" text-anchor="middle" font-weight="400">首屏展示的内容，取决于加载时已经获得的数据</text></g></svg>
