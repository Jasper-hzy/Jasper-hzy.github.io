<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc"><title id="title">Android 插件化实现原理图</title><desc id="desc">展示插件 Activity 从启动请求、系统校验、App 进程还原、类加载、资源和 native 环境接入的流程。</desc><defs><style>.bg{fill:#fffdf8}.title{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.sub{font:13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#526174}.box{fill:#fff;stroke:#435166;stroke-width:1.5;rx:12}.host{fill:#e9f5ff;stroke:#6aa6d8}.sys{fill:#fff4df;stroke:#d6a24a}.plugin{fill:#eef8ed;stroke:#71a96d}.warn{fill:#fff7ed;stroke:#fb923c}.label{font:700 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.txt{font:12.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#4b5563}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c8796;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow2)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c8796"/></marker></defs><rect class="bg" width="1180" height="650"/><text class="title" x="44" y="44">Android 插件化：系统校验看宿主，App 进程运行插件</text><text class="sub" x="44" y="72">启动阶段换壳或复用宿主声明，创建阶段还原插件组件，运行阶段补齐 ClassLoader / LoadedApk / Resources / SO。</text><rect class="host" x="44" y="110" width="300" height="440" rx="18"/><text class="label" x="70" y="142">App 进程：宿主</text><rect class="sys" x="440" y="110" width="300" height="440" rx="18"/><text class="label" x="466" y="142">system_server</text><rect class="plugin" x="836" y="110" width="300" height="440" rx="18"/><text class="label" x="862" y="142">插件运行环境</text><rect class="box" x="82" y="180" width="220" height="58" rx="12"/><text class="label" x="192" y="205" text-anchor="middle">startActivity</text><text class="txt" x="192" y="226" text-anchor="middle">插件 Intent</text><rect class="box" x="82" y="275" width="220" height="70" rx="12"/><text class="label" x="192" y="300" text-anchor="middle">MiraInstrumentation</text><text class="txt" x="192" y="321" text-anchor="middle">宿主声明则放行</text><text class="txt" x="192" y="338" text-anchor="middle">否则换成 StubActivity</text><rect class="box" x="82" y="395" width="220" height="70" rx="12"/><text class="label" x="192" y="420" text-anchor="middle">ActivityThread.H</text><text class="txt" x="192" y="441" text-anchor="middle">StubIntent 还原</text><text class="txt" x="192" y="458" text-anchor="middle">targetIntent / ActivityInfo</text><rect class="box" x="480" y="185" width="220" height="70" rx="12"/><text class="label" x="590" y="210" text-anchor="middle">ATMS / AMS</text><text class="txt" x="590" y="231" text-anchor="middle">只校验已安装 Manifest</text><text class="txt" x="590" y="248" text-anchor="middle">创建 ActivityRecord / Task</text><rect class="box" x="480" y="365" width="220" height="70" rx="12"/><text class="label" x="590" y="390" text-anchor="middle">回调 App 进程</text><text class="txt" x="590" y="411" text-anchor="middle">LAUNCH_ACTIVITY</text><text class="txt" x="590" y="428" text-anchor="middle">或 ClientTransaction</text><rect class="box" x="876" y="170" width="220" height="70" rx="12"/><text class="label" x="986" y="195" text-anchor="middle">PluginClassLoader</text><text class="txt" x="986" y="216" text-anchor="middle">一插件一个</text><text class="txt" x="986" y="233" text-anchor="middle">加载插件 dex / so</text><rect class="box" x="876" y="275" width="220" height="78" rx="12"/><text class="label" x="986" y="300" text-anchor="middle">LoadedApk</text><text class="txt" x="986" y="321" text-anchor="middle">插件包运行环境</text><text class="txt" x="986" y="338" text-anchor="middle">ClassLoader / Resources</text><rect class="box" x="876" y="395" width="220" height="78" rx="12"/><text class="label" x="986" y="420" text-anchor="middle">Resources / Native</text><text class="txt" x="986" y="441" text-anchor="middle">资源表 / Theme</text><text class="txt" x="986" y="458" text-anchor="middle">SO / namespace</text><path class="arrow" d="M192 238 L192 275"/><path class="arrow" d="M302 310 C360 310,410 220,480 220"/><path class="arrow" d="M590 255 L590 365"/><path class="arrow" d="M480 400 C390 400,355 430,302 430"/><path class="arrow" d="M302 430 C490 560,720 240,876 205"/><path class="arrow" d="M986 240 L986 275"/><path class="arrow" d="M986 353 L986 395"/><path class="dash" d="M302 310 C610 80,780 100,876 205"/><text class="txt" x="560" y="126">总 ClassLoader 按类名前缀路由到插件</text><rect class="warn" x="64" y="580" width="1052" height="44" rx="12"/><text class="txt" x="86" y="607">坑点：Stub 语义不一致、ClassLoader 冲突、资源 ID 冲突、Resources 缓存、Android 8+ SO namespace、旧 Intent、安全校验。</text></svg>
