<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" aria-labelledby="title desc"><title id="title">旧查询回填与新消息更新的交错时序</title><desc id="desc">读取任务开始时本地版本为十。新消息将缓存更新到十一。旧查询返回后必须校验版本，不能覆盖新快照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59727a"/></marker></defs><rect width="680" height="356" fill="#fcfdfc"/><g font-family="Microsoft YaHei, sans-serif" fill="#263b42"><rect x="50" y="18" width="130" height="43" rx="5" fill="#edf4f3" stroke="#cad7d5"/><text x="115" y="46.5" text-anchor="middle" font-size="20" fill="#263b42">读取任务</text><path d="M115 74V306" stroke="#ccd6d9" stroke-dasharray="5 6"/><rect x="285" y="18" width="130" height="43" rx="5" fill="#edf4f3" stroke="#cad7d5"/><text x="350" y="46.5" text-anchor="middle" font-size="20" fill="#263b42">内存缓存</text><path d="M350 74V306" stroke="#ccd6d9" stroke-dasharray="5 6"/><rect x="515" y="18" width="130" height="43" rx="5" fill="#edf4f3" stroke="#cad7d5"/><text x="580" y="46.5" text-anchor="middle" font-size="20" fill="#263b42">数据库</text><path d="M580 74V306" stroke="#ccd6d9" stroke-dasharray="5 6"/><path d="M115 99L580 99" stroke="#59727a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="347" y="89" text-anchor="middle" font-size="18" fill="#263b42">发起查询 · 记录 v10</text><rect x="275" y="135" width="150" height="48" rx="5" fill="#edf4f3" stroke="#cad7d5"/><text x="350" y="166" text-anchor="middle" font-size="20" fill="#263b42">新消息 → v11</text><path d="M580 223L115 223" stroke="#59727a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="348" y="213" text-anchor="middle" font-size="18" fill="#263b42">返回旧快照</text><path d="M115 278L350 278" stroke="#59727a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="227" y="265" text-anchor="middle" font-size="18" fill="#263b42">校验本地版本</text><rect x="387" y="254" width="241" height="46" rx="5" fill="#fbf0e9" stroke="#cad7d5"/><text x="507.5" y="284" text-anchor="middle" font-size="20" fill="#263b42">版本已变：拒绝覆盖</text><text x="340" y="337" text-anchor="middle" font-size="17" fill="#566b73">查询发出之后，缓存仍可被业务更新。</text></g></svg>