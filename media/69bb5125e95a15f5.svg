<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1330" role="img" aria-labelledby="title desc"><title id="title">会话数据访问整体架构</title><desc id="desc">业务模块通过统一数据访问层读写本地数据库。读取路径管理缓存与查询合并，保存路径优先提交消息和草稿，摘要路径基于已保存记录计算并合并写入。公共逻辑检查账号与版本，提交后更新缓存并通知页面。发送模块领取持久化待发任务并保存结果，同步模块保存服务端消息与同步位置，网络请求均在本地事务外执行。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#247267"/></marker></defs><rect width="800" height="1330" rx="12" fill="#fcfdfc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="32" y="42" font-size="29" fill="#263b42" text-anchor="start" font-weight="600">会话数据访问 · 整体架构</text><rect x="32" y="70" width="736" height="72" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="400" y="114" font-size="25" fill="#315f82" text-anchor="middle" font-weight="400">业务模块：会话列表 / 未读角标 / 消息编辑</text><path d="M260 153V202" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="184" font-size="21" fill="#566b73" text-anchor="end" font-weight="400">读写请求</text><path d="M540 202V153" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="184" font-size="21" fill="#566b73" text-anchor="start" font-weight="400">结果与更新通知</text><rect x="32" y="218" width="736" height="378" rx="10" fill="#f6f9f8" stroke="#cadbd7"/><text x="400" y="258" font-size="27" fill="#247267" text-anchor="middle" font-weight="600">统一数据访问层</text><rect x="56" y="285" width="216" height="215" rx="10" fill="#ffffff" stroke="#cadbd7"/><text x="164" y="326" font-size="26" fill="#247267" text-anchor="middle" font-weight="600">读取路径</text><text x="164" y="370" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">读取有效缓存</text><text x="164" y="410" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">合并相同查询</text><text x="164" y="450" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">检查查询版本</text><rect x="292" y="285" width="216" height="215" rx="10" fill="#ffffff" stroke="#cadbd7"/><text x="400" y="326" font-size="26" fill="#247267" text-anchor="middle" font-weight="600">保存路径</text><text x="400" y="370" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">消息 / 草稿</text><text x="400" y="410" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">事务提交后确认</text><text x="400" y="450" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">优先安排保存</text><rect x="528" y="285" width="216" height="215" rx="10" fill="#ffffff" stroke="#cadbd7"/><text x="636" y="326" font-size="26" fill="#247267" text-anchor="middle" font-weight="600">摘要路径</text><text x="636" y="370" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">读取已保存记录</text><text x="636" y="410" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">计算并合并摘要</text><text x="636" y="450" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">校验修订后提交</text><text x="400" y="543" font-size="23" fill="#315f82" text-anchor="middle" font-weight="400">提交后更新或失效缓存，并通知页面</text><text x="400" y="578" font-size="21" fill="#566b73" text-anchor="middle" font-weight="400">公共检查：账号归属 / 登录批次 / 数据版本</text><path d="M164 612V670" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="146" y="649" font-size="20" fill="#566b73" text-anchor="end" font-weight="400">查询 / 返回</text><path d="M400 608V670" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="382" y="649" font-size="21" fill="#566b73" text-anchor="end" font-weight="400">保存</text><path d="M636 612V670" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="616" y="649" font-size="20" fill="#566b73" text-anchor="end" font-weight="400">读取 / 写入摘要</text><rect x="32" y="686" width="736" height="170" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="400" y="723" font-size="27" fill="#315f82" text-anchor="middle" font-weight="600">本地数据库</text><text x="400" y="765" font-size="25" fill="#263b42" text-anchor="middle" font-weight="400">消息 · 草稿 · 已读位置 · 删除记录</text><text x="400" y="809" font-size="23" fill="#263b42" text-anchor="middle" font-weight="400">待发任务 · 会话摘要 · 数据修订 · 同步位置</text><path d="M132 868V914" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="111" y="899" font-size="20" fill="#566b73" text-anchor="end" font-weight="400">领取任务</text><path d="M320 914V868" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="899" font-size="20" fill="#566b73" text-anchor="end" font-weight="400">保存发送结果</text><path d="M604 914V868" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/><text x="582" y="899" font-size="20" fill="#566b73" text-anchor="end" font-weight="400">保存消息与同步位置</text><rect x="32" y="930" width="736" height="148" rx="10" fill="#f6f9f8" stroke="#cadbd7"/><rect x="48" y="946" width="336" height="112" rx="10" fill="#ffffff" stroke="#cadbd7"/><text x="216" y="984" font-size="26" fill="#247267" text-anchor="middle" font-weight="600">发送与重试</text><text x="216" y="1027" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">只领取已提交的待发任务</text><rect x="416" y="946" width="336" height="112" rx="10" fill="#ffffff" stroke="#cadbd7"/><text x="584" y="984" font-size="26" fill="#247267" text-anchor="middle" font-weight="600">消息接收与同步</text><text x="584" y="1027" font-size="22" fill="#263b42" text-anchor="middle" font-weight="400">按消息标识归并</text><path d="M216 1094V1140" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="196" y="1125" font-size="21" fill="#566b73" text-anchor="end" font-weight="400">发送 / 确认</text><path d="M584 1140V1094" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="564" y="1125" font-size="21" fill="#566b73" text-anchor="end" font-weight="400">接收 / 拉取</text><rect x="32" y="1156" width="736" height="64" rx="10" fill="#edf2f6" stroke="#cadbd7"/><text x="400" y="1197" font-size="24" fill="#315f82" text-anchor="middle" font-weight="400">服务端：保存消息 / 重复请求去重 / 消息同步</text><text x="400" y="1259" font-size="20" fill="#566b73" text-anchor="middle" font-weight="400">重启：重建摘要、恢复待发任务；退出登录：暂停任务、保留记录</text><text x="400" y="1298" font-size="20" fill="#566b73" text-anchor="middle">发送结果与同步消息入库时，复用上方保存路径</text></g></svg>
