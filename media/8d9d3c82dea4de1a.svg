<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 792" role="img" aria-labelledby="title desc"><title id="title">发送流程与页面状态</title><desc id="desc">消息与待发任务在同一事务提交后才显示等待发送。网络请求在事务外执行，服务端确认后再原子更新消息与待发状态。提交失败保留输入。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#247267"/></marker></defs><rect width="640" height="792" rx="12" fill="#fcfdfc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#263b42">
<rect x="32" y="24" width="396" height="86" rx="10" fill="#edf2f6" stroke="#cbd9e3"/>
<text x="54" y="59" font-size="26" fill="#315f82" font-weight="600" text-anchor="start">点击发送</text>
<text x="54" y="92" font-size="21" fill="#263b42" font-weight="400" text-anchor="start">固定消息标识、内容与草稿版本</text>
<text x="472" y="65" font-size="24" fill="#566b73" font-weight="400" text-anchor="start">保存中</text>
<path d="M230 120L230 154" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="168" width="396" height="176" rx="10" fill="#edf5f2" stroke="#cadbd7"/>
<text x="54" y="207" font-size="26" fill="#247267" font-weight="600" text-anchor="start">本地事务 · 原子提交</text>
<text x="54" y="245" font-size="24" fill="#263b42" font-weight="400" text-anchor="start">消息记录 + 待发任务</text>
<text x="54" y="282" font-size="22" fill="#263b42" font-weight="400" text-anchor="start">按版本清空草稿</text>
<text x="54" y="318" font-size="21" fill="#263b42" font-weight="400" text-anchor="start">增加数据修订，标记摘要过期</text>
<path d="M437 248L469 248" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/>
<text x="483" y="241" font-size="22" fill="#9a4936" font-weight="600" text-anchor="start">失败</text>
<text x="458" y="281" font-size="22" fill="#9a4936" font-weight="400" text-anchor="start">保留输入</text>
<text x="458" y="313" font-size="22" fill="#9a4936" font-weight="400" text-anchor="start">不发送请求</text>
<path d="M230 354L230 398" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="384" font-size="21" fill="#247267" font-weight="400" text-anchor="start">提交成功</text>
<rect x="32" y="411" width="396" height="76" rx="10" fill="#edf5f2" stroke="#cadbd7"/>
<text x="54" y="443" font-size="24" fill="#247267" font-weight="600" text-anchor="start">本地已保存 · 等待发送</text>
<text x="54" y="472" font-size="21" fill="#263b42" font-weight="400" text-anchor="start">更新缓存，唤醒发送模块</text>
<text x="458" y="450" font-size="24" fill="#247267" font-weight="400" text-anchor="start">等待发送</text>
<path d="M230 496L230 538" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="524" font-size="21" fill="#566b73" font-weight="400" text-anchor="start">事务外发送</text>
<rect x="32" y="551" width="396" height="76" rx="10" fill="#edf2f6" stroke="#cbd9e3"/>
<text x="54" y="584" font-size="26" fill="#315f82" font-weight="600" text-anchor="start">服务端接收</text>
<text x="54" y="612" font-size="21" fill="#263b42" font-weight="400" text-anchor="start">按账号 + 消息 ID 去重</text>
<path d="M230 637L230 678" fill="none" stroke="#247267" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="665" font-size="21" fill="#566b73" font-weight="400" text-anchor="start">收到确认</text>
<rect x="32" y="692" width="396" height="76" rx="10" fill="#edf5f2" stroke="#cadbd7"/>
<text x="54" y="724" font-size="25" fill="#247267" font-weight="600" text-anchor="start">本地确认事务</text>
<text x="54" y="753" font-size="18" fill="#263b42" font-weight="400" text-anchor="start">消息已发送 / 任务已确认</text>
<text x="458" y="718" font-size="20" fill="#566b73" font-weight="400" text-anchor="start">提交后显示</text>
<text x="470" y="752" font-size="24" fill="#247267" font-weight="600" text-anchor="start">已发送</text>
</g></svg>