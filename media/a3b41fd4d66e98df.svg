<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="340" viewBox="0 0 1520 340">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .text { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .box { stroke: #94a3b8; stroke-width: 2; rx: 13; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1520" height="340" fill="#f8fafc"/>
  <text x="760" y="48" text-anchor="middle" class="title">ART 源码阅读主线</text>

  <rect class="box" x="35" y="116" width="185" height="98" fill="#e0f2fe"/>
  <text x="127" y="154" text-anchor="middle" class="code">ClassLoader</text>
  <text x="127" y="180" text-anchor="middle" class="text">加载 DEX</text>

  <rect class="box" x="245" y="116" width="185" height="98" fill="#fef3c7"/>
  <text x="337" y="154" text-anchor="middle" class="text">方法执行入口</text>
  <text x="337" y="180" text-anchor="middle" class="small">选择编译代码或解释器</text>

  <rect class="box" x="455" y="116" width="185" height="98" fill="#fee2e2"/>
  <text x="547" y="154" text-anchor="middle" class="text">Interpreter</text>
  <text x="547" y="180" text-anchor="middle" class="small">解释执行并统计热度</text>

  <rect class="box" x="665" y="116" width="185" height="98" fill="#ffedd5"/>
  <text x="757" y="154" text-anchor="middle" class="text">JIT</text>
  <text x="757" y="180" text-anchor="middle" class="small">编译当前运行热点</text>

  <rect class="box" x="875" y="116" width="185" height="98" fill="#dbeafe"/>
  <text x="967" y="154" text-anchor="middle" class="code">ProfileSaver</text>
  <text x="967" y="180" text-anchor="middle" class="small">持久化 Runtime Profile</text>

  <rect class="box" x="1085" y="116" width="185" height="98" fill="#ede9fe"/>
  <text x="1177" y="154" text-anchor="middle" class="text">dexopt</text>
  <text x="1177" y="180" text-anchor="middle" class="small">协调后台编译</text>

  <rect class="box" x="1295" y="116" width="190" height="98" fill="#dcfce7"/>
  <text x="1390" y="154" text-anchor="middle" class="code">dex2oat</text>
  <text x="1390" y="180" text-anchor="middle" class="small">生成可复用 AOT 产物</text>

  <path class="line" d="M220 165 H245"/><path class="line" d="M430 165 H455"/>
  <path class="line" d="M640 165 H665"/><path class="line" d="M850 165 H875"/>
  <path class="line" d="M1060 165 H1085"/><path class="line" d="M1270 165 H1295"/>

  <text x="760" y="278" text-anchor="middle" class="small">先追方法执行路径，再追 Profile 如何跨越“本次运行”和“后续启动”</text>
</svg>
