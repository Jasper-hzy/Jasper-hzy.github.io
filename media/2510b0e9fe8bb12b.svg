<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" role="img" aria-labelledby="title desc"><title id="title">强弱引用对任务执行时对象状态的影响</title><desc id="desc">同样在业务释放引用后执行回调：强引用仍持有对象；弱引用在没有其他持有者时已失效。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59727a"/></marker></defs><rect width="680" height="302" fill="#fcfdfc"/><g font-family="Microsoft YaHei, sans-serif" fill="#263b42"><text x="188" y="38" text-anchor="middle" font-size="18" fill="#263b42">任务入队</text><text x="365" y="38" text-anchor="middle" font-size="18" fill="#263b42">业务释放引用</text><text x="560" y="38" text-anchor="middle" font-size="18" fill="#263b42">回调执行</text><text x="65" y="106" text-anchor="middle" font-size="20" fill="#263b42">强引用</text><path d="M140 96L618 96" stroke="#59727a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="140" y="74" width="116" height="44" rx="5" fill="#edf4f3" stroke="#cad7d5"/><text x="198" y="103" text-anchor="middle" font-size="20" fill="#263b42">self 持有</text><rect x="295" y="74" width="142" height="44" rx="5" fill="#edf4f3" stroke="#cad7d5"/><text x="366" y="103" text-anchor="middle" font-size="20" fill="#263b42">对象仍存活</text><rect x="493" y="74" width="134" height="44" rx="5" fill="#edf4f3" stroke="#cad7d5"/><text x="560" y="103" text-anchor="middle" font-size="20" fill="#263b42">执行 play()</text><text x="65" y="198" text-anchor="middle" font-size="20" fill="#263b42">弱引用</text><path d="M140 188L618 188" stroke="#59727a" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="140" y="166" width="116" height="44" rx="5" fill="#f2f4f5" stroke="#cad7d5"/><text x="198" y="195" text-anchor="middle" font-size="20" fill="#263b42">weak 观察</text><rect x="295" y="166" width="142" height="44" rx="5" fill="#f2f4f5" stroke="#cad7d5"/><text x="366" y="195" text-anchor="middle" font-size="20" fill="#263b42">对象已销毁</text><rect x="493" y="166" width="134" height="44" rx="5" fill="#f2f4f5" stroke="#cad7d5"/><text x="560" y="195" text-anchor="middle" font-size="20" fill="#263b42">lock() 为空</text><text x="340" y="274" text-anchor="middle" font-size="17" fill="#566b73">弱引用一行假设：业务释放后，没有其他强引用。</text></g></svg>